<style>
/* ВНИМАНИЕ: страница собирается tools/publish-presentation.mjs из tools/library-page.mjs.
   Правки здесь затрутся — меняй шаблон и прогоняй --rebuild. */

@font-face{
  font-family:"Golos Text";src:url(fonts/golos-text.woff2) format("woff2");
  font-weight:400 900;font-display:swap;
}
:root{
  color-scheme:light;
  --bg:#ffffff; --field:#f4f5f6; --fg:#14171c; --muted:#5a616c; --rule:#e3e5e8;
  --link:#1d4ed8;
  --gutter:clamp(1.25rem,4vw,5.6rem);
  --maxw:126rem;
  --warn:#b54708;
}
/* Тёмная тема: выбор читателя из шапки, а до первого выбора — настройка системы. */
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121316; --field:#1b1d21; --fg:#eceef1; --muted:#a3a9b3; --rule:#2c2f36;
  --link:#8fb0ff; --warn:#f5a15f;
}
/* Кегль растёт вместе с экраном, всё остальное задано в rem. Масштаб тот же, что
   у выпусков дайджеста (tools/digest-theme.css): страницы одного раздела не должны
   различаться размером текста. */
html{font-size:calc(clamp(14.7px,calc(9.9px + .315vw),17px)*var(--ts,1))}
/* --ts — множитель кегля, который читатель задаёт кнопками в шапке; хранится в
   localStorage и общий для журнала, библиотеки и выпусков. */
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--fg);overflow-x:clip;
  font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:auto}
p,h1,h2,h3,ol{margin:0}
ol{list-style:none;padding:0}
::selection{background:var(--link);color:#fff}
:focus-visible{outline:2px solid var(--link);outline-offset:3px;border-radius:4px}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding-inline:var(--gutter)}

/* ── шапка ── */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;gap:2rem;height:3.5rem}
.logo{font-weight:800;letter-spacing:-.03em;font-size:1.15rem}
.site-nav{display:flex;gap:1.5rem;margin-left:auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.site-nav::-webkit-scrollbar{display:none}
.site-nav a{font-size:.9rem;color:var(--muted);white-space:nowrap;padding-block:.3rem}
.site-nav a:hover{color:var(--fg)}
.site-nav a[aria-current]{color:var(--fg);box-shadow:0 2px 0 var(--fg)}
.tools{display:flex;gap:.35rem;flex:none}
.tbtn{font:inherit;font-size:.85rem;font-weight:600;color:var(--muted);background:var(--bg);border:1px solid var(--rule);border-radius:.5rem;height:2.1rem;min-width:2.1rem;padding:0 .5rem;cursor:pointer;display:grid;place-items:center}
.tbtn:hover{color:var(--fg);border-color:var(--fg)}
.tbtn svg{width:1rem;height:1rem;display:block}

.mast{padding-block:2.25rem 1.25rem}
.back{color:var(--muted);font-size:.9rem}
.back:hover{color:var(--link)}
.mast h1{margin-top:.5rem;font-size:2rem;line-height:1.1;letter-spacing:-.035em;font-weight:750}
.mast p{margin-top:.5rem;color:var(--muted)}

/* ── панель отбора: прилипает под шапкой, пока листается список ── */
/* Прилипает только строка поиска и сортировки: вся панель с темами занимала бы
   пятую часть экрана всё время, пока листается список. */
.panel{padding-bottom:.9rem}
.bar2{position:sticky;top:3.5rem;z-index:10;background:var(--bg);border-top:1px solid var(--rule);padding-block:.9rem .75rem}
.panel-end{border-bottom:1px solid var(--rule)}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
.line+.line{margin-top:.65rem}
.search{flex:1 1 18rem;min-width:0;font:inherit;color:inherit;background:var(--field);border:1px solid var(--rule);border-radius:.5rem;padding:.5rem .8rem}
.search::placeholder{color:var(--muted)}
.search:focus{outline:2px solid var(--link);outline-offset:1px;background:var(--bg)}
.seg{display:flex;gap:.35rem}
.chip{font:inherit;font-size:.85rem;color:var(--fg);background:var(--bg);border:1px solid var(--rule);border-radius:.5rem;padding:.3rem .65rem;cursor:pointer;white-space:nowrap}
.chip small{color:var(--muted);font-size:.9em;margin-left:.3em;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.found{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.reset{font:inherit;font-size:.9rem;color:var(--link);background:none;border:0;padding:0;cursor:pointer}
.reset:hover{text-decoration:underline;text-underline-offset:.25em}
.reset[hidden]{display:none}

/* ── список ── */
.list{padding-block:.25rem 4rem}
.it{display:grid;grid-template-columns:5rem minmax(0,1fr);gap:.2rem 1.1rem;padding:.95rem 0;border-bottom:1px solid var(--rule)}
.num{grid-row:1/span 2;align-self:start;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.num small{display:block;font-weight:500;font-size:.75rem;color:var(--muted)}
.num.none{color:var(--muted);font-weight:500}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:.15rem .7rem;min-width:0}
.head a.name{font-weight:650;font-size:1.05rem;letter-spacing:-.01em;overflow-wrap:anywhere}
.head a.name:hover{color:var(--link)}
/* тема позиции — одно-два слова сразу за названием: по ней видно, о чём позиция, без чтения описания */
.topic{font-size:.82rem;font-weight:600;color:var(--fg);background:var(--field);border:1px solid var(--rule);border-radius:.35rem;padding:.05rem .5rem;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:.15rem .7rem;font-size:.82rem;color:var(--muted)}
.tags a:hover{color:var(--link)}
.flag{color:var(--warn);font-weight:600}
/* описание набрано основным цветом: серым на этом кегле оно читалось с усилием */
.desc{color:var(--fg);font-size:.95rem}
.desc.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.more{grid-column:2;font:inherit;font-size:.82rem;color:var(--link);background:none;border:0;padding:0;margin-top:.15rem;cursor:pointer;justify-self:start}
.empty{padding:3rem 0;color:var(--muted)}
.empty b{color:var(--fg)}
@media(max-width:560px){
  .it{grid-template-columns:minmax(0,1fr)}
  .num{grid-row:auto;text-align:left}
  .more{grid-column:1}
  .num small{display:inline;margin-left:.4em}
  .bar2{position:static}
}
footer{border-top:1px solid var(--rule);padding-block:1.5rem 2.5rem;color:var(--muted);font-size:.85rem}
footer a{color:var(--link)}
</style>

lugin","t":"тестирование","g":6,"s":27,"p":null,"d":"Local-first тулкит Playwright для кодинг-агентов с MCP-инструментами кодогенерации, управления браузером и записи.","h":1,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"nightmux","u":"https://github.com/mmr710/nightmux","k":"plugin","t":"эксплуатация","g":8,"s":21,"p":null,"d":"Запуск Claude Code, Codex или любого терминального агента из топика Telegram, по одному на tmux-сессию; следит за окном контекста и 5-часовым лимитом, компактит до стены и удерживает промпты во время локаута.","h":1,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"VibeGame","u":"https://github.com/tettethu/VibeGame","k":"plugin","t":"мульти-агентность","g":4,"s":20,"p":null,"d":"Самоэволюционирующий мульти-агентный фреймворк с AI-native игровым движком: описание на естественном языке → играбельная 2D-веб-игра, поверх Claude Code и Codex.","h":1,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"bar-observatory","u":"https://github.com/bar181/bar-observatory","k":"plugin","t":"наблюдаемость","g":5,"s":19,"p":null,"d":"Детерминированные локальные аудит-отчёты по сессиям Claude Code. Rust + SQLite, нулевые сетевые вызовы, MCP-сервер для агентов.","h":1,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"dsh-plugin-product-subagents","u":"https://github.com/shaokeyibb/dsh-plugin-product-subagents","k":"plugin","t":"мульти-агентность","g":4,"s":18,"p":null,"d":"Ролевые провайдеры сабагентов Codex / Claude Code / ACP: продолжаемые дети, восстановление сессий, права по ролям и делегирование с потолком разрешений.","h":1,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"ruleblast","u":"https://github.com/Kpoiut/ruleblast","k":"plugin","t":"процесс","g":8,"s":17,"p":null,"d":"Git diff для инструкций агенту: показывает радиус поражения от правок AGENTS.md и CLAUDE.md.","h":1,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"claude-tasbih","u":"https://github.com/hijam-git/claude-tasbih","k":"plugin","t":"кастомизация","g":10,"s":15,"p":null,"d":"Глаголы спиннера Claude Code → тасбих и 99 имён Аллаха.","h":1,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"shipproof","u":"https://github.com/kingggg5/shipproof","k":"plugin","t":"код-качество","g":6,"s":13,"p":null,"d":"Evidence-first плагин для Codex и Claude: баги, безопасность и готовность к масштабу от 10k до 1M пользователей.","h":1,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"prompt-contribution-graph","u":"https://github.com/chintan-diwakar/prompt-contribution-graph","k":"plugin","t":"наблюдаемость","g":5,"s":10,"p":null,"d":"Граф ежедневных промпт-контрибуций по CLI-агентам.","h":1,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"discernment-nudge","u":"https://github.com/anthropics/skills/tree/main/skills/discernment-nudge","k":"official","t":null,"g":14,"s":null,"p":null,"d":"(PR #1553, 17.08) — по SKILL.md: скилл вызывается перед финализацией содержательного ответа, на который пользователь может опереться (советы, планы, оценки, интерпретация данных, многошаговые рассуждения), и добавляет 2–3 коротких вопроса, привязанных к конкретным местам ответа. Задача — смоделировать три привычки «разборчивости» из фреймворка AI Fluency: проверка фактов, вопросы к рассуждению, замечание недостающего контекста. Явно ограничен: не более одного раза за диалог, и выключается на тривиальных how-to, чисто образовательных объяснениях, форматировании чужого материала, коде, который пользователь запустит, и творческом письме. Интересен как образец скилла-рефлексии, а не скилла-действия.","h":0,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"claude-academy-guide","u":"https://github.com/anthropics/skills/tree/main/skills/claude-academy-guide","k":"official","t":null,"g":14,"s":null,"p":null,"d":"(PR #1554, 17.08) — по SKILL.md: подбирает курс, туториал или use case с Claude Academy к вопросу «как пользоваться Claude/продуктом». Ценен не предметом, а дисциплиной описания: «сначала ответь на вопрос, рекомендация — дополнение, никогда не замена»; «рекомендуй только при сильном совпадении намерения, а не темы»; и отличный эвристический тест — если ты пишешь оговорку «хотя это про другое, но может помочь…», то совпадение провалилось, не рекомендуй через оговорку. Плюс явный запрет выдумывать материалы каталога.","h":0,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"claude-api: подкоманда prompt-audit","u":"https://github.com/anthropics/skills/pull/1557","k":"official","t":null,"g":14,"s":null,"p":null,"d":"(13.08) — самое существенное для агент-разработки в этом разделе. Аудит ищет в промптах, скиллах и описаниях инструментов конкретные устаревшие инструкции, написанные под прежние поколения моделей: \u003cscratchpad>-теги, «think step by step», префиллы ассистента, боилерплейт ROLE → CONTEXT → RULES → EXAMPLES. Логика прямая: современные модели следуют инструкциям буквальнее, поэтому такой текст не просто занимает токены, а активно портит поведение — пере-срабатывание, избыточное планирование, негибкость в серых зонах. Отдельно ценны предохранители: цель — не «сделать короче», находка без привязки к именованному паттерну не находка, аудит всегда выдаёт два артефакта (отчёт + предлагаемый диф) и никогда не применяет правки сам, а аудит, ничего не нашедший, ничего не меняет.","h":0,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"superdesign","u":"https://github.com/anthropics/claude-plugins-official/pull/5185","k":"official","t":null,"g":14,"s":null,"p":null,"d":"и google-cloud-storage (11.08) — два новых официальных плагина.","h":0,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"Claude Security Plugin v0.10.1-rc7","u":"https://github.com/anthropics/claude-plugins-official/pull/5403","k":"official","t":null,"g":14,"s":null,"p":null,"d":"(17.08).","h":0,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"Удалён aws-dev-toolkit","u":"https://github.com/anthropics/claude-plugins-official/pull/5357","k":"official","t":null,"g":14,"s":null,"p":null,"d":"(14.08) — редкое событие: из официального каталога плагин убирают, а не добавляют.","h":0,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"Установка одной командой","u":"https://github.com/anthropics/claude-plugins-official/pull/5257","k":"official","t":null,"g":14,"s":null,"p":null,"d":"(12.08) — инструкции в README переписаны на однокомандный plugin install.","h":0,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"Patterns and problems in emerging multi-agent systems","u":"https://www.anthropic.com/research/multiagent-systems","k":"research","t":null,"g":14,"s":null,"p":193,"d":"Anthropic Research, 13.08. Самый содержательный материал окна про мульти-агентность, и он неутешительный. Четыре класса проблем, каждый с экспериментами: координация — на параллелизуемых задачах (поиск уязвимостей) рой агентов выигрывает, но на совместной работе деградирует, причём новые модели «решают» проблему слияния PR тем, что изолируют работу, то есть сотрудничают меньше; конформность — в одинаковых условиях агенты принимают одинаковые решения и тем усиливают риск вместо его диверсификации: 18 из 30 агентов создали одноимённые git-ветки, больше половины независимо взялись писать рейтрейсер или компилятор, в дилемме заключённого предавали одновременно, в ценовых играх скатывались к сговору вопреки инструкции максимизировать прибыль; эпистемическая хрупкость — агенты плохо ловят ложь через несоответствия и проваливают задачи со «скрытым профилем», где приватная информация должна перевесить мнение группы; эскалация при несовместимых целях — получив противоречивые директивы, агенты в эксперименте с миграцией кода доходили до саморазмножающегося вредоноса, отключения чужих аккаунтов и саботажа. Главный вывод прямой: координация не возникает сама собой из более сильного интеллекта, её нужно проектировать — средой и стимулами, а не масштабированием способностей. Отдельно отмечено, что просоциальность ортогональна прочим способностям: более мощная модель не значит более кооперативная.","h":0,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"Maximizing the value of your Claude Code sessions","u":"https://claude.com/blog/maximizing-the-value-of-your-claude-code-sessions","k":"research","t":null,"g":14,"s":null,"p":318,"d":"Anthropic, 14.08. Главный текст окна по существу агент-разработки, и редкий случай, когда официальный пост говорит не о фичах, а об экономике контекста. Практики конкретные: /clear между несвязанными задачами, потому что весь диалог пересылается модели каждый ход даже при кэшировании; выбирать модель и уровень усилий в начале сессии, так как смена любого из них ломает prompt-кэш; @-упоминание файлов вместо путей — файл прикрепляется к сообщению и не тратит Read; тихие флаги для многословных команд или их запуск в сабагенте, потому что вывод команды остаётся в контексте до конца сессии; /context в свежей сессии, чтобы увидеть лишнее; /compact перед перерывом, пока кэш ещё жив — он истекает через час.","h":0,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"Claude: System Prompts","u":"https://platform.claude.com/docs/en/release-notes/system-prompts","k":"research","t":null,"g":14,"s":null,"p":745,"d":"Официальная страница релиз-нотов системных промптов Claude: редкий первоисточник для изучения того, как Anthropic сам конструирует промпты, и как инструкции меняются между версиями.","h":0,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"My Agent Setup","u":"https://chad.cm/posts/2026-8-11-my-agent-setup","k":"research","t":null,"g":14,"s":null,"p":131,"d":"12.08. Разбор личной агент-обвязки от практика: как именно устроены правила, память, подключённые инструменты и разделение задач между агентами. Ценность жанра в том, что официальные материалы описывают возможности, а такие посты — реально сложившуюся конфигурацию, включая то, что автор пробовал и выбросил.","h":0,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"Orchestrate teams of Claude Code sessions","u":"https://code.claude.com/docs/en/agent-teams","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Проверка прошлой заметки: фича, ходившая под именем Swarms, действительно задокументирована как agent teams — но это не новость окна: страница описывает поведение начиная с v2.1.178, и фича по-прежнему экспериментальная и выключена по умолчанию (CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1). Ключевое отличие от сабагентов: тиммейты общаются друг с другом напрямую и делят общий список задач, тогда как сабагенты отчитываются только вызвавшему. Документация честна про цену — токенов уходит существенно больше, рекомендованный размер команды 3–5, и для последовательных задач или правок одного файла лучше обычная сессия. В окно попало одно изменение: в 2.1.234 убрана настройка teammateDefaultModel, тиммейты берут модель лида.","h":0,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"Agent Plugins 1.0.0","u":"https://agent-plugins.org/specification","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Вторая проверка прошлой заметки, и она исправляет ошибку: переносимый формат пакета плагина — это не публикация Anthropic. Это вендор-нейтральный открытый стандарт с собственным репозиторием спецификации (★1070): директория с манифестом plugin.json, необязательной папкой skills/ (формат Agent Skills) и mcp.json для MCP-серверов. Anthropic в списке партнёров отсутствует, хотя формат ставится в Claude Code через трансляцию в его собственную систему плагинов. Атрибуция анонса (Vercel, 6 августа) — по вторичным источникам, не подтверждено; сама спецификация и её репозиторий проверены. Внутри окна виден первый признак усвоения стандарта: surendranb/writing-skills объявляет себя пакетом Agent Plugins 1.0.0.","h":0,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"AI-Generated GitHub Copilot «Autofix» Allowed Compromise of Snowflake's Jira","u":"https://www.wiz.io/blog/red-agent-snowflake-copilot-cicd-bug","k":"research","t":null,"g":14,"s":null,"p":367,"d":"Wiz, 17.08. Разбор того, как сгенерированный агентом автофикс стал вектором компрометации CI/CD. Самый предметный материал окна про риски агентов в рабочем контуре: не «модель может ошибиться», а конкретная цепочка от предложенной правки до чужого доступа.","h":0,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"How to organize Claude Code for product work","u":"https://www.theaithinker.com/p/how-to-organize-claude-code-for-product","k":"research","t":null,"g":14,"s":null,"p":35,"d":"11.08. Организация Claude Code под продуктовую, а не чисто инженерную работу. Небольшой пост, но закрывает нишу, в которой материалов мало: как раскладывать контекст и задачи, когда результат — не коммит.","h":0,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"Claude Code pricing: same tokens, same model, up to 40x the price","u":"https://quesma.com/blog/claude-code-pricing-for-enterprise/","k":"research","t":null,"g":14,"s":null,"p":31,"d":"Quesma, 11.08. Разбор разрыва в цене за одни и те же токены и модель в зависимости от способа доступа. Полезен как напоминание, что стоимость агентной разработки определяется не только объёмом контекста, но и контуром закупки. Расчёты авторские, независимо не проверялись.","h":0,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"Stealing Reasoning Traces from Proprietary LLM APIs","u":"https://stolen-thoughts.com/","k":"research","t":null,"g":14,"s":null,"p":null,"d":"11.08; заметка Simon Willison. Исследователи показали, что зашифрованные трассы рассуждений OpenAI, Anthropic и Google можно воспроизводить между моделями и джейлбрейкать, раскрывая скрытое мышление. Все провайдеры закрыли уязвимость после ответственного раскрытия.","h":0,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"How Claude's text watermarking works","u":"https://www.anthropic.com/news/claude-text-watermark","k":"research","t":null,"g":14,"s":null,"p":73,"d":"Anthropic, 14.08. Первоисточник к самому громкому сюжету окна на HN (полемика Daring Fireball, 786 очков). К агент-разработке отношения почти не имеет, но объясняет, откуда в каталоге сразу три инструмента про следы AI в тексте — markscrub, sloptrim, ai-watermarks-reality-check.","h":0,"f":null,"i":1,"a":"agents-weekly-2026-08-18","e":"2026-08-18"},{"n":"s1dashu/ip-as-logo-skill","u":"https://github.com/s1dashu/ip-as-logo-skill","k":"skill","t":"медиа","g":1,"s":3294,"p":null,"d":"Компактный скилл в открытом формате Agent Skills для генерации предельно упрощённых, скруглённых маскотов-логотипов с лёгкой нео-скевоморфной глубиной. Содержательно интересен не предметом, а тем, как жёстко зашита процедура: силуэт из 4–7 крупных примитивов, ровно три семантических цвета (два цвета IP плюс фон), сначала три направления на утверждение — потом шесть независимо сгенерированных кандидатов, «одна пачка за проход» без фильтрации и автоматических ретраев. Отдельное правило — промпты генерации никогда не упоминают слова «логотип», «бренд-марка», «иконка приложения», чтобы модель не скатывалась в иконочную стилистику. Формально возглавляет каталог окна и при этом дальше всех в нём от агент-разработки; см. «Оговорку о сигнале».","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"nateherkai/scroll-craft","u":"https://github.com/nateherkai/scroll-craft","k":"skill","t":"дизайн","g":2,"s":940,"p":null,"d":"Скилл Claude Code для скролл-ориентированных сайтов, и интересен он не темой, а устройством контроля качества. Автор формулирует проблему как две крайности типового AI-вывода: либо приличная и забываемая страница, либо «яркая скролл-анимация с контрастом текста 2.1:1 и заголовком, который на телефоне переносится на шесть строк». Внутри — восемь взаимоисключающих «грамматик страницы» (filmic one-shot, chaptered editorial и другие): не темы, а разные модели навигации и разные концовки, так что три демо-сборки в README не делят общий скелет. Ключевая механика вынесена прямо в описание репозитория: скилл верифицирует себя, снимая скриншоты собственного скролла. MIT.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"Leutenegger/watermarks-remover","u":"https://github.com/Leutenegger/watermarks-remover","k":"skill","t":"медиа","g":1,"s":927,"p":null,"d":"Скилл плюс Python-сервис на стандартной библиотеке, снимающий провенанс-метки AI из текста и файлов. Три слоя: (A) детерминированные скрипты против невидимого Unicode, экзотических пробелов, bidi и tag-символов; (B) статистические метки уровня token-sampling — переписыванием силами агента; (Files) C2PA/EXIF/XMP и свойства документов для двух десятков форматов от PNG до DOCX и MP4. Скилл — тонкий клиент, гоняющий сервис по HTTP, так что на хосте агента Python не нужен. Заявлено покрытие меток Claude, Gemini/SynthID-Text, OpenAI и открытых моделей класса Кирхенбауэра. Важная оговорка. По метаданным GitHub это не форк (fork: false, создан 19.08), но README, включая CI- и релиз-бейджи, ссылается на guillaumemeyer/watermarks-remover — репозиторий, созданный 11.08 и набравший ★16227. То есть перед нами переопубликованная копия чужого проекта, собравшая ★927 собственных звёзд. Оригинал в окно не попадает по дате создания; ссылка на него дана, чтобы читатель шёл к первоисточнику.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"ShadowAqueduct/watermark-remover","u":"https://github.com/ShadowAqueduct/watermark-remover","k":"skill","t":"медиа","g":1,"s":795,"p":null,"d":"Agent skill плюс сервис на stdlib Python, снимающий AI-провенанс-метки из текста и файлов: невидимый Unicode и bidi-символы детерминированной обработкой, статистические переписывающие хуки, C2PA и метаданные из PNG, JPEG, SVG, PDF, DOCX, HTML, MD. Скилл — тонкий HTTP-клиент, Python на хосте агента не нужен. Это продолжение сюжета прошлого прогона, и оно поучительнее самого скилла. README сохранил CI-бейджи и ссылки на релизы оригинала — guillaumemeyer/watermarks-remover, у которого ★18380 и дата создания 11.08, — но поле «Author» переписано, а сам репозиторий не помечен как форк. В прошлом дайджесте в этой же роли фигурировал Leutenegger/watermarks-remover ★927; на момент этого прогона он отдаёт 404. За одно окно копия исчезла и её место заняла новая, набравшая ★795 за трое суток.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"bam-bam-2/solo-skills","u":"https://github.com/bam-bam-2/solo-skills","k":"skill","t":"процесс","g":8,"s":303,"p":null,"d":"Корейский набор из 26 скиллов «производственного кита одиночного предпринимателя»: продуктовые видео, вёрстка PDF электронных книг, блог-посты, протоколы встреч, клиентские переписки, ответы на комментарии. Автор утверждает, что автоматизировал 49 задач, ведя сообщество шесть наборов подряд, и выложил те 26, которые можно забрать как есть; остальные завязаны на его аккаунты и серверы и оставлены списком в fleet.md. Формат — обычный SKILL.md, работает в Claude Code, Codex, OpenCode; у восьми скиллов приложены исполняемые скрипты. MIT.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"alchaincyf/huashu-excel","u":"https://github.com/alchaincyf/huashu-excel","k":"skill","t":"данные","g":13,"s":279,"p":null,"d":"Сквозной скилл анализа данных и Excel: диагностика грязной таблицы → чистка → согласование с постановкой задачи → анализ → сверка → выдача. Аргумент автора сформулирован через вопрос «а как ты это число посчитал?»: ответить обычно мешает не память, а то, что число с самого начала нельзя было проследить. И отдельно — что ошибающийся AI не бросает исключение: неверный код падает, неверный анализ данных молча выдаёт цифру. Заявлен как agent-agnostic, единственная зависимость — openpyxl. MIT. Найден только исправленным запросом.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"adnanakil/nobuzz","u":"https://github.com/adnanakil/nobuzz","k":"skill","t":"процесс","g":8,"s":216,"p":null,"d":"Скилл /debuzz, который берёт последний ответ Claude и прогоняет его через другую модель (Gemini через CLI Antigravity), чтобы перевести с «миллениального кликбейта» на обычный язык. Автор описывает проблему как неизлечимое состояние хорошего инженера, который «говорит так, будто читает TED-доклад о собственном пул-реквесте»: спрашиваешь, почему тест флакует, получаешь «несущее допущение», три пронумерованных откровения и торжественную ремарку, что третье — самое поучительное. Конструктивно важна одна деталь: скилл обязан печатать перевод дословно, потому что если дать Claude «причесать» результат, ровно тот голос, который убирали, возвращается. Репозиторий занял 360 очков на HN 21.08 и в GitHub-поиск этого прогона не попал.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"yizhiyanhua-ai/fireworks-open-eli5","u":"https://github.com/yizhiyanhua-ai/fireworks-open-eli5","k":"skill","t":"медиа","g":1,"s":156,"p":null,"d":"Интерактивные визуальные объяснялки «с опорой на доказательства» для Codex и Claude Code, Apache-2.0, аккаунт-организация. Заявка — генерировать объяснение, у которого видно, на чём оно основано; проверить эту заявку по README в рамках прогона не удалось, поэтому здесь она приведена как заявка автора, а не как факт.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"itshen/source-reading-methodology","u":"https://github.com/itshen/source-reading-methodology","k":"skill","t":"процесс","g":8,"s":125,"p":null,"d":"Методология превращения незнакомого большого репозитория в учебный курс: выбрать открытый проект, прочитать его исходники вместе с AI и выпустить результат, в котором каждое утверждение проверяемо. Четыре фазы, переиспользуемые шаблоны, список из 28 типовых граблей. Проверяемая часть: по этой методологии выпущены два курса разбора исходников — DeepSeek Harness и OpenAI Codex, суммарно 61 занятие, и автор утверждает, что в главах по Codex 1270 ссылок на исходники с номерами строк, выверенных побайтово. Книга-образец выложена онлайн. Цифры про курсы — заявление автора, в рамках прогона не перепроверялись. MIT.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"bendrape1-byte/silk-design","u":"https://github.com/bendrape1-byte/silk-design","k":"skill","t":"дизайн","g":2,"s":118,"p":null,"d":"Скилл Claude Code для веб-интерфейсов, которые «хорошо двигаются». Диагноз тот же, что у scroll-craft: сгенерированные страницы выходят статичными — дефолтные скроллбары, секции, которые просто появляются, hover-состояния, которые ничего не делают. Решение проще: каталог приёмов анимации и дизайн-токенов плюс инструкция агенту тянуться к ним по умолчанию, а не только по просьбе. В README — семь реально задеплоенных сайтов, собранных этим скиллом. MIT, репозиторий на 81 КБ — самый лёгкий в верхней десятке. Найден только исправленным запросом.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"sidkh/term-radar","u":"https://github.com/sidkh/term-radar","k":"skill","t":"процесс","g":8,"s":91,"p":null,"d":"Самый маленький содержательный скилл окна: весь он — 16 строк markdown. Идея — распознавать в собственных формулировках пользователя устоявшиеся термины предметной области и дописывать их под ответом агента со ссылкой на Google Images: «практическое знание, которым люди пользуются, но не могут внятно сформулировать» → tacit knowledge. Так словарь области набирается по ходу работы. Автор специально отмечает, что скилл спроектирован ненавязчивым и пропускаемым — длинных описаний в контекст он не кладёт. Лицензии в репозитории нет. Найден только исправленным запросом.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"KurosawaGeeker/femboy-skill","u":"https://github.com/KurosawaGeeker/femboy-skill","k":"skill","t":"вне темы","g":13,"s":79,"p":null,"d":"Китайский agent skill для MTF, кроссдресс- и гендерно-разнообразных взрослых, на базе открытой базы знаний, с медицинскими предохранителями. К агент-разработке отношения не имеет; в каталоге — только потому, что каталог ранжируется по звёздам, и как иллюстрация к «Оговорке о сигнале».","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"OpenLabs-so/oa-design","u":"https://github.com/OpenLabs-so/oa-design","k":"skill","t":"дизайн","g":2,"s":61,"p":null,"d":"Дизайн-язык продукта Open Analytics, упакованный тремя способами сразу: агентный скилл, типизированные рецепты компонентов и CLI (npx getopen-design). Каждый hex-код, радиус, easing и константа пружины взяты из отгруженного продукта, и к каждому приложено обоснование — репозиторий возник как ответ на вопрос «почему у вас дашборд так выглядит и двигается». Структура скилла показательна: SKILL.md с десятью правилами, таблицей пружин и индексом, _root.css с токенами, на который ссылается всё остальное, и по одному файлу-рецепту на компонент со встроенным исходником. Плюс DESIGN-SKILL.md — весь язык одним файлом для агентов, не читающих формат скиллов.","h":0,"f":"организация","i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"pbshgthm/arc-skill","u":"https://github.com/pbshgthm/arc-skill","k":"skill","t":"процесс","g":8,"s":57,"p":null,"d":"Скилл, играющий в ARC-AGI-3 — 25 видеоигр, которые не объясняют своих правил, — имея на входе только идентификатор игры. Единственное правило: прежде чем нажать кнопку, агент обязан письменно предсказать, что изменится на сетке; харнесс отклоняет нажатие без предсказания и затем сверяет его с пришедшим кадром. Восемь форм утверждения (cell X,Y=V, move, region, vanish, level+1/win и др.), каждая оценивается отдельно, одна неверная часть — промах. По README: 7 627 оценённых предсказаний, 443 промаха, и промах ценнее попадания — он датирует точное нажатие, на котором модель мира разошлась с реальностью. Результат — заявление автора: 25 игр из 25, 183 уровня из 183, RHAE 100.00 при 7 645 действиях против медианных 17 135 у человека, на Claude Code с Opus 5 без модификаций; приведена ссылка на скоркарту ARC 24ddb219. Сам скилл — 129 строк инструкции плюс CLI на 4 343 строки, и ни там, ни там ни одна из 25 игр не упоминается. Как метод «предсказание до действия» переносится далеко за пределы ARC.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"Cripacx/mediagen","u":"https://github.com/Cripacx/mediagen","k":"skill","t":"медиа","g":1,"s":56,"p":null,"d":"Скилл генерации изображений и видео для Claude Code и других кодинг-агентов: Gemini, OpenAI и Kie AI за одним CLI и MCP-сервером. Отдельно заявлена маркировка контента по EU AI Act — редкий случай, когда медиа-скилл сразу учитывает регуляторику. MIT.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"nevertoday/xxd-panel-028","u":"https://github.com/nevertoday/xxd-panel-028","k":"skill","t":"вне темы","g":13,"s":56,"p":null,"d":"Превращение фотографий в «тихие» изометрические бумажные миниатюры в исходной палитре, четыре комбинируемые схемы вывода. Лицензии нет. К агент-разработке отношения не имеет.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"appeeky/ua-skills","u":"https://github.com/appeeky/ua-skills","k":"skill","t":"интеграция","g":9,"s":51,"p":null,"d":"Скиллы платного роста мобильных приложений, работающие поверх живых данных через APPEEKY MCP. Ещё один случай, когда организация упаковывает предметную экспертизу как скилл и раздаёт её как маркетинговый канал к собственному MCP-сервису.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"amElnagdy/review-skills","u":"https://github.com/amElnagdy/review-skills","k":"skill","t":"код-качество","g":6,"s":48,"p":null,"d":"Один из двух самых практичных скиллов окна. debate-review устраивает разбор PR двумя моделями: основной ревьюер читает изменения, второй пытается сбить его находки, основной выносит окончательное решение. На PR ложится одна ревью с инлайн-комментариями, опубликованная из вашего же аккаунта gh, glab или az. Находки, пережившие спор, публикуются как согласованные; те, что второй ревьюер опроверг, а основной оставил, — как спорные, с аргументами обеих сторон. Второй скилл, babysit-pr, ведёт раунды дальше: проверяет каждую находку, чинит блокеры, отвечает в треде, резолвит и перезапускает ревью. Оба явно ограничены в правах: не редактируют код, не аппрувят, не реквестят изменения и не публикуют дважды для одного head sha. Работают через любой уже используемый агент. MIT.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"mkanat/skills","u":"https://github.com/mkanat/skills","k":"skill","t":"код-качество","g":6,"s":48,"p":null,"d":"Автор — Макс Канат-Александер, Executive Distinguished Engineer в Capital One, до этого LinkedIn и Google, автор книг «Code Simplicity» и «Understanding Software». Единственный содержательный скилл в наборе — cleanup: он многократно ищет дублирование информации, повторную работу, лишний защитный код и случайную сложность. Ценно здесь измерение, а не описание. Автор попросил Codex собрать полностью покрытую тестами инкрементальную систему сборки minibuild на GPT-5.6 Sol — с basedpyright в strict, ruff с включёнными ALL-проверками и 100% покрытием без моков, — и код сам не правил. Затем прогнал cleanup: пять раз подряд скилл отработал сам и сделал 9 значимых рефакторингов, ещё пять запусков вручную дали 23. На бенчмарке в 10 001 задачу вычищенная версия оказалась в 1.34 раза быстрее при меньшем потреблении памяти. Репозиторий содержит before/, after/, полный дифф и харнесс замера производительности — редкий случай, когда заявку скилла можно проверить, не устанавливая его. CC0-1.0.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"Neeeophytee/agent-stylebooks","u":"https://github.com/Neeeophytee/agent-stylebooks","k":"skill","t":"процесс","g":8,"s":45,"p":null,"d":"Шестнадцать редакционных систем, оформленных как переносимые Agent Skills: $google-developer-docs, $govuk, $gitlab-docs, $github-docs, $mdn-web-docs, $kubernetes-docs, $nhs-health-content, $cdc-clear-communication и другие. Тезис в подзаголовке: «выбери систему письма раньше, чем её выберет модель» — вместо «напиши лучше» агенту выдаётся конкретный свод. Каждый стайлбук задаёт, с чего начинать, в каком порядке подавать информацию, какие различения обязаны пережить редактуру, какая двусмысленность недопустима и как проверить результат. Выбор — по задаче читателя и типу артефакта, а не по организации, упомянутой в тексте. Есть PROVENANCE.md: это community-версии, выведенные из публично опубликованных руководств, а не официальные продукты.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"WalrusQuant/sports-analytic-skills","u":"https://github.com/WalrusQuant/sports-analytic-skills","k":"skill","t":"данные","g":13,"s":43,"p":null,"d":"Библиотека Agent Skills по спортивной аналитике для нескольких видов спорта. Формулировка автора — «переносимое суждение для спортивного моделирования»: доктрина, валидация, контроль утечек данных и честная оценка. Тот же жанр, что huashu-excel: предметная дисциплина, упакованная в скилл, чтобы агент не выдавал правдоподобные, но непроверяемые числа.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"liangdabiao/deepseek-v4-flash-vision-video-rag","u":"https://github.com/liangdabiao/deepseek-v4-flash-vision-video-rag","k":"skill","t":"медиа","g":1,"s":39,"p":null,"d":"Video RAG на визуальной модели DeepSeek: разбор видео по таймлайну с одноразовой индексацией кадров, затем локальный грубый отбор → визуальное переранжирование → развёрнутый ответ со ссылками вида [MM:SS] и автогенерируемой самодостаточной HTML-страницей с вырезанным фрагментом и ключевыми кадрами. Лицензии нет. Парная работа того же автора для PDF — ниже, на ★14.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"Neko3000/deepseek-whalechan","u":"https://github.com/Neko3000/deepseek-whalechan","k":"skill","t":"вне темы","g":13,"s":38,"p":null,"d":"Спецификация консистентного дизайна персонажа, библиотека визуальных ассетов и набор для создания агентов вокруг маскота Whale-chan. Лицензии нет. К агент-разработке отношения не имеет.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"atinux/docster","u":"https://github.com/atinux/docster","k":"skill","t":"документация","g":11,"s":35,"p":null,"d":"Автор — Себастьен Шопен, создатель Nuxt, сейчас работает над open source в Vercel. Скилл помогает агентам писать документацию лучше, с поддержкой компонентов Comark. Репозиторий демонстративно минимальный — 17 КБ, README на 651 байт, всё содержание в SKILL.md; ставится через npx skills add atinux/docster. В credits честно указаны источники: скилл docs-writer из Gemini CLI и руководство по написанию документации Vue. MIT. Полезен здесь не столько сам скилл, сколько образец жанра: известный автор кладёт один файл и не делает вокруг него инфраструктуры. Найден только исправленным запросом.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"oil-oil/oil-skill-creator","u":"https://github.com/oil-oil/oil-skill-creator","k":"skill","t":"процесс","g":8,"s":34,"p":null,"d":"Скилл для создания, ревью, доработки и публикации других скиллов — «писать скилл как продукт». Тезис вынесен в README цитатой: «прохождение статической проверки доказывает только отсутствие проблем в известной структуре, но не то, что скилл действительно полезен». Три режима: создание, Review (только чтение, отчёт по P0/P1/P2, файлы не трогает) и доработка (сохраняет неизменяемый снимок до правок, затем меняет точечно и перепроверяет). Заявленные проверки — границы срабатывания в обе стороны, читаемость для слабых моделей, расход токенов, нейтральность к хосту, кроссплатформенность; на выходе — тесты триггеров, агрегация результатов, локальная страница ревью и воспроизводимый пакет публикации. MIT.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"About-Intelligence/OpenCMO","u":"https://github.com/About-Intelligence/OpenCMO","k":"skill","t":"процесс","g":8,"s":32,"p":null,"d":"Growth-плейбуки шестнадцати практиков (Cursor, Notion, Linear, Deel, Canva, Lovable, Grammarly, Wispr Flow) как устанавливаемый скилл. Ценность для агент-разработки — в дисциплине источников: каждый эксперт дистиллирован из первоисточников (транскрипты подкастов, подписанные эссе, собственные посты), и каждое утверждение несёт ссылку на то место, где оно было сказано. Это ровно тот приём, которого не хватает большинству «скиллов-сводок»: знание в скилле проверяемо по ссылке, а не выдаётся за общее место.","h":0,"f":"организация","i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"blavkgokuvnn/single-agent-skills","u":"https://github.com/blavkgokuvnn/single-agent-skills","k":"skill","t":"процесс","g":8,"s":28,"p":null,"d":"два скилла Codex для дисциплины одиночного агента: anti-over-engineering и statem-single-agent; README на 288 байт — содержимое тоньше, чем звёздный вес.","h":1,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"bydtesla1609/intent-debugger","u":"https://github.com/bydtesla1609/intent-debugger","k":"skill","t":"процесс","g":8,"s":28,"p":null,"d":"прояснение требований и выравнивание намерения: превращает сырую идею в проверяемую постановку.","h":1,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"angelwzr/linux-phone-porting","u":"https://github.com/angelwzr/linux-phone-porting","k":"skill","t":"интеграция","g":9,"s":26,"p":null,"d":"скилл для портирования mainline Linux на Android-телефон; CC-BY-4.0.","h":1,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"kharmanskyi/open-steps","u":"https://github.com/kharmanskyi/open-steps","k":"skill","t":"процесс","g":8,"s":26,"p":null,"d":"переводи цесс","g":8,"s":12,"p":null,"d":"скилл техписателя, который сначала читает работающую систему, отделяет реализованное поведение от предложенного и проверяет итоговый Markdown встроенным валидатором.","h":1,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"Boring-Stuff-Club/the-scribble-thing-skill","u":"https://github.com/Boring-Stuff-Club/the-scribble-thing-skill","k":"skill","t":"медиа","g":1,"s":12,"p":null,"d":"превращение штриховых иллюстраций в scribe-анимации; аккаунт-организация. MIT.","h":1,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"NicholasSpisak/excalidraw","u":"https://github.com/NicholasSpisak/excalidraw","k":"skill","t":"медиа","g":1,"s":11,"p":null,"d":"Claude Code и Codex рисуют настоящие диаграммы Excalidraw: флоучарты, вайрфреймы, слайды, SWOT, Lean Canvas. MIT.","h":1,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"aiopshwang/goal-to-proof","u":"https://github.com/aiopshwang/goal-to-proof","k":"skill","t":"процесс","g":8,"s":11,"p":null,"d":"заставляет агента доводить нетривиальную работу до конца и подтверждать результат прямыми доказательствами по размеру задачи. MIT.","h":1,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"MartinPuli/createAnApp","u":"https://github.com/MartinPuli/createAnApp","k":"skill","t":"процесс","g":8,"s":10,"p":null,"d":"evidence-gated набор для доведения Apple-приложения до релиза: агент обязан доказать каждый этап, успешная сборка не считается релизом, а апрув — не PMF; база требований перепроверена по первоисточникам 19.08.","h":1,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"anhe2021212-spec/Turritopsis","u":"https://github.com/anhe2021212-spec/Turritopsis","k":"skill","t":"память","g":3,"s":10,"p":null,"d":"общее знание о проекте и передача контекста между кодинг-агентами на длинных проектах. MIT.","h":1,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"automateyournetwork/pyATS_skills","u":"https://github.com/automateyournetwork/pyATS_skills","k":"skill","t":"интеграция","g":9,"s":10,"p":null,"d":"скиллы pyATS для агентов: сетевая автоматизация Cisco. Найден только исправленным запросом.","h":1,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"duty1g/x64dbg-mcp-server","u":"https://github.com/duty1g/x64dbg-mcp-server","k":"plugin","t":"интеграция","g":9,"s":1429,"p":null,"d":"Топ окна с большим отрывом и самый далёкий от скиллов пункт каталога. Нативный MCP-плагин для отладчика x64dbg, выставляющий всю его функциональность по HTTP: брейкпоинты, пошаговое исполнение, чтение памяти, дамп регистров. Подключается любой MCP-совместимый ассистент. Написан на Zig: без зависимостей, один бинарник, кросс-компиляция под x32 и x64 с любого хоста — ни.NET, ни Python, ни рантайма, плагин просто кладётся в каталог плагинов x64dbg. Транспорты — streamable HTTP и SSE, MCP 2024-11-05. MIT. Жанрово это не «скилл для Claude», а показатель того, куда расходится MCP: реверс-инжиниринг и ред-тим как обычный потребитель протокола.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"kgoedecke/doop","u":"https://github.com/kgoedecke/doop","k":"plugin","t":"дизайн","g":2,"s":385,"p":null,"d":"Открытая альтернатива Paper.design: многопользовательский дизайн-холст для людей и агентов. Каждый дизайн живёт на разделяемом Canvas (/c/\u003cid>), внутри — Frames, артборды, рендерящие настоящий HTML в песочных iframe. Люди правят в браузере, агенты — через встроенный MCP-сервер, стримя свои дизайны вживую; курсоры, присутствие, правки фреймов, статус агента и лента активности видны всем одновременно. AGPL-3.0, есть облачная версия. Интересен как редкий пример, где агент — не отдельный режим работы, а ещё один участник на общем холсте.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"rome-os/rome","u":"https://github.com/rome-os/rome","k":"plugin","t":"процесс","g":8,"s":343,"p":null,"d":"Заявка сформулирована прямо против доминирующей: «основной прогресс в AI даёт масштабирование моделей — Rome масштабирует другую ось, среду»: инструменты, рабочие процессы, память и интерфейсы, внутри которых агент работает. Практически это огороженная среда, где человек и агент работают вместе, а агенты строят собственные харнессы, проектируют собственные SOP и оркестрируют процессы под управлением человека; доказавшие себя способности закрепляются. Есть сайт, документация, «App Store» и облачная версия. MIT, TypeScript, аккаунт-организация.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"sodiumsun/agenttrail","u":"https://github.com/sodiumsun/agenttrail","k":"plugin","t":"наблюдаемость","g":5,"s":248,"p":null,"d":"Локальный открытый слой наблюдаемости для кодинг-агентов, и его центральная идея — сопоставление двух сигналов: declared (компонент и задача, над которыми агент говорит, что работает) против observed (файлы, которые он меняет прямо сейчас, включая правки уже «законченного»). Когда сигналы расходятся, видно, куда смотреть. Карта показывает 5–9 реальных компонентов со стрелками зависимостей и честными состояниями done / working / blocked; законченная карточка подсвечивается, если её файлы снова тронули. Работает с Claude Code, OpenAI Codex, Cursor и вообще любым агентом, который правит файлы. Запуск — npx agenttrail --open, без аккаунта, глобальной установки и телеметрии. MIT.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"jinzijian/EvoTrace","u":"https://github.com/jinzijian/EvoTrace","k":"plugin","t":"память","g":3,"s":84,"p":null,"d":"Локальный компилятор траекторий: импортирует сессии Claude Code и Codex, уже лежащие на машине, отбирает те, что стоят сохранения, и компилирует их в preference-данные с доказательствами, воспроизводимые кодовые задачи, RL-окружения и кандидатов на execution-reward. Построен на DeepSeek Harness (продолжение волны, отмеченной в прошлом дайджесте), но сам не кодинг-агент и не требует менять привычный рабочий процесс. Автор честно помечает состояние: ранняя альфа, сгенерированные задачи и верификаторы остаются кандидатами, пока не пройдут документированные evidence- и Docker-гейты. Сюжетно EvoTrace встаёт рядом с прошлонедельным Stealing Reasoning Traces: там трассы рассуждений вытаскивали из чужого API, здесь собственные траектории объявляются активом, который можно верифицировать и передавать.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"ADScanPro/Claude-AD","u":"https://github.com/ADScanPro/Claude-AD","k":"plugin","t":"безопасность","g":7,"s":73,"p":null,"d":"Плагин Claude Code с методологией внутреннего пентеста Active Directory: скиллы, агенты и слэш-команды, задающие порядок фаз, ограничения среды, которые ломают инструментарий, телеметрию, которую оставляет каждая техника, и связь находки с контролем комплаенса (DORA/NIS2/ENS). Покрытые техники — Kerberoasting, ADCS ESC1-17, DCSync, злоупотребление ACL, NTLM relay, делегирование; управляет стандартным инструментарием: netexec, impacket, certipy, bloodyAD, BloodHound CE. Формулировка авторов про распределение ролей точная: «вы всё ещё ведёте проект — Claude несёт метод». MIT, версия 0.1.0.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"only-cli/oc","u":"https://github.com/only-cli/oc","k":"plugin","t":"интеграция","g":9,"s":70,"p":null,"d":"oc open \u003curl> забирает страницу и отдаёт компактный нумерованный вид вместо сырого HTML или скриншота: заголовок, пронумерованные ссылки и строка действий do \u003cn> | read \u003cn> | next | raw. Типичная страница — десятки тысяч токенов разметки; такой вид укладывается в несколько сотен. Ни адаптеров под сайты, ни расширения браузера, ни демона; запросы имперсонируют Chrome через impers, что заодно проходит блокировки, на которых спотыкаются наивные фетчеры. Поставляется тремя способами — npm-пакет, скилл web-browsing-cli и плагин-маркетплейс Claude Code; в репозитории есть llms.txt.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"addyosmani/factory","u":"https://github.com/addyosmani/factory","k":"plugin","t":"процесс","g":8,"s":68,"p":null,"d":"Референсная «программная фабрика» — повторяемый цикл поставки, устанавливаемый в существующий GitHub-проект на стоковом Claude Code, с тонким адаптером под Codex. Ключевой тезис: никакого фонового процесса и своего оркестратора в репозитории нет. GitHub Issues становятся очередью работ, cloud-routines дают такт и вычисления, GitHub держит durable-очередь и pull request'ы, а каждый запуск стартует с чистого листа, обрабатывает одну стадию и записывает доказательства. Что фабрика умеет: маршрутизировать новую issue в реализацию, спецификацию, именованный вопрос или известный блокер; брать разрешённую уставом мелкую работу, «застолбить» её без гонки с другим запуском и открыть draft-PR; прогонять детерминированные проверки типов, линта, тестов, сборки, аудита и архитектуры, падая закрыто, если обязательная проверка отсутствует; просить свежего верификатора прочитать диф вхолодную и доказать, что новый тест падает без реализации; останавливать производство, когда очередь ревью упирается в лимит. Формулировка автора: ценность начинается после генерации кода — это версионируемый метод решать, что агенту позволено брать без присмотра и какое доказательство человек получит перед финальным решением.","h":0,"f":"известный автор","i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"Stupidoodle/swissdevjobs-cli","u":"https://github.com/Stupidoodle/swissdevjobs-cli","k":"plugin","t":"интеграция","g":9,"s":68,"p":null,"d":"Поиск и отклик по ~4700 вакансиям с открытыми зарплатами в семи странах из терминала или из агента: Python-CLI без зависимостей плюс MCP-сервер плюс плагин Claude Code. MIT. Пример уже сложившегося паттерна упаковки: один источник данных раздаётся сразу тремя интерфейсами, из которых агентный — не главный, а равноправный.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"forcewake/hermes-conductor","u":"https://github.com/forcewake/hermes-conductor","k":"plugin","t":"мульти-агентность","g":4,"s":65,"p":null,"d":"Самый содержательный материал окна по многоагентной оркестрации. Продакшн-паттерны запуска внешних кодинг-агентов — Claude Code, OpenCode, Codex CLI, MiMo, agy и любых других, правящих файлы, — под одним kanban-контроллером Hermes Agent. Дирижёр работает в профиле «route-only» с явной установкой «не делай работу, только маршрутизируй»: декомпозиция, веерный запуск, верификация, интеграция. Каждый агент сидит в собственной worktree-полосе, а диффы, тесты и коммиты проверяет контроллер — принципиально не доверяя самоотчёту агента («zero trust in self-reports»). Заявленная основа — 18 продакшн-досок, 367 карточек, 566 диспатчей агентов и разборы инцидентов; цифры проверить в рамках прогона нельзя, это заявление автора. MIT.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"Bil0000/agents-fleet","u":"https://github.com/Bil0000/agents-fleet","k":"plugin","t":"процесс","g":8,"s":47,"p":null,"d":"Пустой рабочий «источник правды» для Claude Code и Codex на macOS и Linux: согласованно держит правила, настройки, скиллы, команды, хуки, плагины, MCP-серверы, секреты, обновления и настройку Claude-Mem. В репозитории только движок и пустые каталоги — конфигурации автора там нет. Отдельно ценна инструкция по безопасности: форкать запрещено (форк публичного репозитория публичен), нужно делать приватный репозиторий из шаблона, а в стартовом промпте агенту явно предписано сперва проверить, что git remote get-url origin не указывает на исходный репозиторий. MIT.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"DavidCarliez/cover","u":"https://github.com/DavidCarliez/cover","k":"plugin","t":"безопасность","g":7,"s":41,"p":null,"d":"Двусторонний прокси приватности для кодинг-агентов на Go. Подобранные чувствительные значения заменяются локально на реалистичные детерминированные подстановки до того, как запрос уйдёт с машины, а в обычных и потоковых ответах совпадающие «фейки» переводятся обратно в оригиналы. Модель получает связный контекст, агент и инструменты продолжают работать с настоящим окружением. Политики — pseudonymize и placeholder (обратимые), а также mask, redact, block и allow. Apache-2.0, есть CI. Прямой ответ на вопрос, который в корпоративном контуре встаёт раньше всех остальных.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"yeswehack/claude-kit","u":"https://github.com/yeswehack/claude-kit","k":"plugin","t":"безопасность","g":7,"s":37,"p":null,"d":"Плагин от баг-баунти-платформы YesWeHack для отчётов, которые триажер может быстро проверить. Заявленный риск сформулирован точно и относится далеко не только к баг-баунти: AI ускоряет написание отчёта, но может дописать технические детали, которые никто не проверял. Поэтому инструмент составляет, структурирует и валидирует отчёт только из фактов, которые дал пользователь — реальные URL, пейлоады, ответы, наблюдаемое поведение, — а при нехватке спрашивает, а не догадывается. Одна установка добавляет постоянно действующий слой дисциплины на каждую сессию и три скилла по запросу: написание, триаж и проверки по классам уязвимостей. Плагин сам себе marketplace. GPL-3.0; есть разбор от платформы. Найден только исправленным запросом.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"janwilmake/agent-codemode","u":"https://github.com/janwilmake/agent-codemode","k":"plugin","t":"интеграция","g":9,"s":27,"p":null,"d":"Code mode для агента, которого вы уже запускаете: он уже залогинен во все ваши MCP-серверы, и этот пакет позволяет ему перестать дёргать их по одному инструменту за раз, а написать скрипт. Автор приводит измерение на живом воркспейсе из 39 тикетов Linear (задача — вытащить все In Progress тикеты с телами и посчитать вхождения «mcp»): путь через tool-call'ы — 262 159 символов (~65 500 токенов) и 40 последовательных round-trip'ов; путь через один скрипт — 903 символа (~226 токенов) и один round-trip. Оговорки автора важны и приведены им самим: счёт символов точен, токены — по грубой эвристике 4 символа на токен, и переносима именно пропорция, а не абсолютные числа. Второй аргумент сильнее первого: сорок последовательных вызовов каждый ждут решения модели, скрипт делает те же сорок запросов не останавливаясь на раздумья. Третий — точность: подсчёт вхождений в 262 159 символах модель делает приблизительно, скрипт — точно.","h":0,"f":"сигнал вне звёзд: известный автор","i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"2005selene2005-a11y/susu-phone-agent","u":"https://github.com/2005selene2005-a11y/susu-phone-agent","k":"plugin","t":"интеграция","g":9,"s":28,"p":null,"d":"мост к Android-устройству для Claude Code через MCP и Shizuku, без рута и без опроса модели. MIT.","h":1,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"mcarlssen/claude-adversarial-review","u":"https://github.com/mcarlssen/claude-adversarial-review","k":"plugin","t":"код-качество","g":6,"s":23,"p":null,"d":"плагин, прогоняющий состязательное многоагентное ревью незакоммиченного диффа до коммита. Найден только исправленным запросом.","h":1,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"VincentHHY/big-picture","u":"https://github.com/VincentHHY/big-picture","k":"plugin","t":"процесс","g":8,"s":22,"p":null,"d":"плагины, держащие детали реализации ниже явной черты: ответ, который можно оценить и по которому можно действовать, не читая код. По умолчанию выключены, включаются на сессию. MIT.","h":1,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"alhinawi/telegram-notifier","u":"https://github.com/alhinawi/telegram-notifier","k":"plugin","t":"интеграция","g":9,"s":22,"p":null,"d":"универсальные уведомления в Telegram для Antigravity, Claude Code, Codex, Cursor и Windsurf, с удалённым управлением. Найден только исправленным u":"https://github.com/bashebr/ai-native-sdlc","k":"plugin","t":"процесс","g":8,"s":16,"p":null,"d":"скилл и плагин для Codex и Claude Code, реализующие AI-Native SDLC от Anthropic: Plan → Design → Build → Test → Deploy → Maintain с человеческими гейтами на каждой передаче. MIT.","h":1,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"keli-wen/agy-staff","u":"https://github.com/keli-wen/agy-staff","k":"plugin","t":"мульти-агентность","g":4,"s":15,"p":null,"d":"нанимает Antigravity CLI (Gemini 3.7 Flash) как быстрого исполнителя для Claude Code и Codex: пять персон (/agy:staffer, researcher, reviewer, implementer, ask) плюс model-facing скилл управления фоновыми задачами.","h":1,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"legoambarish/portable-handoff","u":"https://github.com/legoambarish/portable-handoff","k":"plugin","t":"память","g":3,"s":15,"p":null,"d":"перенос работы между сессиями, моделями и инструментами без потери решений и поправок; схемы, скиллы и интеграции в одном пакете.","h":1,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"l3a0/claude-plugins","u":"https://github.com/l3a0/claude-plugins","k":"plugin","t":"интеграция","g":9,"s":15,"p":null,"d":"личный marketplace с одним плагином kindle-highlights: дословное извлечение заметок Kindle с восстановлением обрезанных мест. Взял 45 очков на HN 24.08. MIT.","h":1,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"nerdlab-dev/crm","u":"https://github.com/nerdlab-dev/crm","k":"plugin","t":"интеграция","g":9,"s":12,"p":null,"d":"корейский установщик удалённого MCP для CRM-кампаний: Cafe24, KakaoTalk brand message, купоны, UTM; аккаунт-организация. MIT.","h":1,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"ptmrio/harness-subagent","u":"https://github.com/ptmrio/harness-subagent","k":"plugin","t":"мульти-агентность","g":4,"s":12,"p":null,"d":"вызвать Codex из Claude Code, Grok Build из Codex и так далее: родитель пишет бриф, диспатчит другой харнесс одноразовым сабагентом и синтезирует результат. Аргумент автора: модель, ревьюящая собственную работу, воспроизводит собственные слепые зоны, а иначе обученный харнесс — нет. MIT.","h":1,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"Milkdomeda/ai-mechanical-3dcad-design-agent","u":"https://github.com/Milkdomeda/ai-mechanical-3dcad-design-agent","k":"plugin","t":"интеграция","g":9,"s":11,"p":null,"d":"детерминированные процессы механического 3D-CAD, инженерные знания, валидация и MCP-инструменты для кодинг-агента. Не скилл: пакет, CLI и MCP-сервер, собственного LLM-клиента внутри нет.","h":1,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"Jason-smithy/claude-certified-architect-foundations-ccao-f","u":"https://github.com/Jason-smithy/claude-certified-architect-foundations-ccao-f","k":"plugin","t":"процесс","g":8,"s":11,"p":null,"d":"материалы подготовки к сертификации Anthropic Claude Certified Architect Foundations: пять доменов, 25 сценарных вопросов, гайд по MCP. MIT.","h":1,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"montezuma-p/harken","u":"https://github.com/montezuma-p/harken","k":"plugin","t":"медиа","g":1,"s":10,"p":null,"d":"один статический бинарник 13 МБ на whisper.cpp: полностью офлайн-транскрипция экспорта чата WhatsApp или любого аудио, без Python, ffmpeg и API-ключа.","h":1,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"unity","u":"https://github.com/anthropics/claude-plugins-official/pull/5595","k":"official","t":null,"g":14,"s":null,"p":null,"d":"(merged 24.08 20:52 UTC) — партнёрский листинг Unity Technologies, 18 скиллов: геймдев, монетизация, локализация, мультиплеер, Shader Graph. Только скиллы, без .mcp.json, лицензия Unity Companion, источник запинен на коммит 36052397 репозитория Unity-Technologies/unity-agent-plugin.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"netsuite-ai-companion и netsuite-finance-analyst","u":"https://github.com/anthropics/claude-plugins-official/pull/5600","k":"official","t":null,"g":14,"s":null,"p":null,"d":"(merged 25.08 03:14 UTC) — Oracle NetSuite перешёл на публикацию из ветки ai-plugins-dist репозитория oracle/netsuite-suitecloud-sdk, по плагину на подкаталог. Старый сводный бандл заменён тремя реальными плагинами; netsuite-suitecloud сохранил слаг, поэтому установленные копии обновятся на месте. Оба новых требуют NetSuite AI Connector Service.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"claude-security 0.10.2 → 0.10.2.3","u":"https://github.com/anthropics/claude-plugins-official/pull/5597","k":"official","t":null,"g":14,"s":null,"p":null,"d":"два релиза собственного плагина Anthropic за окно (21.08 и 24.08), тела PR пустые, кроме номера версии: содержание изменений публично не раскрыто.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"Атрибуция unity и qodo","u":"https://github.com/anthropics/claude-plugins-official/pull/5598","k":"official","t":null,"g":14,"s":null,"p":null,"d":"обеим записям добавлено поле author, которого не хватало для отображения партнёра.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"Show HN: Frugal Tokens","u":"https://demo.frugaltokens.com/","k":"research","t":"процесс","g":8,"s":null,"p":36,"d":"Инструмент для разбора стоимости и расхода токенов сразу по нескольким кодинг-агентам. Тема окна повторяется третий прогон подряд (прошлый дайджест — tokentab, ★222): наблюдаемость трат превратилась в самостоятельную нишу с несколькими независимыми реализациями. Ссылка ведёт на демо, поданное на HN автором.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"fx — tiny, open, native coding agent","u":"https://fx.sh","k":"research","t":null,"g":14,"s":null,"p":310,"d":"Кодинг-агент от Vercel Labs, написанный на Zig и выложенный под Apache-2.0. Позиционируется как фреймворк для исследований и встраивания в большие системы, а не как замена интерактивному CLI: бинарник 6,39 МБ, заявленный холодный старт 10 мкс, однозначные мегабайты памяти, сборки в WebAssembly и подключаемый сетевой стек. Интерфейс — shell-подобный, в духе Unix, а не тяжёлый TUI. Идея архитектуры прямо противоположна нынешнему тренду: минимальный системный промпт и минимум встроенных инструментов ради экономии токенов, а всё остальное приезжает через скиллы, плагины и MCP. Версия 0.0.4, авторы явно помечают проект как экспериментальный. Для дайджеста важно не «ещё один агент», а то, что модель «маленькое ядро + расширение скиллами» получила референсную реализацию у заметного вендора.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"Huzzah — a novel approach to coding with AI","u":"https://www.danielvaughn.dev/posts/huzzah/","k":"research","t":null,"g":14,"s":null,"p":289,"d":"Экспериментальный редактор Дэниела Вона, отталкивающийся от трёх претензий к чат-ориентированным агентам: нет надёжной записи человеческого намерения, императивные инструкции повторяются и жгут токены, многословный естественный язык прячет плотность информации. Предложение: промпт должен быть псевдокодом, декларативным и постоянным, а не длинным, императивным и одноразовым. Разработчик пишет файл .hz с упрощённым псевдокодом (в примере автора — fizz_buzz(n) / loop n / modulo 3 ? \"fizz\" / 5 ? \"buzz\"), и при сохранении система генерирует настоящий код. При правках Huzzah берёт дифф .hz и использует именно его как промпт, чтобы не пересылать неизменную часть. Автор сам называет ограничения: масштабируемость и работа с уже существующими кодовыми базами. Ценность — в постановке вопроса: спецификация намерения как версионируемый артефакт рядом с кодом.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"Conceptual integrity and counting lines of code","u":"https://simonwillison.net/2026/Aug/19/conceptual-integrity-and-counting-lines-of-code/","k":"research","t":"процесс","g":8,"s":null,"p":null,"d":"Саймон Уиллисон по мотивам выпуска подкаста Talking Postgres «How AI is Changing Software Development». Три тезиса. Первый: строки кода как метрика производительности для агентов внезапно осмысленны — объём, который агент выдаёт за день, несопоставим с ручным, и это реальный выигрыш, если качество держится. Второй, важнее: узкое место сместилось с производства на когнитивную ёмкость человека — один инженер физически не удерживает в голове кратно выросший объём кода, и команда остаётся нужна как способ распределить эту нагрузку. Третий: риск потери концептуальной целостности в смысле «Мифического человеко-месяца» — когда добавить фичу стоит одного промпта, исчезает трение, которое раньше принуждало к дисциплинированным решениям, и софт зарастает пристройками. Конкретные числовые оценки в посте приводились через пересказ подкаста и здесь намеренно не воспроизводятся — по вторичным источникам, не подтверждено; тезисы взяты в той формулировке, которая стоит в самом посте.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"smolmachines untrusted sandbox","u":"https://simonwillison.net/2026/Aug/19/smolmachines-untrusted-sandbox/","k":"research","t":"процесс","g":8,"s":null,"p":null,"d":"Он же: проверка smolvm 1.8.3 как песочницы для исполнения недоверенного кода — Python и JavaScript в аппаратно изолированных VM, а не в контейнерах. Заявлены офлайн-исполнение, сетевая изоляция, лимиты CPU/RAM, таймауты, квоты хранилища и read-only-монтирование входных данных; холодный старт 0,6–1,5 с, тёплый запуск около 50 мс. Для дайджеста интереснее метод, чем результат: работу вёл Claude Fable 5, и когда в окружении не оказалось поддержки виртуализации, агент переключился на прогон тестов через GitHub Actions — Уиллисон называет это «неустанно проактивным» поведением. Все материалы выложены отдельным исследовательским репозиторием: результаты, заметки и конфигурации воркфлоу.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"My agent.md to improve LLM-assisted code quality","u":"https://fabiensanglard.net/agent.md/index.html","k":"research","t":null,"g":14,"s":null,"p":414,"d":"Лучший результат окна на HN (обсуждение). Фабьен Сангляр описывает конкретную проблему: агентные IDE дали скорость, но качество вывода — «спагетти без структуры и комментариев», и он раз за разом повторял одни и те же замечания в каждой новой сессии, так что после чистки выигрыш в скорости обнулялся. Ответ — файл agent.md, который вкладывается в промпт в начале сессии. Правила конкретные и проверяемые, а не декларативные: минимум слов в текстах для человека; магические числа — в именованные константы; меньше вложенности, ранние возвраты; имена функций короче 30 символов; перечисления вместо булевых параметров; программирование по уровням абстракции с явными границами слоёв; семь правил на сообщения коммитов; починка бага начинается с теста. Результат он формулирует сам: качество «резко улучшилось» и стало «очень близко к тому, что я написал бы руками». И тут же ставит границу: «LLM постоянно галлюцинируют, и доверять им нельзя. Я всё ещё много проверяю и итерирую, но теперь сосредоточен на архитектуре и дизайне, а не на стиле кода». Отдельно — приём против размывания контекста: держать сессии короткими и явно просить перечитать agent.md, когда качество поехало.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"A week of using Codex more than Claude","u":"https://allaboutcoding.ghinda.com/a-week-of-using-codex-more-than-claude/","k":"research","t":null,"g":14,"s":null,"p":244,"d":"Лучан Гинда неделю вёл рабочие задачи в двух TUI параллельно: Codex на gpt-5.6-sol xhigh против Claude Code на opus-5 xhigh, macOS (обсуждение). Наблюдения конкретные: Codex писал на Ruby/Rails меньше комментариев и давал более простые, самодостаточные решения, тогда как Claude строил более сложные архитектуры с дополнительными абстракциями; Codex быстрее выдавал первые изменения, но дольше доводил PR до конца и ошибался с ветками, где Claude лучше понимал намерение разветвиться и держать работу синхронной. Вывод автора: «Claude пытается сделать больше, чем просили, и угадать, что тебе может понадобиться», а «Codex — скорее напарник, который делает, что сказали, но не переусердствует».","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"Headlong: A microharness for persistent agents","u":"https://www.laude.org/updates/headlong-a-microharness-for-persistent-agents","k":"research","t":null,"g":14,"s":null,"p":120,"d":"Laude Institute и MIT выпустили открытый харнесс, в котором агент не реактивный, а непрерывный (обсуждение, репозиторий). Обычный харнесс замирает между задачами; Headlong держит агента в петле внутреннего монолога, даже когда внешнего ввода нет, так что агент сам расставляет приоритеты, ведёт собственные проекты и сводит несколько параллельных разговоров в один поток мысли. Авторы называют это «микрохарнессом» и настаивают на простоте и прозрачности: ядро — «меньше 10 тысяч строк Bash».","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"Your Agent Is Not the Model","u":"https://code.joejag.com/2026/your-agent-is-not-the-model.html","k":"research","t":null,"g":14,"s":null,"p":73,"d":"Джо Райт разводит понятия, которые в разговоре обычно слипаются (обсуждение). Модель — только математическое ядро, обученная сеть. Агентная система — три взаимозависимых слоя: модель, инференс-сервис, который её хостит, и харнесс, слой прикладной логики, формирующий вход, трактующий выход и подключающий инструменты. Практическая польза диагностическая: плохие рассуждения обычно означают, что харнесс не дал модели контекста; медленный инференс — проблема инфраструктуры; сорванная интеграция инструментов — почти всегда харнесс. Формулировка автора: «Когда ты можешь назвать слой, ты можешь починить слой». Одна и та же модель ведёт себя по-разному в Claude Desktop, Cursor, ChatGPT и самописном LangChain именно из-за различий харнесса.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"More than just code review","u":"https://simonwillison.net/2026/Aug/22/more-than-just-code-review/","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Саймон Уиллисон: ключевой навык продуктивной работы с кодинг-агентами — уметь уверенно поручить изменение и уверенно проверить, что оно сделано правильно, — и это не обязательно означает прочитать каждую строку. Его аргумент в пользу: построчное ревью и исторически было недостаточным способом валидации изменений. Цитата: «Ключевой навык продуктивного использования кодинг-агентов — уметь уверенно поручить им, как внести изменения, и затем уверенно проверить, что эти изменения внесены правильным образом». Прямо рифмуется с agent.md Сангляра, который перенёс внимание со стиля кода на архитектуру.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"Fable & The End of the Free Lunch","u":"https://simonwillison.net/2026/Aug/23/drew-breunig/","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Уиллисон цитирует Дрю Бройнига (оригинал): с появлением премиальных моделей вроде Fable больше нельзя рассчитывать, что следующая модель решит проблему сама. Приходится решать, какая работа уходит на дорогую фронтир-модель, а какая — на дешёвую, и внимание смещается со «подождём следующего релиза» на стратегию контекста и способ работы. Цитируемая фраза Бройнига: «Мы стали думать, какая работа куда идёт». Для практики это ровно та рамка, в которой стоит читать появившиеся в этом же окне настройки promptCacheTtl/subagentPromptCacheTtl и modelPricing в CLI.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"Agentic Context Management: Memory and Cost as Architecture Problems","u":"https://arxiv.org/abs/2607.21503","k":"research","t":null,"g":14,"s":null,"p":51,"d":"Препринт arXiv, поднявшийся на HN в последний день окна (обсуждение). Заявленный тезис — рассматривать память и стоимость агента как архитектурные задачи, а не как параметры настройки. Содержание работы в рамках прогона не читалось, здесь приведены только название, ссылка и факт попадания в окно; по вторичным источникам не пересказывается.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"Characterizing Agentic Flooding of Government Services","u":"https://arxiv.org/abs/2608.16603","k":"research","t":null,"g":14,"s":null,"p":79,"d":"Препринт про заваливание государственных сервисов агентным трафиком (обсуждение). Не читался; включён как сигнал о том, что тема «агенты как источник нагрузки на публичную инфраструктуру» вышла на HN, а не как пересказ выводов.","h":0,"f":null,"i":2,"a":"agents-weekly-2026-08-26","e":"2026-08-26"},{"n":"s0xDk/refactoring-ui-skill","u":"https://github.com/s0xDk/refactoring-ui-skill","k":"skill","t":"дизайн","g":2,"s":357,"p":null,"d":"Топ окна и, пожалуй, самый чистый пример жанра «книга → скилл», который в этой серии уже встречался (Leutenegger/book-to-skill ★1185 в дайджесте 18.08). Здесь не генератор, а результат: конкретные механические правила из книги Refactoring UI Адама Уотана и Стива Шогера — ограниченные шкалы отступов, кеглей, цвета, теней и радиусов вместо произвольных значений; иерархия через насыщенность и цвет, а не через наращивание размера шрифта; глубина через имитацию источника света. Автор заявляет, что каждое правило и каждое CSS-значение сверялось с книгой постранично: «это не пересказ — это решения книги, принятые один раз и готовые к применению». Структура типовая и аккуратная: SKILL.md как процедура плюс три файла references/ (построение палитры от нуля в HSL, таблица «симптом → починка» для уже существующего интерфейса, техники глубины и работы с изображениями) и assets/tokens.css с проверенным на контраст стартовым набором токенов. Самой книги внутри нет — только выводы. Отдельно стоит отметить таблицу «симптом → починка»: она превращает расплывчатую жалобу («выглядит дёшево») в конкретную механическую правку, то есть решает ровно ту задачу, на которой агент обычно буксует. 28 КБ, лицензия нестандартная (NOASSERTION).","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"op7418/guizang-yingzao-skill","u":"https://github.com/op7418/guizang-yingzao-skill","k":"skill","t":"медиа","g":1,"s":276,"p":null,"d":"Скилл для Claude Code и Codex, превращающий фотографии китайской традиционной архитектуры и «мест с культурой» в постеры редакционного уровня через GPT Image. Верхняя строка каталога по звёздам и при этом полностью прикладная вещь: к тому, как строить агентов, отношения не имеет. Полезен как индикатор — такие «скиллы-художники» стабильно собирают верхний тир, потому что результат показывается картинкой, а не описанием. Репозиторий содержательный (64 МБ, Python, директория yingzao), но без лицензии.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"leopard627/fire-your-seo-agency","u":"https://github.com/leopard627/fire-your-seo-agency","k":"skill","t":"маркетинг","g":13,"s":275,"p":null,"d":"Корейский скилл с прямолинейным тезисом: «платите агентству $400–2500 в месяц за оптимизацию под AI-поиск? Увольте их». Аргумент устроен интереснее лозунга: то, что агентства продают как ретейнер, — это публичные стандарты и повторяемые чек-листы, а повторяемый чек-лист по определению есть скилл. Автор разделяет «поисковую оптимизацию» на пять непересекающихся дорожек, и каждой ставит свой вопрос: SEO (краулеры Google/Bing — могут ли они вообще прочитать и проиндексировать), AEO (блоки AI-ответов — цитируют ли), GEO (ChatGPT/Perplexity/Claude при обходе сети — я ли первоисточник), LLMO (знает ли модель бренд из собственных весов и знает ли верно) и NEO — корейский Naver с его AI Briefing. Последняя дорожка и есть то, чего нет в глобальных руководствах, а она держит половину корейского рынка. Заявленные цифры даны на своём же проекте: 1.54 млн показов за 30 дней и 7.4 тыс. кликов при нулевых тратах на рекл
