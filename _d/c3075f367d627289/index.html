<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Круг оформления · выбор</title>
<style>
  :root{ --ink:#f2f2f4; --dim:#8b8b93; --line:#26262b; --pick:#6ee7b7; }
  *{box-sizing:border-box}
  body{margin:0;background:#0d0d10;color:var(--ink);
       font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:.6rem 1rem;
         align-items:baseline;padding:.7rem 1rem;background:rgba(13,13,16,.92);
         backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  h1{font-size:14px;font-weight:600;margin:0;letter-spacing:.01em}
  header p{margin:0;color:var(--dim);font-size:12px}
  .modes{margin-left:auto;display:flex;gap:.4rem}
  .modes button{font:inherit;font-size:12px;color:var(--dim);background:none;
                border:1px solid var(--line);border-radius:999px;padding:.25rem .7rem;cursor:pointer}
  .modes button[aria-pressed="true"]{color:#0d0d10;background:var(--ink);border-color:var(--ink)}

  .g{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}
  @media(max-width:900px){.g{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g{grid-template-columns:1fr}}

  .v{position:relative;overflow:hidden;background:#000;aspect-ratio:16/11}
  /* Карточка — настоящий сайт в этом наборе, уменьшенный: выбор идёт по живой
     странице со своим содержимым, а не по макету. */
  .v iframe{position:absolute;top:0;left:0;width:1440px;height:990px;border:0;
            transform-origin:0 0;pointer-events:none}
  .cap{position:absolute;left:8px;bottom:8px;z-index:5;font-size:11px;
       padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;
       backdrop-filter:blur(4px);letter-spacing:.01em}
  .live{position:absolute;right:8px;bottom:8px;z-index:5;font-size:11px;
        padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;
        text-decoration:none;backdrop-filter:blur(4px)}
  .live:hover{background:#fff;color:#000}
  .anchor .cap{background:rgba(110,231,183,.9);color:#04160f;font-weight:600}
  .v.pick{outline:3px solid var(--pick);outline-offset:-3px}
</style>
</head>
<body>
<header>
  <h1>Круг оформления</h1>
  <p>Зелёные — то, что выжило в прошлый раз. Остальные десять — новый круг: свет ведёт себя иначе, а не просто перекрашен. Назови номера, которые зацепили.</p>
  <div class="modes">
    <button id="m-light" aria-pressed="true">светлая</button>
    <button id="m-dark" aria-pressed="false">тёмная</button>
  </div>
</header>

<div class="g" id="grid"></div>

<script>
const SITE = 'https://paveldiordits.site/';
const ITEMS = [
  { n:32, id:'two-sources',  name:'Два света',        anchor:true },
  { n:31, id:'cold-leak',    name:'Засветка',         anchor:true },
  { n:52, id:'dawn-fog',     name:'Рассвет',          anchor:true },
  { n:53, id:'backlight',    name:'Контровой' },
  { n:54, id:'through-haze', name:'Сквозь дымку' },
  { n:55, id:'bounce',       name:'Отражённый' },
  { n:56, id:'film',         name:'Плёнка' },
  { n:57, id:'noon',         name:'Полдень' },
  { n:58, id:'overcast',     name:'Пасмурно' },
  { n:59, id:'aura',         name:'Аура' },
  { n:60, id:'dusk',         name:'Сумерки' },
  { n:61, id:'lit-cards',    name:'Светятся карточки' },
  { n:62, id:'split',        name:'Расщепление' },
];
let theme = 'light';

function url(id){ return `${SITE}?design=${id}&theme=${theme}&lang=ru`; }

function render(){
  const g = document.getElementById('grid');
  g.innerHTML = '';
  for (const it of ITEMS){
    const v = document.createElement('div');
    v.className = 'v' + (it.anchor ? ' anchor' : '');
    v.dataset.choice = it.n;
    v.innerHTML =
      `<iframe loading="lazy" title="${it.n} ${it.name}" src="${url(it.id)}"></iframe>` +
      `<span class="cap">${it.n} · ${it.name}${it.anchor ? ' · выбран' : ''}</span>` +
      `<a class="live" href="${url(it.id)}" target="_blank" rel="noopener">открыть вживую ↗</a>`;
    v.addEventListener('click', e => {
      if (e.target.closest('.live')) return;
      v.classList.toggle('pick');
    });
    g.appendChild(v);
  }
  fit();
}

// Кадр карточки резиновый — масштаб пересчитываем под её ширину.
function fit(){
  for (const f of document.querySelectorAll('.v iframe')){
    const k = f.parentElement.clientWidth / 1440;
    f.style.transform = `scale(${k})`;
    f.style.height = (f.parentElement.clientHeight / k) + 'px';
  }
}
addEventListener('resize', fit);

for (const [btn, val] of [['m-light','light'], ['m-dark','dark']]){
  document.getElementById(btn).addEventListener('click', () => {
    theme = val;
    document.getElementById('m-light').setAttribute('aria-pressed', String(val === 'light'));
    document.getElementById('m-dark').setAttribute('aria-pressed', String(val === 'dark'));
    render();
  });
}
render();
</script>
</body>
</html>
