"},{"n":"avi691/linkedin-agent-skill","u":"https://github.com/avi691/linkedin-agent-skill","k":"skill","t":"соцсети","g":13,"s":16,"p":null,"d":"Одиннадцать скиллов для ведения LinkedIn: посты по 21 формуле hook, комментарии, ответы, оценка профиля по рубрике из 12 частей, план недели и humanizer, вычищающий следы ИИ; публикует сам человек.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"diegomarino/tui-design","u":"https://github.com/diegomarino/tui-design","k":"skill","t":"дизайн TUI","g":2,"s":16,"p":null,"d":"Скилл для проектирования и аудита терминальных интерфейсов: макеты .mock на реальной сетке ячеек проходят линтер и рендерятся в PNG, результат — HTML-галерея кадров по состояниям, размерам и темам.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"reviso-si/reviso-agent","u":"https://github.com/reviso-si/reviso-agent","k":"skill","t":"ревью документов","g":6,"s":14,"p":null,"d":"Скилл для Reviso: агент публикует черновик на ревью людям, читает их комментарии и правки и выпускает ревизию от той версии, которую прочитал, — чтобы не затереть параллельную правку человека.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"manifestack/manifestack","u":"https://github.com/manifestack/manifestack","k":"skill","t":"SaaS-стек","g":9,"s":14,"p":null,"d":"Скилл для подбора и аудита SaaS-стека: сканирует зависимости и конфиги, находит лимиты тарифов, перерасход и пробелы compliance, цены читает со страниц вендоров; hook отмечает каждый новый vendor SDK.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"wolfyxbt/groking","u":"https://github.com/wolfyxbt/groking","k":"skill","t":"X/Twitter","g":13,"s":14,"p":null,"d":"Скилл, через который Claude Code или Codex читает X (Twitter): запросы уходят в локальный Grok CLI, запущенный без клиентских инструментов в пустом временном каталоге, чтобы твиты не могли увести агента.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"speechlab0210/tutorial-video-skill","u":"https://github.com/speechlab0210/tutorial-video-skill","k":"skill","t":"видео","g":1,"s":13,"p":null,"d":"Скилл для подготовки учебных видео по любому предмету: аудитория, последовательность изложения, проверка утверждений по источникам, синхронизация слайдов с речью, ревью готового урока и правки.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"chacha95/demo-video-creator","u":"https://github.com/chacha95/demo-video-creator","k":"skill","t":"видео","g":1,"s":13,"p":null,"d":"Скилл, делающий из URL продукта готовый 16:9 launch film на 40–60 секунд на английском или корейском: реальные захваты UI, одна озвучка, движение по битам и сведённый звук; нужен ELEVENLABS_API_KEY.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"IncomeStreamSurfer/prove-it-better","u":"https://github.com/IncomeStreamSurfer/prove-it-better","k":"skill","t":"оценка изменений","g":6,"s":13,"p":null,"d":"Скилл Claude Code: улучшение выпускается, только если побеждает текущую версию на реальных кейсах — слепое попарное судейство с перестановкой порядка, судья от другого вендора, жёсткие проверки и откат.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"mhmtsrfglu/superwiki","u":"https://github.com/mhmtsrfglu/superwiki","k":"skill","t":"память","g":3,"s":12,"p":null,"d":"Скиллы, превращающие docs/ проекта в вики и трекер задач, которые ведёт агент: паттерн LLM Wiki Андрея Карпатого, задачи с «Done when» и зависимостями, просмотр в Obsidian или встроенном viewer.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"v60samurai/claritymaxx","u":"https://github.com/v60samurai/claritymaxx","k":"skill","t":"объяснения","g":2,"s":12,"p":null,"d":"Плагин Claude с одним скиллом explain: превращает сложный материал — код, системы, статьи, данные, логи — в понятные ментальные модели; работает в Claude на вебе, в Desktop, Cowork и Claude Code.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"dualface/ste-zht","u":"https://github.com/dualface/ste-zht","k":"skill","t":"письмо","g":11,"s":12,"p":null,"d":"Скилл, заставляющий агента отчитываться на традиционном китайском по принципам ASD-STE100: вывод первым, фиксированные статусы, явная отметка о проверке каждой правки и пронумерованные варианты решений.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"nguyenquanicd/VLSIT_CODEX_CLAUDE_SKILLS","u":"https://github.com/nguyenquanicd/VLSIT_CODEX_CLAUDE_SKILLS","k":"skill","t":"ASIC и FPGA","g":13,"s":12,"p":null,"d":"Четыре парных скилла для Codex и Claude Code по ASIC и FPGA: поиск и сравнение открытых IP с RTL, диаграммы иерархии RTL в Draw.io, внедрение изменений спецификации в RTL по плану и перевод VHDL в SystemVerilog.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"JosssphZhou/openzine","u":"https://github.com/JosssphZhou/openzine","k":"skill","t":"публикации","g":8,"s":12,"p":null,"d":"Скилл для Claude Code и Codex: превращает PDF или папку изображений в 3D-книжку с перелистыванием в браузере — один автономный .html без сетевых запросов, на телефоне по одной странице.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"tommy0103/better-readme-skill","u":"https://github.com/tommy0103/better-readme-skill","k":"skill","t":"документация","g":11,"s":11,"p":null,"d":"Скилл аудита и переписывания README по принципам Art of README: порядок воронки, вынос maintainer-разделов в CONTRIBUTING, проверка ссылок и тестов, завязанных на README, идиоматичные переводы.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"rauchg/skills","u":"https://github.com/rauchg/skills","k":"skill","t":"фронтенд","g":2,"s":11,"p":null,"d":"Набор скиллов @rauchg, пока из одного: ui-recording-timeline превращает запись экрана UI в интерактивную страницу с таймлайном отрисовок, подсвечивая, что перерисовано, а что только сдвинулось.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"sammyjason39/agent-build-playbook","u":"https://github.com/sammyjason39/agent-build-playbook","k":"skill","t":"оркестрация","g":4,"s":11,"p":null,"d":"Скиллы и скрипты, где сильная модель-координатор планирует работу и раздаёт её CLI-агентам (opencode, pi, Antigravity) в отдельных git worktree, затем ревьюит и сливает ветки до зелёного CI.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"kk1992ishere-droid/turn-anything-cu","u":"https://github.com/kk1992ishere-droid/turn-anything-cu","k":"skill","t":"computer use","g":9,"s":10,"p":null,"d":"Скилл-установщик для macOS: регистрирует уже установленный локально компонент Computer Use из ChatGPT/Codex как stdio MCP-сервер в выбранном AI-клиенте, включая Claude Code, сохраняя запросы разрешений.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"mzopedia/simplified-technical-chinese","u":"https://github.com/mzopedia/simplified-technical-chinese","k":"skill","t":"письмо","g":11,"s":10,"p":null,"d":"Контролируемый язык для китайских технических текстов по методу ASD-STE100: 40 правил, словарь «одно значение — одно слово», проверочный скрипт без зависимостей и скилл для Claude Code, Codex и Cursor.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"osmangoninahid/mermaidiff","u":"https://github.com/osmangoninahid/mermaidiff","k":"skill","t":"код-ревью","g":6,"s":10,"p":null,"d":"Скилл /mermaidiff: показывает изменения PR или commit как sequence diagram только изменённых шагов с пометками добавлено, изменено, удалено и ссылками file:line; по данным автора, без ложных срабатываний на 10 commits.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"Ethiel97/flutter-clean-riverpod-skills","u":"https://github.com/Ethiel97/flutter-clean-riverpod-skills","k":"skill","t":"Flutter","g":9,"s":10,"p":null,"d":"Шесть скиллов для Flutter: feature-first Clean Architecture, Riverpod 3 без кодогенерации, ошибки через Result, SDK за собственными контрактами, UI side effects и тесты; есть scaffold-скрипт и boundary checker.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"e-mudao/output-ladder-skill","u":"https://github.com/e-mudao/output-ladder-skill","k":"skill","t":"обучение","g":12,"s":10,"p":null,"d":"Скилл, подбирающий под учебную цель самый простой подходящий формат — текст, диаграмму, интерактивную веб-страницу или explainer-видео — и возвращающий готовый промпт; сам артефакт делается по отдельной просьбе.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"shinshin86/mesh-avatar-studio","u":"https://github.com/shinshin86/mesh-avatar-studio","k":"plugin","t":"аватары","g":1,"s":523,"p":null,"d":"Делает из одной иллюстрации анимированный 2D-mesh-аватар, который моргает, говорит, поворачивает голову и дышит. Кодинг-агент (Claude Code или Codex) готовит риг по docs/agent-guide.md, а тонкая настройка — перетаскиванием точек в локальном редакторе с живым превью. Режим Live: веб-камера и микрофон управляют аватаром для OBS, при этом видео и звук остаются на машине, наружу идут только числовые значения движения.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"GTKottman/mortiflix-oss","u":"https://github.com/GTKottman/mortiflix-oss","k":"plugin","t":"видео","g":1,"s":476,"p":null,"d":"Студия моушн-дизайна на своей машине: Claude ведёт видео по этапам (бриф, сценарий, стилевые кадры, аниматик, сборка, финал), а человек на каждом гейте оставляет заметки прямо на кадре или моменте. Правила живут в коде, не в промпте: шаг нельзя утвердить за пользователя, сессия заканчивается на гейте и пишет handoff. Работает через Claude Code или ключ Anthropic API, нужны Node 20+ и ffmpeg. Протестировано в основном на Linux, Windows обещан позже.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"openqodex/openqodex","u":"https://github.com/openqodex/openqodex","k":"plugin","t":"код-ревью","g":6,"s":468,"p":null,"d":"Локальное код-ревью перед push: команда openqodex review берёт незапушенные и незакоммиченные изменения, прогоняет сканеры (SAST, секреты, зависимости, линт) только по изменённым строкам, затем запускает отдельный процесс-ревьюер — Claude Code или Codex — на замороженной копии диффа. Ревьюер видит каждую изменённую строку и каждую находку сканера, ответ проверяется скриптами и собирается в report.html. Других ключей, кроме установленного и залогиненного агента, не требует; Node 22+, macOS/Linux или WSL.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"anteloc/ldraw-nova","u":"https://github.com/anteloc/ldraw-nova","k":"plugin","t":"3D-модели","g":1,"s":319,"p":null,"d":"Агент собирает модель LEGO по идее пользователя: на выходе исходник на языке LDraw, 3D-просмотр (в том числе VR на Meta Quest 3), редактируемый в Blender glTF, история чата и ход рассуждений агента. Работает как веб-приложение в Docker из двух репозиториев-соседей, образ занимает около 5 ГБ. Поиск подходящих деталей и образцов опирается на переранжирование моделью Jev (нужен ключ TypeSafe); без ключа агент откатывается на полнотекстовый поиск, и модели, по словам автора, могут выйти хуже. Найден через Show HN (167 очков), создан 23 сентября.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"Autumn1337/better-statusline","u":"https://github.com/Autumn1337/better-statusline","k":"plugin","t":"статус-строка","g":5,"s":167,"p":null,"d":"Статус-строка Claude Code над промптом: показатели сессии нарисованы точечными кольцами из брайлевых ячеек — заполнение контекста, остаток до остывания prompt cache, расход 5-часового и недельного лимитов (дуга желтеет при обгоне темпа), плюс карточка играющей музыки с акцентом из обложки. Нужен Claude Code 2.1.289+; карточка музыки — только macOS со Spotify или Apple Music, обложки — kitty или Ghostty. Построена на function hooks — раннем API, меняющемся между релизами.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"jarrodwatts/claude-image-view","u":"https://github.com/jarrodwatts/claude-image-view","k":"plugin","t":"моды CLI","g":10,"s":166,"p":null,"d":"Мод Claude Code, показывающий вставленные в промпт картинки миниатюрами над строкой ввода вместо голых тегов [Image #1]. Каждые 200 мс читает промпт, находит теги, берёт кэшированный PNG сессии и рисует превью через элемент Image — терминал сам читает файл, данные картинки через мод не проходят. Локальный, без сети и записи файлов. Нужен Claude Code 2.1.287+, macOS или Linux и терминал с графическим протоколом kitty (Ghostty, kitty); в других терминалах превью не рисуется.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"hamzafer/claude-code-mods","u":"https://github.com/hamzafer/claude-code-mods","k":"plugin","t":"моды CLI","g":10,"s":163,"p":null,"d":"Набор модов Claude Code на function hooks, ставятся по одному из маркетплейса: context-bar (стек-бар заполнения контекста), token-weather и usage-meter (лимиты и prompt cache), where-am-i и mission-control (цель, агенты и трогаемые файлы), review-watch (живые строки идущих ревью Codex), blast-radius (удерживает rm -rf и показывает, что удалится), md-preview, now-playing, игры и ленты. switchboard выбирает модель субагенту через OpenAI Decisions API или Jev.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"pi-pod/pipod","u":"https://github.com/pi-pod/pipod","k":"plugin","t":"песочницы","g":7,"s":159,"p":null,"d":"Сессии coding-агента Pi в изолированных песочницах («pods») на сервере, который вы держите сами. Автор собирает вокруг Pi то, что считает минимальной средой агентной разработки в организации: песочницы, нативные клиенты, совместный доступ к сессиям с ролями и автоматизацию браузера и приложений. Найден через Show HN (121 очко), создан 1 октября; хостинговая версия только анонсирована.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"transkatgirl/vibeclaude","u":"https://github.com/transkatgirl/vibeclaude","k":"plugin","t":"моды CLI","g":10,"s":129,"p":null,"d":"Плагин Claude Code на function hooks, связывающий события сессии (стриминг текста, вызовы инструментов, успех/отказ, ожидание разрешения, конец хода) с вибро-устройством через Intiface Central и buttplug.io по заданным паттернам интенсивности и длительности. Порт opencode-buttplugio, по словам автора написан Opus 5.5. Нужны Claude Code с function hooks (сборка против 2.1.291), Node.js 22+, запущенный WebSocket-сервер Intiface и совместимое устройство.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"joeseesun/qiaomu-codex-imagegen","u":"https://github.com/joeseesun/qiaomu-codex-imagegen","k":"plugin","t":"генерация изображений","g":1,"s":122,"p":null,"d":"Выносит встроенную генерацию изображений Codex наружу как MCP-сервер, CLI и скилл с общим ядром, чтобы её вызывал любой агент. Сначала предлагает минимум четыре разных по механике стилевых направления (24 шаблона, 48 пресетов, 20 стилей постер-дизайнеров Mondo), затем по выбору собирает промпт, генерирует и сверяет результат по условиям приёмки, рядом кладёт JSON с реальным промптом. Есть пресеты под Xiaohongshu, обложки видео и заголовки с безопасными зонами, плюс правила против выдуманных фактов и кривого текста.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"jarrodwatts/intermission","u":"https://github.com/jarrodwatts/intermission","k":"plugin","t":"моды CLI","g":10,"s":108,"p":null,"d":"Плагин Claude Code, открывающий рядом с транскриптом панель с Doom-deathmatch, пока Claude работает, и возвращающий управление, как только он закончил или запросил разрешение. Это Odamex без окна (кадры через разделяемую память в панель терминала) с картами Freedoom на общем сервере. При первом запуске тянет движок ~20 МБ.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"obie/auto-handoff","u":"https://github.com/obie/auto-handoff","k":"plugin","t":"handoff","g":3,"s":100,"p":null,"d":"Пишет handoff-документ, пока prompt cache ещё тёплый. Claude Code держит контекст сессии в кэше, остывающем через час после последнего запроса; плагин следит за простоем и после 50 минут бездействия сам запускает команду handoff, пока чтение контекста ещё дёшево. Один handoff на отлучку, /clear отменяет ожидание, проснувшийся с холодным кэшем ноутбук прогон пропускает. Встроенный скилл пишет docs/handoffs/\u003ctimestamp>-\u003cslug>.md и сам себе разрешает нужные инструменты через allowed-tools.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"JohnnyVizz/claude-kit","u":"https://github.com/JohnnyVizz/claude-kit","k":"plugin","t":"оркестрация","g":4,"s":88,"p":null,"d":"Маркетплейс из двух плагинов автора. savvy-flow — скилл с набором субагентов: модель сессии планирует задачу, раздаёт её исполнителям разного уровня и проверяет их работу. savvy-progress — мод, который рисует полосу прогресса над промптом и живую панель агентов; работает с любыми субагентами, а вместе со savvy-flow получает от него прогресс. Мод построен на function hooks, которые автор называет early-access API: проверено на Claude Code 2.1.286, между релизами может сломаться.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"luoluo-121/neural-creator-dashboard","u":"https://github.com/luoluo-121/neural-creator-dashboard","k":"plugin","t":"заметки","g":3,"s":77,"p":null,"d":"Локальный веб-дашборд для автора контента: работы, заметки, темы и черновики показываются как граф с пятью модулями и панелью анализа по каждой записи. Связи выводятся в браузере из данных — папки, двойные ссылки [[…]], теги, общие понятия; поиск по графу идёт по локальным правилам без вызова модели. В комплекте скилл, которым агент ставит проект и импортирует хранилище Obsidian или Markdown; скрипт импорта только читает заметки и не ходит в сеть.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"Dominic-DK/harness-map","u":"https://github.com/Dominic-DK/harness-map","k":"plugin","t":"аудит настроек","g":7,"s":76,"p":null,"d":"Python-скрипт без зависимостей, который читает настройки Claude Code — CLAUDE.md, память, MCP, скиллы, права, hooks — и строит HTML-схему: что именно получает модель в зависимости от стартовой папки и способа запуска агента (основная сессия, fork, субагент, Explore/Plan, участник команды, claude -p). Оценивает зрелость по шести направлениям; высший уровень даётся только при зафиксированной проверке. Только читает; тексты правил и токены в отчёт не попадают. Правила наследования зашиты из документации для Claude Code 2.1.287, а не из наблюдений.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"cablate/ctx-handoff-mod","u":"https://github.com/cablate/ctx-handoff-mod","k":"plugin","t":"моды CLI","g":10,"s":73,"p":null,"d":"Мод Claude Code для долгих сессий. На пороге 600k токенов дожидается завершения агента и субагентов, пишет сводку с разделением проверенной работы и непроверенных правок, делает /clear и продолжает в новом разговоре (handoff). Пока пользователя нет, подогревает prompt cache примерно до четырёх часов; повторяющиеся указания превращает в заметки проекта, а после трёх повторов предлагает строку в CLAUDE.md. Есть одностроковые подсказки при повторе упавшей команды и «готово» без проверки.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"jinrunsen/claude-my-privacy","u":"https://github.com/jinrunsen/claude-my-privacy","k":"plugin","t":"приватность","g":7,"s":72,"p":null,"d":"Плагин Claude Code, который подменяет заданные имена и названия компаний псевдонимами в тексте, уходящем модели, возвращает оригиналы перед запуском локальных инструментов и снова маскирует то, что инструменты вернули. Работает только по списку терминов из файла вне репозитория — это не детектор PII: всё ненастроенное уходит как есть. Замена best-effort, при сбое сессия не блокируется. Сам плагин модель и сеть не вызывает. Офлайн-проверки пройдены на macOS с Claude Code 2.1.290, для других версий и платформ автор требует перепроверки.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"sun168567/cc-desk-tunnel","u":"https://github.com/sun168567/cc-desk-tunnel","k":"plugin","t":"удалённый доступ","g":10,"s":72,"p":null,"d":"Связка из контейнера на Linux-сервере и десктоп-клиента для Windows: Claude Code работает на сервере, а файлы читает и команды выполняет на локальной машине через обратный SSH-туннель на базе frp. Клиент даёт список сессий по проектам, сворачиваемый ход работы, выбор модели, просмотр лимитов и задачи по расписанию. Официальный CLI не модифицируется, запуск идёт через Agent SDK. Автор предупреждает: проект в основном написан AI, аудита безопасности не было, это не песочница, а сервисный ключ равен полному контролю над компьютером.","h":0,"f":"curl | sh","i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"Tickloop/claude-mods","u":"https://github.com/Tickloop/claude-mods","k":"plugin","t":"моды CLI","g":10,"s":70,"p":null,"d":"Два небольших мода Claude Code, меняющих вид вывода. glamour-dark рисует текстовые ответы модели в тёмном стиле библиотеки glamour. tool-lines сжимает каждый вызов инструмента до одной строки вида «tool_call: Tool(input) - meta» и прячет блок с результатом. Ставятся по отдельности через marketplace и применяются командой /reload-plugins без перезапуска.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"data-goblin/claude-code-filetree","u":"https://github.com/data-goblin/claude-code-filetree","k":"plugin","t":"моды CLI","g":10,"s":69,"p":null,"d":"Мод Claude Code: дерево файлов в правой панели, как в IDE. Подсвечивает, что агент делает прямо сейчас — чтение и поиск, запись, commit — и раскрывает свёрнутые папки до нужного файла. Показывает git-статус по файлам и папкам с числом изменённых строк, ветку и отставание от upstream. Выбранный файл передаётся агенту как контекст через hook prompt.submit, а упоминание @path в промпте находит файл в дереве. Нужны Claude Code 2.1.287+, режим /tui fullscreen и терминал от 110 колонок; в WSL-сессиях десктоп-приложения моды не грузятся.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"alexknowshtml/claude-auto-handoff","u":"https://github.com/alexknowshtml/claude-auto-handoff","k":"plugin","t":"моды CLI","g":10,"s":67,"p":null,"d":"Мод Claude Code, заменяющий auto-compact на handoff: на пороге (по умолчанию 160k токенов под окно 200k) отказывает в новых вызовах инструментов, поручает Haiku написать бриф фиксированной структуры, делает /clear и запускает новую сессию одной строкой со ссылкой на бриф. Списки файлов, commit и issue берутся из транскрипта кодом, а не из памяти модели; цифры токенов, которых нет в фактах, помечаются как непроверенные. Защита от зацикливания ограничивает число handoff подряд. Шаблоны брифа и инструкций редактируются.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"theRizwan/FlagshipRouter","u":"https://github.com/theRizwan/FlagshipRouter","k":"plugin","t":"прокси","g":10,"s":64,"p":null,"d":"Локальный OpenAI-совместимый шлюз для Claude Code, Codex, Cursor, Cline и OpenCode, который показывает только провайдеров с бесплатным предложением: Kiro, OpenCode Free, бесплатные модели OpenRouter, NVIDIA NIM, Groq, Cloudflare Workers AI, Ollama. Вместо списка провайдеров — общая таблица моделей со статусом готовности и тестом в один клик; название продукта, команда CLI и политика провайдеров задаются в brand.json. Автор оговаривает, что набор тестов несёт известные падения и сверять его надо с прошлым прогоном.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"click6067-ship-it/token-tv","u":"https://github.com/click6067-ship-it/token-tv","k":"plugin","t":"расход и лимиты","g":5,"s":61,"p":null,"d":"Показывает лимиты Claude и Codex на дешёвых настольных Wi-Fi-часах без перепрошивки. Компьютер в той же сети раз в пять минут читает расход через собственный логин каждого инструмента, рисует на Python картинку 240×240 и загружает её в фотоальбом часов через штатную веб-страницу; на часы не попадают ни токены, ни пароли. Устаревшее значение помечается OLD, отсутствующее — прочерком, а не нулём. Автор оговаривает: проверено на одном экземпляре GeekMagic SmallTV со штатной прошивкой SD_PRO и хосте на Linux, нужен постоянно включённый компьютер.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"NahumLitvin/prismantis","u":"https://github.com/NahumLitvin/prismantis","k":"plugin","t":"моды CLI","g":10,"s":60,"p":null,"d":"Мод Claude Code, перерисовывающий ответы в терминале: таблицы с цветными заголовками, код с подсветкой Prism, блоки mermaid как текстовые диаграммы и графики, сжатые строки вызовов инструментов, кнопки копирования, 15 тем. Сетевых вызовов не делает, файлов не читает и команд не запускает; при включённой опции diagramHints добавляет к промптам короткую заметку для модели. Вручную проверено в терминале на macOS, тесты идут в CI на трёх ОС; десктоп-приложение, VS Code и мобильное автор не проверял.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"SaM-runtime/claude-console","u":"https://github.com/SaM-runtime/claude-console","k":"plugin","t":"оркестрация","g":4,"s":60,"p":null,"d":"Мод Claude Code для ведения нескольких проектов: панель с таблицей проектов, их состоянием и шестишаговым конвейером от spec до release, карточки решений, на которые отвечают цифровыми клавишами, и запуск проверки, синхронизации STATUS и ревью одной кнопкой. Исполнитель — фоновые агенты Claude Code или Codex с откатом на Claude при нехватке квоты. Рядом показаны Git, PR, CI, лимиты и состояние prompt cache; есть guards на необратимые команды и на третью попытку после двух одинаковых ошибок.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"dongnguyenvie/BashCut","u":"https://github.com/dongnguyenvie/BashCut","k":"plugin","t":"видео","g":1,"s":58,"p":null,"d":"Нативный видеоредактор для macOS, которым может управлять агент: всё, что делает интерфейс, доступно через CLI bashcut и MCP-сервер — 140 команд с dry run, проверкой ревизии и одной отменяемой правкой на вызов. Терминалы Claude Code и Codex встроены рядом с таймлайном. Проекты хранятся обычным JSON; правки агента видны в истории и откатываются одним шагом, а scope guard ограничивает их выбранными клипами. Команда ui frame рендерит любой кадр в PNG, чтобы агент видел результат. Редактор, по словам автора, в активной разработке; нужна macOS 14+.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"ostiums/fixkit","u":"https://github.com/ostiums/fixkit","k":"plugin","t":"iOS","g":9,"s":58,"p":null,"d":"Связка библиотеки и плагина для правки интерфейса iOS-приложения из симулятора: долгое нажатие на элемент, текст жалобы — и отчёт со скриншотом и именем элемента попадает промптом в сессию Claude Code или Codex, а баннер в приложении показывает ход исправления. Библиотека работает только в debug-сборках: Swift-пакет для SwiftUI и UIKit, npm-пакет для React Native. Локальный сервер на 127.0.0.1:4747 принимает отчёты. В Claude Code есть панель очереди, в Codex её нет. Только симулятор; Android и нативные Modal пока не поддержаны.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"isas1/daily-team","u":"https://github.com/isas1/daily-team","k":"plugin","t":"генеративное","g":1,"s":52,"p":null,"d":"Автономный конвейер на GitHub Actions: каждый день скрипт детерминированно выводит из даты команду из четырёх ролей с методами и ограничением, языковая модель разыгрывает их спор и собирает небольшой веб-инструмент одним HTML-файлом. Скрипты проверяют результат: мобильная вёрстка, размер до 100 КБ, отсутствие сетевых запросов; при провале один повтор, затем пометка «needs review». Недельный отчёт пишет модель только из собранных фактов, а проверка отклоняет числа и имена, которых в них нет. По умолчанию — бесплатные модели OpenRouter.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"efim0v/brow","u":"https://github.com/efim0v/brow","k":"plugin","t":"расход и лимиты","g":5,"s":51,"p":null,"d":"Приложение для macOS, которое показывает в вырезе экрана MacBook лимиты нескольких аккаунтов Claude Code сразу: пятичасовой, недельный и по моделям, время до сброса, календарь сбросов. Копирует команду запуска Claude Code под выбранным аккаунтом и открывает вход в отдельном профиле браузера для каждого. Автор предупреждает: токен читается из Keychain и уходит только на недокументированные эндпоинты Anthropic, которые могут измениться; запасное обновление токена включено по умолчанию и тратит немного лимита.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"GGGODLIN/cc-mod-image-view","u":"https://github.com/GGGODLIN/cc-mod-image-view","k":"plugin","t":"моды CLI","g":10,"s":45,"p":null,"d":"Мод Claude Code, показывающий вставленные картинки: ряд пронумерованных миниатюр над промптом, пока в черновике есть теги [Image #n], и кнопки под отправленными сообщениями с превью по наведению и увеличением в боковой панели. JPG, GIF и WebP конвертирует в PNG локальными утилитами (sips, ffmpeg, magick), сети и моделей не вызывает. Нужен Claude Code 2.1.287+, macOS или Linux и терминал с kitty graphics; автор оговаривает, что проверено только в Herdr на macOS, а вставка из буфера через ctrl+v не тестировалась.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"lcandy2/sim-agentation","u":"https://github.com/lcandy2/sim-agentation","k":"plugin","t":"iOS","g":9,"s":44,"p":null,"d":"Аннотирование запущенного iOS-симулятора в браузере: экран замораживается, выбираешь элемент или область, пишешь, что поменять, и агент получает элемент, экран, строки для поиска в исходниках и два скриншота. Данные берутся из accessibility tree симулятора, так что SDK в приложении не нужен; передача идёт через MCP-сервер с семью инструментами или копированием в Markdown. Требуются macOS на Apple Silicon и Xcode 26; автор предупреждает, что используются приватные фреймворки Xcode и новый релиз может всё сломать.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"scasella/claude-flightdeck","u":"https://github.com/scasella/claude-flightdeck","k":"plugin","t":"моды CLI","g":10,"s":43,"p":null,"d":"Мод Claude Code с живой панелью сессии в терминале: контекст и стоимость, лимиты плана, таймлайн обращений к advisor, каждая проверка разрешений, субагенты карточками или swimlanes, журнал событий. Только наблюдает: hooks передают события без изменений, сетевых запросов, процессов и записи файлов нет, что автор предлагает проверить через claude plugin validate. Нужен Claude Code 2.1.287+; часть меток (моменты консультаций) выводится эвристикой и помечена как inferred, а API модов ещё может меняться.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"fidipro/gluon","u":"https://github.com/fidipro/gluon","k":"plugin","t":"оркестрация","g":4,"s":42,"p":null,"d":"Терминальная оболочка-диспетчер для кодинг-агентов: в одном окне запускает Claude Code, Codex, Antigravity, Grok Build, OpenCode и Kimi Code на ваших ключах или подписках. Перед сессией intake-агент читает репозиторий, задаёт вопросы и предлагает связку harness × модель × effort со спецификацией; дальше маршрутизация идёт по настраиваемым правилам в routing.yaml. Ведёт учёт стоимости и контекста по сессиям. Установщик берёт бинарник из релизов проекта и сверяет SHA256.","h":0,"f":"curl | sh","i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"zycck/claude-mods","u":"https://github.com/zycck/claude-mods","k":"plugin","t":"моды CLI","g":10,"s":40,"p":null,"d":"Мод plan-progress для Claude Code: полосы прогресса над промптом, по строке на задачу, с этапами, шагами и списком субагентов под каждой (модель, effort, текущий инструмент, время). Работает через зарегистрированный инструмент plan_progress: Claude один раз отправляет план и затем короткие обновления, неизвестное имя шага отклоняется; план, одобренный в plan mode, сам становится полосой. Строки агентов берутся из событий движка и токенов не стоят.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"edrisranjbar/lifeos","u":"https://github.com/edrisranjbar/lifeos","k":"plugin","t":"MCP · личные данные","g":9,"s":40,"p":null,"d":"Самостоятельно размещаемая личная панель на PHP и MySQL — фокус, привычки, цели, финансы, Kanban — со встроенным MCP-сервером на 26 инструментов: Claude и другие ассистенты читают панель, планируют цели, отмечают привычки и записывают расходы. Найден через Show HN (34 очка), создан 5 сентября; в поиске по скиллам такие проекты не видны, потому что описывают себя через MCP.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"achammah/claude-chat-clean","u":"https://github.com/achammah/claude-chat-clean","k":"plugin","t":"моды CLI","g":10,"s":39,"p":null,"d":"Мод Claude Code, меняющий только вид чата: остаются ваши сообщения и ответы Claude, а все вызовы инструментов за ход сворачиваются в одну раскрываемую строку вида «5 steps this turn». Субагенты, фоновые запуски, вопросы и ошибки тоже сжимаются до одной строки с подсказкой, что делать. Три режима — clean, normal и raw — переключаются командой /feed на лету; ctrl+o по-прежнему показывает полный transcript.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"hellosverre/claude-skins","u":"https://github.com/hellosverre/claude-skins","k":"plugin","t":"моды CLI","g":10,"s":37,"p":null,"d":"Мод Claude Code, перерисовывающий transcript: вызовы инструментов с иконками и временем, правки как diff-карточки, таблицы, код и вывод shell в карточках, спиннер по фазам и полоса над промптом с контекстом, лимитами плана и кнопкой Compact. Семь скинов, светлые и тёмные, переключаются командой /skin; агент получает инструмент design и может собрать скин по описанию. Меняется только отрисовка — сохранённый диалог и то, что читает модель, не трогаются.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"amos689/paper-preflight","u":"https://github.com/amos689/paper-preflight","k":"plugin","t":"наука","g":13,"s":35,"p":null,"d":"Проверка библиографии перед подачей статьи: читает .tex и .bib (а также Word, Markdown, Typst, PDF) и сверяет каждую ссылку с Crossref, dblp, arXiv, DataCite, PubMed и OpenAlex — существует ли работа, совпадают ли метаданные, не отозвана ли, не вышел ли препринт. Вердикты выносятся без LLM; когда источники не ответили, пишет «cannot determine», а не «not found». По данным автора, на 151 выдуманной ссылке из подборки GPTZero помечены 94%. Для Claude Code — плагин с MCP-сервером и скиллом.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"mewsdev/AiOperationsRoom","u":"https://github.com/mewsdev/AiOperationsRoom","k":"plugin","t":"дашборд","g":5,"s":35,"p":null,"d":"Локальная «операционная комната» для наблюдения за сессиями и субагентами Claude Code: command hooks на SessionStart, UserPromptSubmit, Stop, SubagentStart, SubagentStop и SessionEnd пишут метаданные в SQLite, а веб-интерфейс на 127.0.0.1 показывает панель и пиксельный офис с активными запусками. Промпты, ответы и transcript не сохраняются — только идентификаторы, тип агента, каталог и время. Автор оговаривает: версия только для Windows, без аутентификации и удалённого доступа, интерфейс опрашивает API раз в четыре секунды.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"IuCC123/CLIProxyAPI-Rust","u":"https://github.com/IuCC123/CLIProxyAPI-Rust","k":"plugin","t":"прокси","g":10,"s":34,"p":null,"d":"Прокси одним бинарником на Rust: отдаёт совместимые с OpenAI, Anthropic и Gemini эндпоинты поверх ваших подписок и ключей — Claude, ChatGPT, Antigravity, Grok, Kimi, Meta, Devin, Vertex AI — и переводит запросы между форматами, так что в Claude Code можно вызвать GPT, а в Codex — Claude. Новые сессии направляет на аккаунт с наибольшим остатком квоты и держит там ради prompt cache; есть встроенный дашборд лимитов. Заявлена совместимость с конфигами CLIProxyAPI; около 8 МБ и 13 МБ памяти — по данным автора.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"alan890104/claude-code-paste-preview","u":"https://github.com/alan890104/claude-code-paste-preview","k":"plugin","t":"моды CLI","g":10,"s":34,"p":null,"d":"Мод Claude Code для вставленных картинок: миниатюры над промптом и в transcript вместо голых [Image #N] и редактор, который открывается в момент вставки — перо, эллипс, рамка, стрелка, текст, обрезка. По Enter исходная вставка выбрасывается из сообщения, а Claude получает указание прочитать размеченный файл. На macOS редактор — нативная панель, компилируемая при первом запуске через Xcode Command Line Tools; на Linux и Windows — окно браузера.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"h9-tec/arabic-ai-atlas","u":"https://github.com/h9-tec/arabic-ai-atlas","k":"plugin","t":"каталог","g":0,"s":33,"p":null,"d":"Каталог арабской AI-экосистемы — более трёх тысяч записей: LLM, ASR, TTS, OCR, эмбеддинги, датасеты, бенчмарки, статьи, организации — в виде интерактивной карты, списка и плагина Claude Code с пятью скиллами и MCP-сервером, который читает атлас офлайн. Источник правды — YAML в data/: CI проверяет каждый pull request по схеме, а ночная задача подтягивает скачивания с Hugging Face и пересобирает карту, README и llms.txt. Агент отвечает на вопросы вроде «какой открытый арабский TTS работает на телефоне» через инструмент recommend; нужен uv.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"whyashthakker/awesome-claude-code-mods","u":"https://github.com/whyashthakker/awesome-claude-code-mods","k":"plugin","t":"моды CLI","g":10,"s":33,"p":null,"d":"Коллекция из 70 самостоятельных модов Claude Code под MIT — 50 общих и 20 для вкладки Code в desktop-приложении: счётчик контекста, квоты, инспектор кэша, тайминги инструментов, просмотр веток, stash, worktree и конфликтов, доски задач и заметок. У каждого мода исходник, тесты, описание доступа и скриншот; ставятся по одному из общего marketplace. Автор оговаривает, что скриншоты — рендер из тестового набора на фикстурах, а не снимки приложения.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"sojei1989/ai-meeting-room","u":"https://github.com/sojei1989/ai-meeting-room","k":"plugin","t":"оркестрация","g":4,"s":33,"p":null,"d":"Локальное веб-приложение для macOS, где Claude Code и Codex CLI работают в одном окне: Claude читает проект и предлагает план с вариантами и рисками, Codex раскладывает работу на карточки с уровнем риска, а каждое изменение файлов выполняется только после вашего одобрения. Перед этим ставится git-точка отката; Claude всегда только читает, Codex пишет лишь в перечисленные в карточке файлы, после чего Claude делает ревью. Интерфейс на традиционном китайском; расход идёт из ваших подписок, раунд, по словам автора, занимает 10–20 минут.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"petekp/inbox","u":"https://github.com/petekp/inbox","k":"plugin","t":"моды CLI","g":10,"s":31,"p":null,"d":"Мод Claude Code, собирающий в одну панель всё, что ждёт человека: вопросы Claude, задачи, упавшие тесты и сборки, найденные попутно баги и идеи, а также pull request'ы сессии с блокерами и ревью-комментариями. Над промптом — строка с текущей работой и счётчиком ожидающего; на вопрос можно ответить клавишей. Если Claude заявляет, что тесты проходят, а последний запуск упал или не повторялся после правки, мод просит перезапустить. Цена: вызов Sonnet после каждого ответа, около 1% стоимости длинной сессии на Opus, по данным автора.","h" rXiv.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"dieqiyun/uni-switch","u":"https://github.com/dieqiyun/uni-switch","k":"plugin","t":"провайдеры","g":10,"s":26,"p":null,"d":"Десктоп-приложение на Tauri для Windows, Linux и macOS: переключает API-адрес и ключ в Codex и Claude Code одним кликом, само определяет протокол и модели, конвертирует между Claude Messages и OpenAI.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"cth9191/jev-compaction-plus","u":"https://github.com/cth9191/jev-compaction-plus","k":"plugin","t":"compaction","g":3,"s":26,"p":null,"d":"Плагин Claude Code, отдающий compaction модели Jev: нужные результаты инструментов остаются дословно, остальное уходит в drawer-файл; по данным автора, около 0,5 с вместо 35 с на одной сессии.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"vayungodara/cliproxy-rs","u":"https://github.com/vayungodara/cliproxy-rs","k":"plugin","t":"прокси","g":10,"s":25,"p":null,"d":"Локальный прокси на Rust, совместимый с CLIProxyAPI: одна точка входа, через которую Codex CLI и Claude Code ходят в DeepSeek, GLM, Kimi, OpenRouter, с переводом между API OpenAI, Anthropic и Gemini.","h":1,"f":"curl | sh","i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"kagamiurayama/claude-code-roof-mod","u":"https://github.com/kagamiurayama/claude-code-roof-mod","k":"plugin","t":"системный промпт","g":10,"s":25,"p":null,"d":"Руководство на китайском с двумя модами Claude Code — пробником и заменителем: через события prompt.section и prompt.attachment системный промпт и system-reminder подменяются своим текстом без правки бинарника.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"HeyCubit/effortless","u":"https://github.com/HeyCubit/effortless","k":"plugin","t":"расход и лимиты","g":5,"s":24,"p":null,"d":"Мод Claude Code: судья на Haiku выбирает reasoning effort и модель для каждого промпта, полоса над промптом показывает заполнение контекста и prompt cache, handoff и compact — в один клик.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"floorianmb/prism-viz","u":"https://github.com/floorianmb/prism-viz","k":"plugin","t":"Obsidian","g":3,"s":23,"p":null,"d":"Плагин Obsidian для интерактивных графиков, диаграмм, дашбордов и формул в заметках: работает офлайн в sandbox, а приложенный скилл даёт Claude Code и Codex рендерить и проверять написанное.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"NovusEdge/glowup","u":"https://github.com/NovusEdge/glowup","k":"plugin","t":"моды CLI","g":10,"s":22,"p":null,"d":"Мод Claude Code: боковая панель с изменёнными файлами, diff, субагентами и расходом контекста, строка активности над промптом, темы и паки в JSON и пиксельный питомец Clawd, реагирующий на тесты.","h":1,"f":"curl | sh","i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"Audatic07/duo","u":"https://github.com/Audatic07/duo","k":"plugin","t":"оркестрация","g":4,"s":22,"p":null,"d":"Локальное десктоп-приложение, сводящее Claude Code и Codex: чат, ответы бок о бок, pair-режим в отдельном git worktree, дебаты с реестром утверждений, перекрёстное код-ревью и совет с анонимным ранжированием.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"sparklecatta-lang/XSXB-Band","u":"https://github.com/sparklecatta-lang/XSXB-Band","k":"plugin","t":"музыка","g":1,"s":22,"p":null,"d":"Локальная студия аранжировки со скиллом: агент пишет редактируемую партитуру, а играют её семплы живых инструментов с лицензией CC0 — 71 инструмент, экспорт WAV, MIDI и дорожек, без моделей генерации музыки.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"dgokcin/claude-pokemon-mod","u":"https://github.com/dgokcin/claude-pokemon-mod","k":"plugin","t":"моды CLI","g":10,"s":22,"p":null,"d":"Мод Claude Code: пиксельный покемон над промптом показывает иконками чтение, правки и shell, роняет Poké Ball на каждого субагента, сигналит о вопросах, получает опыт и эволюционирует; 151 вид.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"danielmiessler/Deeds","u":"https://github.com/danielmiessler/Deeds","k":"plugin","t":"метрики","g":5,"s":21,"p":null,"d":"CLI и плагин Claude Code, который читает diff каждого commit и считает, что стало лучше, в трёх видах — cap, fix и tend; сообщения commit не читаются, судит модель Jev от TypeSafe.","h":1,"f":"curl | sh","i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"artemnovichkov/xcode-mods","u":"https://github.com/artemnovichkov/xcode-mods","k":"plugin","t":"iOS","g":9,"s":20,"p":null,"d":"Плагин Claude Code поверх headless Xcode MCP: полоса над промптом со схемой и устройством, панель Build, Run и Tests и панель Canvas со снимками SwiftUI #Preview прямо в терминале.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"joshhu/claudebigimage","u":"https://github.com/joshhu/claudebigimage","k":"plugin","t":"моды CLI","g":10,"s":20,"p":null,"d":"Мод Claude Code, показывающий вставленные картинки крупно над промптом или в отдельной панели рядом с диалогом; максимальный размер превью настраивается, сети и записи на диск нет.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"lemomo-ai/lemo-mod","u":"https://github.com/lemomo-ai/lemo-mod","k":"plugin","t":"моды CLI","g":10,"s":19,"p":null,"d":"Набор модов Claude Code для терминала и desktop app: 21 стиль с цветами, пиксельным маскотом и звуками плюс включаемые по одной функции — полоса расхода, номера сообщений, таймер, заметки, итоги сессии.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"Sumit189/explain-claude-mod","u":"https://github.com/Sumit189/explain-claude-mod","k":"plugin","t":"объяснения","g":2,"s":19,"p":null,"d":"Мод Claude Code с командой /explain: ответы приходят как текст по ASD-STE100, диаграмма Mermaid в панели, интерактивная HTML-страница или озвуче карточки.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"charlesdove977/competitor-hunter","u":"https://github.com/charlesdove977/competitor-hunter","k":"plugin","t":"контент","g":13,"s":10,"p":null,"d":"Локальное веб-приложение для авторов: Claude Code в headless-режиме собирает посты конкурентов за 80 дней с YouTube, Instagram и Reddit, модель Jev оценивает каждый, лучшие сохраняются и разбираются.","h":1,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"security-guidance","u":"https://github.com/anthropics/claude-plugins-official/commit/01f8be9b","k":"official","t":null,"g":14,"s":null,"p":null,"d":"(02.10) — модель ревью больше не прибита к claude-opus-4-7: плагин спрашивает у настроенного endpoint самый новый Opus (ответ кэшируется на сутки, запасной вариант — claude-opus-5-5), а агентное ревью commit'ов и все ревью на Bedrock, Vertex и Foundry идут через алиас opus. SECURITY_REVIEW_MODEL и SG_AGENTIC_MODEL по-прежнему закрепляют модель.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"security-guidance","u":"https://github.com/anthropics/claude-plugins-official/commit/a22217bb","k":"official","t":null,"g":14,"s":null,"p":null,"d":"(05–07.10) — не оставляет временных копий индекса в каталоге git, когда git или hook убиты посреди работы, и убирает stash-индексы, оставленные прежними версиями.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"receipts","u":"https://github.com/anthropics/claude-plugins-official/commit/0baf7d19","k":"official","t":null,"g":14,"s":null,"p":null,"d":"(08.10) — при сверке commit'ов опрашивает все клоны репозитория и прямо сообщает, что git недоступен, если клон вернул ошибку, а commit'ов не нашлось ни в одном.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"OpenAI: сотни машинных математических рукописей и три отзыва на следующий день","u":"https://github.com/openai/math/blob/main/history.md","k":"research","t":null,"g":14,"s":null,"p":1325,"d":"OpenAI, 06–07.10 (по репозиторию openai/math; страница анонса не открылась). Компания выложила рукописи и артефакты доказательств, полученные её моделями: 719 заявленных результатов, из них формализовано 300, около 42%. Уже 7 октября три рукописи отозваны: ошибка знака в одной обрушила рассуждение, на которое опирались две другие. Ещё 14 рукописей исправлены, 13 обновлены вслед за ними. Следует: машинный результат без формальной проверки — заявление, а не факт; и чем длиннее цепочка работ, опирающихся друг на друга, тем дороже одна непроверенная ссылка. То же верно для цепочек агентов: проверка нужна на каждом звене, а не в конце.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"Агенты на Opus 5.5 нашли двух кандидатов в магнитные полупроводники","u":"https://www.vals.ai/blogs/room-temperature-magnetic-semiconductors","k":"research","t":null,"g":14,"s":null,"p":491,"d":"Геби Джафф (Vals AI), 04.10. Команда агентов на Claude Opus 5.5 считала DFT на двух уровнях приближения — быстром PBE+U и медленном HSE06 — и вышла на два соединения: спроектированное YBaMnFeO₅ и известное с 1999 года KV[Cr(CN)₆]. Число агентов, обвязка, длительность и стоимость в посте не названы. Важнее форма отчёта: входные файлы, сырые выводы, код анализа, проверка одной командой, независимые перезапуски и список оговорок лежат в открытом репозитории, а в тексте прямо сказано, что экспериментально ни одно свойство не измерено и два метода расходятся в оценке влияния воды. Следует: так выглядит результат агента, которому можно возражать, — воспроизводимый пакет плюс перечень того, чего он не доказывает.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"Agents don't need memory, they need documentation","u":"https://liao.gg/blog/agents-dont-need-memory","k":"research","t":null,"g":14,"s":null,"p":383,"d":"Кевин Ляо, 03.10. Плагины памяти, по автору, — тот же RAG: транскрипты режутся на фрагменты, складываются в векторную базу, и пять ближайших подмешиваются в промпт. Сходство не говорит, верна ли запись и не устарела ли она, а базу из десяти тысяч эмбеддингов нельзя проревьюить. Взамен — документация: спецификации, решения и индексы в Markdown под git, которые агент читает перед работой и переписывает после, пока контекст ещё полон; факты заменяются, а не дописываются. Без этого проект, по оценке автора, тратит около 80 тыс. токенов на повторное исследование в каждой сессии. Автор продвигает собственный инструмент Operator Memory. Следует: память проекта стоит держать там, где её видно в diff и можно ревьюить как код.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"Агенты OpenAI на проектах Wikimedia","u":"https://diff.wikimedia.org/2026/10/05/openai-rogue-agent-activities-found-on-wikimedia-projects/","k":"research","t":null,"g":14,"s":null,"p":304,"d":"Wikimedia Foundation, 05.10. Собственное расследование фонда нашло следы агентов, предположительно управляемых OpenAI: тестовые правки в песочницах, несколько правок конфигурации инструмента цитирования, которые фонд считает потенциально вредоносными, неудачные попытки использовать Etherpad как прокси к другим сайтам, миллионы запросов к API и сотни тысяч — к Wikidata Query Service, что могло способствовать частичному отказу в мае. Компрометации данных не найдено. Саймон Уиллисон предполагает, что это тот же рой, что испортил немецкую вики. Следует: фонд просит делать агентов опознаваемыми; оператору агента с сетевым доступом стоит заранее решить, как его трафик отличат от атаки.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"Docker Agent: агенты как YAML и OCI-образы","u":"https://github.com/docker/docker-agent","k":"research","t":null,"g":14,"s":null,"p":299,"d":"Docker, сюжет на HN 07.10 (репозиторию больше года, ★4262). Плагин docker agent: команда агентов описывается декларативным YAML — модель, инструкция, наборы инструментов, включая любые MCP-серверы, — и публикуется в OCI-реестр, откуда её запускают как образ. Встроены инструменты think, todo и memory и RAG с BM25, эмбеддингами и переранжированием; провайдеры — от Anthropic и OpenAI до локальных моделей через Docker Model Runner. Плагин предустановлен в Docker Desktop 4.63+. Следует: дистрибуция агентов сходится к тем же каналам, что и у контейнеров, — версия, реестр, подпись.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"Getting the most out of Opus 5.5 in Claude and Claude Code","u":"https://claude.dev/blog/getting-the-most-out-of-opus-5-5/","k":"research","t":null,"g":14,"s":null,"p":250,"d":"Эдди Османи (Anthropic), 22.09; на HN — 03.10. Практика под Opus 5.5: задавать финишную черту и условие остановки («Done means: …; остановись и спроси, только если тест падает по необъяснимой причине»), убрать «think step by step» — модель и так рассуждает, а глубину менять через effort. Для аудитов и миграций — раздать по сервису на субагента и проверять доказательства каждого перед приёмкой. В CLAUDE.md записать, когда продолжать без вопросов и что считать разрушительным. Список задач длинного прогона держать в файле, потому что старые ходы сжимаются. Следует: инструкции, написанные под прежние модели, стоит перечитать — часть из них теперь мешает.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"«Модели решений» не обгоняют LLM-судью и обычные классификаторы","u":"https://developers.redhat.com/articles/2026/10/02/benchmarking-ai-decision-models-against-traditional-guardrails","k":"research","t":null,"g":14,"s":null,"p":166,"d":"Роб Геада, Мак Мисюра, Шелтон Сирил (Red Hat), 02.10. На наборах EvalHub для prompt injection и токсичности сравнили готовые классификаторы, zero-shot BART 2019 года, LLM-судей и модели решений вроде Jev. По prompt injection первая Qwen3.6-35B — 89,31%, но DeBERTa-классификатор отстаёт на треть пункта (89,01%) при медиане 54 мс. По безопасности контента Jev лучший (86,20%), но с медианой 360 мс. Оговорки авторов: промпты адаптированы от LLM-судей, задержка включает сеть Великобритания–США, только английский. Следует: прежде чем ставить модель решений на гейт вызовов инструментов, стоит сравнить её с дешёвым классификатором на своих данных; несколько таких гейтов есть в каталоге этого выпуска.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"What is Codemode","u":"https://lucumr.pocoo.org/2026/10/6/codemode/","k":"research","t":null,"g":14,"s":null,"p":154,"d":"Армин Ронахер, 06.10. Codemode — вызовы инструментов из скрипта: в Pi модель пишет JavaScript, он исполняется в ограниченной песочнице QuickJS/WASM на стороне харнесса, комбинирует вызовы, запускает их параллельно и кладёт результаты в транскрипт, не заливая контекст модели. Автор разделяет «мозг» (доверенный харнесс) и «руки» (среду, где работают инструменты); Codemode живёт на стороне мозга и находит MCP-инструменты поиском из скрипта вместо загрузки всех описаний. Претензия к MCP-серверам со своим Codemode внутри — двойное экранирование, которое путает малые модели. Открытые вопросы — долговечность длинных скриптов и выбор языка. Следует: серверу лучше отдавать структурированный вывод, одинаковый при любом размере результата, а композицию оставить клиенту.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"Порт компилятора TypeScript на Rust силами LLM","u":"https://github.com/pingdotgg/ts-rust","k":"research","t":null,"g":14,"s":null,"p":111,"d":"Ping (репозиторий pingdotgg/ts-rust, ★737), 07.10. По словам автора, месяцы циклов на моделях OpenAI стоили более $400 тыс. по ценам API, дали 1,3 млн строк Rust и не поднялись выше примерно 84% совместимости. Opus 5.5 начал с нуля, выдал рабочую версию за 10 часов и за две недели довёл порт до совместимости со всеми реальными проектами, на которых его проверяли, — примерно за $24 тыс. Автор признаётся, что не читал ни строки кода, и называет релиз ранним. Цифры авторские, независимой проверки нет. Следует: наличие эталона (исходный компилятор и его тесты) превращает порт в задачу, которую агент может гнать сам; вопрос сопровождения кода, который никто не читал, остаётся открытым.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"Жёсткие лимиты расходов должны стать умолчанием","u":"https://simonwillison.net/2026/Oct/3/default-hard-budget-caps/","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Саймон Уиллисон, 03.10. Агенты упростили создание вещей, которые стоят денег, — платных вызовов API и размещённых приложений, — поэтому сервисам с оплатой по факту нужен жёсткий лимит по умолчанию: при достижении суммы сервис отключается и отдаёт ошибки. Письма-предупреждения мало: большинство предпочтёт ошибки счёту на $10 000. Движение есть: AWS в сентябре объявила месячные лимиты, останавливающие проект (пока для ограниченного числа клиентов), Google Cloud в июле запустила Spend Caps. Следует: ключи, которые получает агент, стоит выдавать только там, где есть жёсткий потолок; у Anthropic с этой недели автопополнение можно выключить.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"Automating eval design and hillclimbing with Claude","u":"https://claude.dev/blog/automating-eval-design-and-hillclimbing/","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Лэнс Мартин (Anthropic), 28.09. Как устроены режимы скилла claude-api. build-eval набирает случаи в фиксированном порядке — рабочие транскрипты, баг-репорты, пять–десять написанных вручную, затем синтезированные по коду, — выбирает самый дешёвый подходящий грейдер и предупреждает, если базовый результат уже около 95%. hillclimb делит набор на train и test и за раунд предлагает одну правку: она остаётся, только если выросли оба. До первого раунда проверяется, что шум eval меньше минимального значимого улучшения. Пример автора: на 44 тикетах поддержки Sonnet 5 на низком effort дал 98,9% при цене около цента за тикет против 74,4% и 4,6 цента у исходной связки с Opus 4.8. Следует: улучшение в пределах шума не сливать; hillclimb годится для дёшево меняемых поверхностей с узкой целью.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"How Block orchestrates Claude Fable across thousands of pull requests","u":"https://claude.com/resources/articles/how-block-orchestrates-claude-fable-across-thousands-of-pull-requests","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Брэдли Аксен (Block), 08.10. Миграции на сотни и тысячи PR через несколько репозиториев: Fable под управлением инженера делает проектную работу — модели данных, спецификации API, алгоритмы — и раздаёт правки файлов и прогон тестов десяткам моделей поменьше, Opus и Sonnet. Изменения агентов проходят проверки безопасности, каждый деплой одобряют двое людей, merge в main остаётся за человеком. Дешёвые проверки без модели — регулярки, малые классификаторы — стоят прямо в рабочих интерфейсах. Цифр стоимости и успешности в статье нет. Следует: замерять каждую модель на каждом effort и ставить автовыбор, чтобы рутина не уходила самой сильной модели по умолчанию.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"Claude Code in the cloud: a field guide to cloud sessions","u":"https://claude.dev/blog/claude-code-in-the-cloud/","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Эдди Османи (Anthropic), 06.10. Облачная сессия — отдельная виртуальная машина на задачу с клоном репозитория на новой ветке; запускается из claude.ai/code, мобильного и desktop-приложений, терминала (claude --cloud) или Slack. Входит в Pro, Max, Team и Enterprise, но расходует общие лимиты, поэтому параллельные сессии съедают их быстрее; с ключом Console и сторонними провайдерами недоступна. Простаивающие машины забирают, так что commit'ить надо по ходу. Личный ~/.claude в облако не едет. Следует: скиллы, команды и инструкции по тестам, нужные облачной сессии, должны лежать в репозитории; сессии давать одну самодостаточную задачу с командой, которая доказывает готовность.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"}]</script>

$('copy').textContent = new Date().getFullYear();

// Состояние отбора живёт в адресе страницы: ссылку на выборку можно сохранить,

const state = { q: '', sort: 'stars', full: false, kinds: new Set(), groups: new Set() };
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  state.q = p.get('q') || ''; state.sort = p.get('sort') || 'stars';
  state.full = p.get('full') === '1';
  state.kinds = new Set((p.get('kind') || '').split(',').filter(Boolean));
  state.groups = new Set((p.get('topic') || '').split(',').filter(Boolean).map(Number));
}
function writeHash() {
  const p = new URLSearchParams();
  if (state.q) p.set('q', state.q);
  if (state.sort !== 'stars') p.set('sort', state.sort);
  if (state.full) p.set('full', '1');
  if (state.kinds.size) p.set('kind', [...state.kinds].join(','));
  if (state.groups.size) p.set('topic', [...state.groups].join(','));
  history.replaceState(null, '', p.size ? '#' + p : location.pathname);
}

for (const r of ROWS) r.x = (r.n + ' ' + (r.t || '') + ' ' + r.d).toLowerCase();

// Отбор без одного из измерений: счётчик на кнопке показывает, сколько позиций
// даст её нажатие при остальных выбранных условиях.
function match(r, skip) {

  if (state.full && r.h) return false;

  if (skip !== 'group' && state.groups.size && !state.groups.has(r.g)) return false;
  return true;
}

const SORT_NAMES = { stars: 'По звёздам', new: 'Свежие выпуски', name: 'По названию' };
const SORTS = {
  stars: (a, b) => (b.s ?? b.p ?? -1) - (a.s ?? a.p ?? -1) || a.n.localeCompare(b.n),
  new: (a, b) => b.i - a.i || (b.s ?? -1) - (a.s ?? -1),

};

function chips(box, keys, label, counts, active, kind) {
  box.innerHTML = keys.filter(k => counts.get(k) || active.has(k)).map(k =>
    '<button class="chip" type="button" data-' + kind + '="' + k + '" aria-pressed="' + active.has(k) + '">'
    + esc(label(k)) + '<small>' + (counts.get(k) || 0) + '</small></button>').join('');
}

const numCell = r => r.s != null ? '<div class="num">★ ' + r.s.toLocaleString('ru-RU') + '</div>'
  : r.p != null ? '<div class="num">' + r.p + '<small>очков</small></div>'
  : '<div class="num none">—</div>';

function item(r) {
  const name = r.u ? '<a class="name" href="' + esc(r.u) + '" rel="noopener">' + esc(r.n) + '</a>' : '<span class="name">' + esc(r.n) + '</span>';
  return '<li class="it">' + numCell(r)
    + '<div class="head">' + name + (r.t ? '<span class="topic">' + esc(r.t) + '</span>' : '')
    + '<span class="tags"><span>' + KINDS[r.k] + '</span>'
    + (r.f ? '<span class="flag">' + esc(r.f) + '</span>' : '')
    + '<a href="' + esc(r.a) + '.html">выпуск №' + r.i + '</a></span></div>'
    + '<p class="desc' + (r.d.length > 260 ? ' clamp' : '') + '">' + esc(r.d) + '</p>'
    + (r.d.length > 260 ? '<button class="more" type="button" aria-expanded="false">развернуть</button>' : '')
    + '</li>';
}

function render() {
  const count = (skip, key) => { const m = new Map(); for (const r of ROWS) if (match(r, skip)) m.set(r[key], (m.get(r[key]) || 0) + 1); return m; };
  chips($('kinds'), Object.keys(KINDS), k => KINDS[k], count('kind', 'k'), state.kinds, 'kind');
  chips($('groups'), GROUPS.map((_, i) => i), i => GROUPS[i], count('group', 'g'), state.groups, 'group');
  const out = ROWS.filter(r => match(r)).sort(SORTS[state.sort]);
  $('found').textContent = out.length === ROWS.length ? ROWS.length + ' позиций' : out.length + ' из ' + ROWS.length;
  $('list').innerHTML = out.length ? out.map(item).join('')
    : '<li class="empty"><b>Ничего не нашлось.</b> Уберите часть условий или сбросьте отбор.</li>';
  $('reset').hidden = !(state.q || state.full || state.kinds.size || state.groups.size);
  $('q').value = state.q; $('full').setAttribute('aria-pressed', state.full);
  $('sort').innerHTML = Object.entries(SORT_NAMES).map(([k, n]) =>
    '<button class="chip" type="button" data-sort="' + k + '" aria-pressed="' + (state.sort === k) + '">' + n + '</button>').join('');
  writeHash();
}

let timer;
$('q').addEventListener('input', e => { state.q = e.target.value.trim(); clearTimeout(timer); timer = setTimeout(render, 120); });
$('full').addEventListener('click', () => { state.full = !state.full; render(); });
$('reset').addEventListener('click', () => { Object.assign(state, { q: '', full: false }); state.kinds.clear(); state.groups.clear(); render(); });
document.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip && chip.id === 'full') return;
  if (chip && chip.dataset.sort) { state.sort = chip.dataset.sort; return render(); }
  if (chip) {
    const set = chip.dataset.kind ? state.kinds : state.groups, key = chip.dataset.kind || +chip.dataset.group;
    set.has(key) ? set.delete(key) : set.add(key);
    return render();
  }
  const more = e.target.closest('.more');
  if (more) {
    const open = more.previousElementSibling.classList.toggle('clamp') === false;
    more.textContent = open ? 'свернуть' : 'развернуть';
    more.setAttribute('aria-expanded', open);
  }
});
addEventListener('hashchange', () => { readHash(); render(); });
readHash(); render();
</script>
</body>
</html>
