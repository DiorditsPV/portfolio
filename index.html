<style>
/* ─────────────────────────── tokens ───────────────────────────
   Шесть наборов оформления. Каждый живёт в двух темах и задаёт
   не только цвета, но и --glow — световой слой под содержимым (#bg).
   Переключатель в шапке; выбор хранится в localStorage.
   Набор ставится атрибутом data-design на <html>, тема — классом .dark
   ──────────────────────────────────────────────────────────────── */
:root{
  --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --maxw:72rem;
  /* запасные значения на случай, если набор не проставился —
     повторяют основной набор (Два света, светлая тема) */
  --bg:#f6f3f1; --fg:#1e1b20; --muted:#6c6570; --border:#ded7dd;
  --card:#ffffff; --card-hover:#fbf9fa; --accent:#2b2630; --accent-fg:#f7f4f1;
  --glow:none;
}

/* ── 31 · Холодная засветка ── */
html[data-design="cold-leak"]{
  --bg:#eef3f9; --fg:#0f1a26; --muted:#56697e; --border:#cdd9e6;
  --card:#ffffff; --card-hover:#f7fafd; --accent:#1b6fd0; --accent-fg:#ffffff;
  /* на светлом фоне белое ядро не читается — берём насыщенный тон,
     он даёт разницу по цвету, а не по светлоте */
  --glow:radial-gradient(112% 104% at 106% -6%,
           rgba(96,164,255,.92) 0%, rgba(140,193,255,.62) 26%,
           rgba(186,218,255,.34) 50%, rgba(214,234,255,.12) 70%, transparent 86%),
         radial-gradient(76% 66% at 86% 14%,rgba(70,138,232,.3),transparent 74%);
}
html[data-design="cold-leak"].dark{
  --bg:#0a0d11; --fg:#e6edf5; --muted:#94a6bb; --border:#2c3644;
  --card:#12171e; --card-hover:#171d25; --accent:#ffffff; --accent-fg:#0a1017;
  --glow:radial-gradient(110% 100% at 108% -6%,
           rgba(196,228,255,.78) 0%, rgba(130,186,255,.38) 30%,
           rgba(70,120,205,.16) 56%, rgba(40,70,140,.06) 70%, transparent 84%),
         radial-gradient(74% 64% at 86% 16%,rgba(120,175,255,.28),transparent 76%);
}

/* ── 32 · Два источника ── */
html[data-design="two-sources"]{
  --bg:#f6f3f1; --fg:#1e1b20; --muted:#6c6570; --border:#ded7dd;
  --card:#ffffff; --card-hover:#fbf9fa; --accent:#2b2630; --accent-fg:#f7f4f1;
  /* тона взяты насыщеннее фона: на светлом читается цвет, а не яркость */
  --glow:radial-gradient(100% 92% at 104% -6%,
           rgba(255,170,98,.9) 0%, rgba(255,199,150,.6) 30%,
           rgba(255,222,192,.26) 54%, transparent 76%),
         radial-gradient(104% 96% at -6% 106%,
           rgba(96,158,255,.85) 0%, rgba(150,196,255,.54) 32%,
           rgba(198,224,255,.22) 56%, transparent 78%);
}
html[data-design="two-sources"].dark{
  --bg:#101015; --fg:#eee9e6; --muted:#aaa2a8; --border:#39343c;
  --card:#18171d; --card-hover:#1e1c23; --accent:#f2ece8; --accent-fg:#16151a;
  --glow:radial-gradient(98% 88% at 106% -6%,
           rgba(255,176,110,.66) 0%, rgba(228,124,66,.3) 34%,
           rgba(150,80,45,.1) 56%, transparent 76%),
         radial-gradient(102% 92% at -8% 106%,
           rgba(104,176,255,.54) 0%, rgba(60,124,220,.24) 36%,
           rgba(35,70,150,.08) 58%, transparent 78%);
}

/* ── 52 · Восход за дымкой ── */
html[data-design="dawn-fog"]{
  --bg:#ecefef; --fg:#2a2b28; --muted:#6e6a61; --border:#d5d1c6;
  --card:#fbf9f5; --card-hover:#fffefb; --accent:#b4611f; --accent-fg:#ffffff;
  /* сверху холодная тень, снизу насыщенный восход — вместе дают
     тот же перепад, что в тёмной теме */
  --glow:radial-gradient(92% 54% at 50% 106%,
           rgba(255,164,88,.72) 0%, rgba(255,198,146,.44) 34%,
           rgba(255,222,192,.18) 58%, transparent 78%),
         linear-gradient(180deg,rgba(108,132,158,.2) 0%,rgba(150,170,190,.07) 26%,
           transparent 44%,rgba(255,255,255,.5) 64%,transparent 84%);
}
html[data-design="dawn-fog"].dark{
  --bg:#2f3740; --fg:#f6f1e8; --muted:#b9b2a6; --border:#4a4a46;
  --card:#373f49; --card-hover:#3f4852; --accent:#ffc98f; --accent-fg:#241503;
  --glow:radial-gradient(84% 48% at 50% 104%,rgba(255,198,138,.42),transparent 66%),
         linear-gradient(180deg,transparent 40%,rgba(255,252,246,.22) 60%,transparent 78%);
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;color-scheme:light}
html.dark{color-scheme:dark}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-sans);
  font-size:16px;letter-spacing:-.01em;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  transition:background-color .4s ease,color .4s ease;
}
/* Световой слой набора живёт только на первом экране: он привязан к верху
   страницы, снизу растворяется маской, а при прокрутке гаснет — дальше
   работает ровная заливка --bg. Кликам не мешает. */
#bg{
  position:absolute; top:0; left:0; right:0; height:100vh; z-index:0;
  pointer-events:none; background:var(--glow);
  -webkit-mask-image:linear-gradient(180deg,#000 58%,transparent 100%);
          mask-image:linear-gradient(180deg,#000 58%,transparent 100%);
  transition:background .45s ease;
  will-change:opacity;
}
@media(prefers-reduced-motion:reduce){ #bg{transition:none} }
header,main,footer{position:relative;z-index:1}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:var(--accent);color:var(--accent-fg)}

.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 1rem}
@media(min-width:640px){.wrap{padding:0 1.5rem}}
@media(min-width:1024px){.wrap{padding:0 2rem}}

.mono{font-family:var(--font-mono)}
.muted{color:var(--muted)}
.eyebrow{
  font-family:var(--font-mono);font-size:.6875rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);
}

/* ─────────────────────────── header ─────────────────────────── */
header{
  position:sticky;top:0;z-index:100;padding:1.25rem 0;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid transparent;transition:border-color .3s ease;
}
header.scrolled{border-bottom-color:var(--border)}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:1rem}
nav{
  display:flex;align-items:center;gap:.75rem;
  /* Узкий экран: одна строка с горизонтальной прокруткой вместо переноса под кнопки. */
  overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
}
nav::-webkit-scrollbar{display:none}
/* Затухание у правого края: обрезанный пункт читается как «есть ещё», а не как брак вёрстки. */
@media(max-width:639px){
  nav{-webkit-mask-image:linear-gradient(to right,#000 82%,transparent);mask-image:linear-gradient(to right,#000 82%,transparent)}
}
nav a{white-space:nowrap}
@media(min-width:640px){nav{gap:1.5rem}}
nav a{
  font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
  position:relative;padding:.25rem 0;transition:color .2s ease;
}
nav a::after{
  content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--fg);
  transition:width .25s ease;
}
nav a:hover{color:var(--fg)}
nav a:hover::after{width:100%}
.nav-tools{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.tool-btn{
  font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--border);border-radius:999px;padding:.35rem .7rem;
  transition:color .2s ease,border-color .2s ease,background-color .2s ease;
  font-family:var(--font-mono);white-space:nowrap;
}
.tool-btn:hover{color:var(--fg);border-color:var(--fg)}
.lang-btn b{color:var(--fg);font-weight:600}
.design-btn{display:inline-flex;align-items:center;gap:.45rem}
.design-btn i{width:6px;height:6px;border-radius:999px;background:var(--accent);flex:none}

/* ─────────────────────────── hero ─────────────────────────── */
#hero{
  min-height:85vh;display:flex;flex-direction:column;justify-content:center;
  padding-top:3rem;padding-bottom:3rem;position:relative;
}
@media(min-width:640px){#hero{min-height:92vh}}
#hero h1{
  font-size:clamp(2.5rem,11vw,8rem);font-weight:700;letter-spacing:-.03em;line-height:.9;
  margin:.75rem 0 1.25rem;cursor:default;
}
#hero h1 span{display:inline-block;transition:transform .3s cubic-bezier(.2,.8,.3,1),color .3s ease}
#hero h1 span:hover{transform:translateY(-.08em);color:var(--accent)}
.typeline{
  font-size:clamp(1rem,3.2vw,1.75rem);color:var(--muted);font-weight:500;
  min-height:1.8em;letter-spacing:-.02em;
}
.caret{display:inline-block;width:.06em;height:1em;background:var(--accent);
  vertical-align:-.12em;margin-left:.08em;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.badges{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.75rem 0 2.25rem}
.badge{
  display:inline-flex;align-items:center;gap:.45rem;
  border:1px solid var(--border);border-radius:999px;padding:.4rem .85rem;
  font-size:.75rem;letter-spacing:.02em;color:var(--muted);background:var(--card);
  transition:border-color .25s ease,color .25s ease,transform .25s ease;
}
.badge:hover{border-color:var(--accent);color:var(--fg);transform:translateY(-2px)}
.badge i{width:5px;height:5px;border-radius:999px;background:var(--accent);flex:none}
.cta-row{display:flex;flex-wrap:wrap;gap:.75rem}
.btn{
  display:inline-flex;align-items:center;gap:.5rem;border-radius:999px;
  padding:.7rem 1.4rem;font-size:.875rem;font-weight:600;
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);
  transition:transform .2s ease,opacity .2s ease;
}
.btn:hover{transform:translateY(-2px);opacity:.9}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--border)}
.btn.ghost:hover{border-color:var(--fg)}
.scroll-hint{
  position:absolute;bottom:1.5rem;left:1rem;font-family:var(--font-mono);
  font-size:.625rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  animation:float 2.4s ease-in-out infinite;
}
@media(min-width:640px){.scroll-hint{left:1.5rem}}
@media(min-width:1024px){.scroll-hint{left:2rem}}
@keyframes float{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(5px);opacity:1}}

/* ─────────────────────────── sections ─────────────────────────── */
section{scroll-margin-top:5rem}
.sec-head{display:flex;align-items:baseline;gap:1rem;margin-bottom:2.5rem}
.sec-head h2{font-size:clamp(1.75rem,4vw,2.25rem);font-weight:700;letter-spacing:-.02em;margin:0}
.sec-head .rule{flex:1;height:1px;background:var(--border)}
.sec-head .idx{font-family:var(--font-mono);font-size:.75rem;color:var(--muted)}

#focus{padding:2.5rem 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.focus-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.5rem 1rem}
@media(min-width:900px){.focus-grid{grid-template-columns:repeat(5,1fr)}}
.focus-item h3{font-size:.9375rem;font-weight:600;margin:0 0 .35rem;line-height:1.3}
.focus-item p{margin:0;font-size:.8125rem;color:var(--muted);line-height:1.5}
.focus-item{position:relative;padding-left:.85rem}
.focus-item::before{
  content:"";position:absolute;left:0;top:.35em;width:3px;height:1.1em;border-radius:2px;
  background:var(--accent);opacity:.65;
}

#experience,#projects{padding:3.5rem 0 5rem}
.exp-row{
  display:block;padding:1.5rem 0;border-top:1px solid var(--border);
  transition:padding-left .3s cubic-bezier(.2,.8,.3,1);
}
.exp-row:hover{padding-left:.75rem}
.exp-top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.5rem}
.exp-top h3{font-size:1.0625rem;font-weight:700;margin:0;letter-spacing:-.015em}
.exp-date{font-family:var(--font-mono);font-size:.75rem;color:var(--muted);white-space:nowrap}
.exp-org{font-size:.9375rem;color:var(--accent);margin:.3rem 0 .6rem;font-weight:500}
.exp-desc{margin:0 0 .9rem;color:var(--muted);font-size:.9375rem;max-width:60ch}
.tags{display:flex;flex-wrap:wrap;gap:.4rem}
.tag{
  font-family:var(--font-mono);font-size:.6875rem;letter-spacing:.01em;
  border:1px solid var(--border);border-radius:.375rem;padding:.2rem .5rem;color:var(--muted);
  transition:border-color .2s ease,color .2s ease;
}
.exp-row:hover .tag,.proj-card:hover .tag{border-color:color-mix(in srgb,var(--accent) 45%,var(--border));color:var(--fg)}
.tag.more{color:var(--accent);border-style:dashed}

.proj-grid{display:grid;grid-template-columns:1fr;gap:1rem}
@media(min-width:768px){.proj-grid{grid-template-columns:repeat(2,1fr)}
  .proj-card.feature{grid-column:span 2}}
.proj-card{
  display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);
  border-radius:.75rem;padding:1.4rem;transition:border-color .3s ease,background-color .3s ease,transform .3s ease;
}
.proj-card:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--border));background:var(--card-hover);transform:translateY(-3px)}
.proj-card h3{font-size:1.0625rem;font-weight:600;margin:0 0 .1rem;letter-spacing:-.015em}
.proj-card.feature h3{font-size:1.25rem}
.proj-card .sub{font-size:.8125rem;color:var(--accent);margin:0 0 .7rem}
.proj-card p.body{margin:0 0 1rem;color:var(--muted);font-size:.875rem;flex:1}
.proj-links{display:flex;gap:1rem;margin-top:1rem;padding-top:.9rem;border-top:1px solid var(--border)}
.proj-links a,.proj-links span{
  font-family:var(--font-mono);font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);display:inline-flex;align-items:center;gap:.35rem;transition:color .2s ease;
}
.proj-links a:hover{color:var(--accent)}
.proj-links span{opacity:.55}
/* Карточка со снимком: на широком экране снимок слева, текст справа. */
.proj-body{display:flex;flex-direction:column;flex:1;min-width:0}
.proj-card.has-viz{gap:1.3rem}
/* Снимок продукта: два файла под тему, подменяются в syncThemeLabel(). */
.proj-viz{
  width:100%;height:auto;display:block;align-self:center;border:1px solid var(--border);
  border-radius:.5rem;background:var(--card-hover);transition:border-color .3s ease;
}
.proj-card:hover .proj-viz{border-color:color-mix(in srgb,var(--accent) 30%,var(--border))}
@media(min-width:768px){.proj-card.has-viz{flex-direction:row;align-items:center}
  .proj-viz{width:48%;flex:0 0 48%}}


#opensource{padding:3.5rem 0 5rem}
.repo-grid{display:grid;grid-template-columns:1fr;gap:.75rem}
@media(min-width:700px){.repo-grid{grid-template-columns:repeat(2,1fr)}}
.repo{
  display:flex;align-items:center;gap:.9rem;border:1px solid var(--border);border-radius:.625rem;
  padding:.95rem 1.1rem;background:var(--card);transition:border-color .25s ease,transform .25s ease,background-color .25s ease;
}
.repo:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--border));background:var(--card-hover);transform:translateX(3px)}
.repo svg{flex:none;opacity:.7}
.repo .rname{font-family:var(--font-mono);font-size:.8125rem;font-weight:500}
.repo .rdesc{font-size:.75rem;color:var(--muted);margin-top:.15rem}
.repo .arrow{margin-left:auto;color:var(--muted);transition:transform .25s ease,color .25s ease}
.repo:hover .arrow{transform:translateX(3px);color:var(--accent)}

#contact{padding:4rem 0;text-align:center;display:flex;flex-direction:column;align-items:center}
#contact h2{font-size:clamp(1.75rem,4vw,2.25rem);font-weight:700;letter-spacing:-.02em;margin:0 0 .9rem}
#contact p.lead{color:var(--muted);max-width:46ch;margin:0 auto 2rem}
.mail{
  font-size:clamp(1.1rem,4vw,2rem);font-weight:600;letter-spacing:-.02em;
  border-bottom:1px solid var(--border);padding-bottom:.15rem;transition:border-color .25s ease,color .25s ease;
  word-break:break-all;
}
.mail:hover{color:var(--accent);border-color:var(--accent)}
.socials{display:flex;gap:1.5rem;margin-top:2rem;flex-wrap:wrap;justify-content:center}
.socials a{
  font-family:var(--font-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);transition:color .2s ease;
}
.socials a:hover{color:var(--fg)}

footer{border-top:1px solid var(--border);padding:2rem 0;margin-top:1rem}
.foot-row{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:space-between;
  font-family:var(--font-mono);font-size:.6875rem;color:var(--muted);letter-spacing:.03em}

/* ─────────────────────────── reveal ─────────────────────────── */
.reveal{opacity:0;transform:translateY(18px)}
.reveal.in{opacity:1;transform:none;transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.3,1)}
@media(prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none}
  .caret{animation:none}
  .scroll-hint{animation:none}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<div id="bg" aria-hidden="true"></div>

<header id="site-header">
  <div class="wrap nav-row">
    <nav id="nav"></nav>
    <div class="nav-tools">
      <button class="tool-btn design-btn" id="design-toggle" type="button"></button>
      <button class="tool-btn lang-btn" id="lang-toggle" type="button"></button>
      <button class="tool-btn" id="theme-toggle" type="button"></button>
    </div>
  </div>
</header>

<main>
  <section id="hero" class="wrap">
    <p class="eyebrow" data-k="hero.eyebrow"></p>
    <h1 id="hero-name"></h1>
    <p class="typeline"><span id="type"></span><span class="caret"></span></p>
    <div class="badges" id="badges"></div>
    <div class="cta-row">
      <a class="btn" href="#contact" data-k="hero.cta1"></a>
      <a class="btn ghost" id="resume-link" href="resume-en.pdf" download data-k="hero.cta2"></a>
    </div>
    <span class="scroll-hint" data-k="hero.scroll"></span>
  </section>

  <section id="focus">
    <div class="wrap focus-grid reveal" id="focus-grid"></div>
  </section>

  <section id="experience" class="wrap">
    <div class="sec-head reveal">
      <h2 data-k="sec.experience"></h2><span class="rule"></span><span class="idx">01</span>
    </div>
    <div id="exp-list"></div>
  </section>

  <section id="projects" class="wrap">
    <div class="sec-head reveal">
      <h2 data-k="sec.projects"></h2><span class="rule"></span><span class="idx">02</span>
    </div>
    <div class="proj-grid" id="proj-grid"></div>
  </section>

  <section id="opensource" class="wrap">
    <div class="sec-head reveal">

/* Снимок страницы книги на боевом lexis, снят в обеих темах в одном кадре.
   Пара файлов <img>-light.webp / <img>-dark.webp, подмена — в syncThemeLabel(). */
const VIZ = {
  lexis: { img:"lexis",
           alt:{en:"A lexis book page: Project Hail Mary against the Oxford 3000 and 5000 on an Euler diagram",
                ru:"Страница книги в lexis: «Project Hail Mary» на Эйлеровой диаграмме против Oxford 3000 и 5000"} },

  const v = VIZ[k];

           src="${v.img}-light.webp" data-light="${v.img}-light.webp" data-dark="${v.img}-dark.webp"
           alt="${esc(L(v.alt))}">`;
};

function tagsHtml(tags, max = 4) {
  const shown = tags.slice(0, max).map(t => `<span class="tag">${esc(t)}</span>`).join('');
  const rest  = tags.length - max;
  return `<div class="tags">${shown}${rest > 0 ? `<span class="tag more">+${rest}</span>` : ''}</div>`;
}

/* ── оформление ──
   Шесть наборов, кнопка перебирает их по кругу. Тема (светлая/тёмная)
   переключается отдельно и работает для каждого набора. */
// Первый в списке — основной: он же ставится посетителю, который ничего не выбирал.
const DESIGNS = [
  { id:'two-sources', ru:'Два света',  en:'Two sources' },
  { id:'cold-leak',   ru:'Засветка',   en:'Cold leak' },
  { id:'dawn-fog',    ru:'Рассвет',    en:'Dawn fog' },
];

function currentDesignIndex() {
  const saved = localStorage.getItem('design');
  const i = DESIGNS.findIndex(d => d.id === saved);
  return i === -1 ? 0 : i;
}

function applyDesign(i) {
  const d = DESIGNS[(i + DESIGNS.length) % DESIGNS.length];
  document.documentElement.dataset.design = d.id;
  localStorage.setItem('design', d.id);
  syncDesignLabel();
}

function syncDesignLabel() {
  const d = DESIGNS[currentDesignIndex()];
  const n = currentDesignIndex() + 1;
  $('#design-toggle').innerHTML =
    `<i></i>${n}/${DESIGNS.length} · ${esc(d[lang] ?? d.en)}`;
}

$('#design-toggle').addEventListener('click', () => applyDesign(currentDesignIndex() + 1));

// набор из прошлого визита ставим до первой отрисовки, чтобы не мигало
document.documentElement.dataset.design = DESIGNS[currentDesignIndex()].id;

/* ── тема ── */
function syncThemeLabel() {
  const dark = document.documentElement.classList.contains('dark');
  // Снимки продукта существуют в обеих темах: тёмный кадр на светлой странице читается как поломка.
  $$('.proj-viz[data-light]').forEach(img => {
    const src = dark ? img.dataset.dark : img.dataset.light;
    if (img.getAttribute('src') !== src) img.setAttribute('src', src);
  });
  $('#theme-toggle').textContent = lang === 'ru'
    ? (dark ? 'Светлая' : 'Тёмная')
    : (dark ? 'Light' : 'Dark');
}
$('#theme-toggle').addEventListener('click', () => {
  const dark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('theme', dark ? 'dark' : 'light');
  syncThemeLabel();
});
(function initTheme() {
  // По умолчанию светлая тема — системную настройку не учитываем.
  // Выбор посетителя запоминается и имеет приоритет.
  document.documentElement.classList.toggle('dark', localStorage.getItem('theme') === 'dark');
})();

/* ── язык ── */
$('#lang-toggle').addEventListener('click', () => {
  lang = lang === 'ru' ? 'en' : 'ru';
  localStorage.setItem('lang', lang);
  render();
});

/* ── печатающая строка ── */
let typeTimer = null;
function restartTypewriter() {
  clearTimeout(typeTimer);
  const el = $('#type');
  const phrases = T.typewriter[lang];
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    el.textContent = phrases[0];
    return;
  }
  let i = 0, pos = 0, erasing = false;
  const step = () => {
    const word = phrases[i];
    pos += erasing ? -1 : 1;
    el.textContent = word.slice(0, pos);
    let delay = erasing ? 32 : 62;
    if (!erasing && pos === word.length) { erasing = true; delay = 1600; }
    else if (erasing && pos === 0) { erasing = false; i = (i + 1) % phrases.length; delay = 320; }
    typeTimer = setTimeout(step, delay);
  };
  el.textContent = '';
  typeTimer = setTimeout(step, 420);
}

/* ── появление секций при скролле ── */
let io = null;
function observeReveals() {
  if (io) io.disconnect();
  io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { rootMargin: '0px 0px -8% 0px', threshold: .08 });
  $$('.reveal').forEach((el, n) => {
    el.style.transitionDelay = `${Math.min(n % 6, 5) * 55}ms`;
    io.observe(el);
  });
}

/* ── рамка у липкой шапки после скролла ── */
const header = $('#site-header');
const bgLayer = $('#bg');
const onScroll = () => {
  header.classList.toggle('scrolled', window.scrollY > 12);
  // свет гаснет по мере ухода первого экрана — дальше остаётся ровная заливка
  const hero = $('#hero');
  const span = (hero ? hero.offsetHeight : window.innerHeight) * 0.72;
  bgLayer.style.opacity = String(Math.max(0, 1 - window.scrollY / span));
};
window.addEventListener('scroll', onScroll, { passive: true });
onScroll();

render();
</script>
</body>
