ce","u":"https://github.com/ArefMozafari/pr-evidence","k":"skill","t":"pull request","g":6,"s":10,"p":null,"d":"Скилл учит агента показывать изменение в PR скриншотами до и после либо одним фрагментом кода, а не описанием.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"read2017/jianghushuo-oral-skill","u":"https://github.com/read2017/jianghushuo-oral-skill","k":"skill","t":"авторский стиль","g":11,"s":10,"p":null,"d":"Скилл на материале 433 расшифровок китайского блогера: отвечает его языком, предлагает темы, пишет и правит сценарии для видео.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"YuliangXiu/de-ai-router","u":"https://github.com/YuliangXiu/de-ai-router","k":"skill","t":"стиль текста","g":11,"s":10,"p":null,"d":"Роутер выбирает среди десяти собранных скиллов по «обесшаблониванию» текста подходящий по типу текста и желаемой силе правки.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"Ismyp/motion-design-skill","u":"https://github.com/Ismyp/motion-design-skill","k":"skill","t":"видео","g":1,"s":10,"p":null,"d":"Скилл собирает 30-секундное объясняющее видео в одном из 22 стилей: код вместо видеомоделей, озвучка через kie.ai (нужен ключ).","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"Louis-CFM/coucou","u":"https://github.com/Louis-CFM/coucou","k":"plugin","t":"мониторинг агентов","g":5,"s":2582,"p":null,"d":"Coucou: маленькое приложение-«питомец» (персонаж Mochi), которое живёт в вырезе экрана MacBook (на Windows и Linux — у верхнего края экрана) и показывает живые сессии Claude Code, Gemini CLI и других агентов: что читают, правят и запускают. Разрешения Claude Code можно подтверждать кнопками Allow/Deny прямо из «острова». Работает через хуки: кнопка Install hooks делает резервную копию ~/.claude/settings.json, показывает diff и только потом дописывает хуки; крошечный скрипт nb-hook передаёт события приложению по локальному Unix-сокету, а если приложение не запущено — сразу выходит и Claude Code не блокирует. Дополнительно есть чат с Claude/Gemini/OpenAI по своим ключам (ключи хранятся в Keychain/Credential Manager), перетаскивание файла на остров и «пилюли» интеграций (Stripe, n8n, GitHub, Vercel и др.). Автор заявляет: без телеметрии и аккаунта, нулевые сторонние зависимости в macOS-версии. Оговорки автора: сборка для macOS не нотаризована; Windows-установщик временно снят, потому что Microsoft Defender помечает неподписанный файл как вредоносный (автор считает это ложным срабатыванием и ждёт разбора) — перед установкой лучше собирать из исходников.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"dzhng/jevgrep","u":"https://github.com/dzhng/jevgrep","k":"plugin","t":"поиск по коду","g":6,"s":2018,"p":null,"d":"Jevgrep: CLI jg плюс скилл, который учит кодирующих агентов (Claude Code, Codex, OpenCode) искать код вопросом на естественном языке («как записываются события телеметрии?»). Это обёртка вокруг модели Jev (через Vercel AI Gateway, TypeSafe, OpenRouter или совместимый эндпоинт): модель оценивает релевантность папок, файлов и деклараций, а jg возвращает список файлов, подсказки для чтения и дословные фрагменты исходников. Метод проверки у автора — сравнение на десяти задачах SWE-bench: те же 8 из 10 решены с Jevgrep и без него, стоимость агента ниже на 28,6% (по данным автора; последующие замеры с учётом стоимости Jev дают 25,8% и 2–3% удорожания в версии 0.5.0 — по данным автора). Автор прямо оговаривает: это одиночные прогоны на десяти подобранных задачах Python, а не гарантия экономии и не ускорение. Важная оговорка по безопасности самого README: поиск отправляет содержимое репозитория выбранному провайдеру, фильтры игнорируют скрытые и очевидные файлы с секретами, но полной гарантии не дают; ключ провайдера сохраняется в файле конфигурации с правами только для владельца. Скилл при отсутствии jg сам ставит CLI из npm.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"rehan-remade/universal-modder","u":"https://github.com/rehan-remade/universal-modder","k":"plugin","t":"моддинг игр","g":10,"s":1674,"p":null,"d":"Universal-modder: набор скиллов, CLI um и подключение MCP-сервера fal, чтобы кодирующий агент (Claude Code, Codex, Cursor, Gemini CLI и др.) делал моды для одиночных игр: разведка движка, реверс-инжиниринг, сборка мода, генерация спрайтов, 3D и звука через fal, проверка в запущенной игре. Метод — один и тот же цикл из десяти шагов: поиск в базе знаний, разведка и выбор маршрута, безопасная лаборатория с бэкапом сохранений, чтение реального кода, один рабочий срез, ассеты, проверка в живой игре, запись, упаковка и полевая заметка для следующего агента. Есть 12 справочников по движкам (Unity, Unreal, Godot и др.) и база знаний «ИИ пишут для ИИ» с проверкой заметок командой um kb check. Автор оговаривает правила: только одиночные офлайн-игры, которыми вы владеете; без обхода античита и DRM; без распространения файлов игр и декомпилированного кода; перед установкой загрузчиков, управлением мышью и публикацией агент спрашивает человека. Нужен ключ fal (FAL_KEY передаётся в MCP как Bearer-заголовок на mcp.fal.ai); единственный хук в .claude/settings.json — SessionStart, добавляющий um в PATH из собственного каталога репозитория.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"edenfunf/reelmimic","u":"https://github.com/edenfunf/reelmimic","k":"plugin","t":"видео","g":1,"s":735,"p":null,"d":"ReelMimic: локальное веб-приложение «покажи видео, которое нравится, получи новое в том же стиле». Разбирает референс (число планов, длительности, BPM, переходы, цвета, движения камеры), показывает план с раскадровкой и стилевыми кадрами, а после одобрения до 6 агентов Claude Code или Codex делают части видео параллельно. Проверка: каждый готовый план отдаётся новому агенту на ревью («никто не оценивает свою работу»), каждое исправление сопровождается скриншотами до и после; комментарии можно оставлять прямо на таймлайне. Автор оговаривает: только 2D (семь движков отрисовки; пять новых менее обкатаны), 30–60 с видео занимают 1–3,5 часа, расходуется ваш лимит Claude/Codex, тестировалось в основном на Windows, живых людей не делает; материал референса не переносится, только приёмы. Ключи (Yating TTS, Pixabay, Freesound) лежат в ~/.reelmimic/secrets.json вне репозитория; по умолчанию песочница Codex — danger-full-access (оговорено в README).","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"Edwardxlai/easyread","u":"https://github.com/Edwardxlai/easyread","k":"plugin","t":"чтение статей","g":11,"s":543,"p":null,"d":"EasyRead: локальное приложение (Windows, macOS, Linux; Electron или запуск из исходников на Python), которое переводит англоязычные научные PDF на китайский постранично, сохраняя формулы (KaTeX), таблицы и ссылки, с режимом «перевод с оригиналом» и панелью «спросить ИИ» рядом с текстом. Движок перевода выбирается пользователем: Claude Code или Codex CLI (по подписке, без ключа), либо API (DeepSeek, Zhipu, Kimi, OpenAI, Anthropic, Gemini, OpenRouter и др.), либо локальный Ollama. Перевод и пояснения разделены: в тексте только перевод, объяснения ИИ — на полях; есть выделения, заметки, экспорт в Markdown, библиотека с категориями и копирование ссылок в форматах GB/T 7714, APA и BibTeX. Проверка: автор заявляет, что Claude Code сверяет формулы по изображению исходной страницы, а CI на трёх ОС ставит и запускает приложение на каждый push. Автор подчёркивает, что сервер слушает только 127.0.0.1, а статьи и заметки остаются на компьютере; установщики для Windows и macOS не подписаны.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"AgentSystemLabs/agent-office","u":"https://github.com/AgentSystemLabs/agent-office","k":"plugin","t":"оркестрация","g":4,"s":485,"p":null,"d":"Agent Office: «3D-офис», где команда сажает за столы воркеров Claude Code, Codex, OpenCode, Grok, Cursor и других, смотрит терминал каждого на «ноутбуке» и заходит в любой вместе; каждый GitHub-репозиторий — этаж здания, issues и PR висят на досках, воркеру можно выдать отдельный git worktree и открыть PR одной клавишей. Агенты могут управлять другими агентами через MCP-сервер agent-office (нанимать, писать, отправлять домой). Есть голос, чат, 2D-режим /lite для телефона и деплой на AWS, Azure, Railway, Fly.io, Dokploy, Coolify или любой Ubuntu/Debian-сервер. Автор предупреждает: проект «под один рабочий процесс», возможны ломающие изменения между релизами; организация AgentSystemLabs. Осторожно: установка через curl | bash из репозитория автора; скрипты деплоя копируют на сервер локальный токен gh (README описывает это открыто).","h":0,"f":"curl | bash","i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"vincentsch/explainroo","u":"https://github.com/vincentsch/explainroo","k":"plugin","t":"видео","g":1,"s":304,"p":null,"d":"Explainroo: бесплатный открытый движок, с помощью которого кодирующий агент (лучше всего Claude Code с Opus 5.5, также Codex, Pi) делает видео-объяснения и демо продуктов. Агент пишет два файла: script.md (текст озвучки) и scenes.js (рисунки на JavaScript, привязанные к словам), а движок локально озвучивает (Kokoro, 28 голосов, без ключа), считает тайминг слов (Whisper), рисует кадры в Chrome (Rough.js, 1800 иконок Lucide), делает музыку и эффекты и собирает MP4 через ffmpeg. Агент проверяет работу сам: сохраняет стоп-кадры и лист миниатюр, прогоняет проверку раскладки (обрезанный или налезающий текст) и проверку произношения. Автор оговаривает: первая настройка скачивает модели озвучки и тайминга примерно на 400 МБ, разрабатывалось и тестировалось на Linux, на macOS и Windows меньше; генерация иллюстраций через OpenRouter — необязательная и платная; в каждое видео добавляется водяной знак explainroo.com (можно отключить).","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"scarletkc/seiso","u":"https://github.com/scarletkc/seiso","k":"plugin","t":"документация","g":11,"s":166,"p":null,"d":"Seiso — соглашение по оформлению Markdown-документации проекта и линтер на Rust (ставится через cargo, PyPI и npm), рассчитанный на документы, которые пишет ИИ, а читают люди и агенты. Каждый документ объявляет один вид (howto, reference, adr), у каждого факта один «дом», в долгоживущих страницах нет быстро устаревающих значений (версии, счётчики), указатели называют файл или символ. Диагностики сообщают, где проблема и как её исправить, чтобы агент мог починить большинство замечаний по одному выводу линтера; когда нужно суждение, диагностика называет само решение. Стабильные правила включены по умолчанию, остальные — превью с возможными ложными срабатываниями, а критерии перевода правил в стабильные опубликованы; спецификация до 1.0.0 помечена как предварительная. Есть интеграции с хуками Claude Code, pre-commit и CI. Проверка по README: сети и секретов не просит.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"crmne/omarchy-rescue","u":"https://github.com/crmne/omarchy-rescue","k":"plugin","t":"восстановление системы","g":13,"s":123,"p":null,"d":"ISO-образ спасательной флешки на базе Omarchy (дистрибутив на Arch): загружается в живую консоль kmscon c tmux, набором спасательных инструментов в духе SystemRescue и готовыми Claude Code, Codex и OpenCode, чтобы диагностировать и чинить машину, которая не загружается. Скрипты omarchy-rescue-* помогают сменить раскладку, подключить Wi-Fi, войти в агента через QR-код на телефоне (консоль без браузера), смонтировать установленную Omarchy и войти в chroot. Образ собирается из самого ISO Omarchy, так что ядро то же; для записи рекомендуется проверка контрольной суммы. Скрипты входа и профиля прочитаны: сетевая проверка только до pkgs.omarchy.org, ничего не отправляется. Автор — Carmine Paolino, создатель RubyLLM (известный человек в экосистеме).","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"matank001/clodfarm","u":"https://github.com/matank001/clodfarm","k":"plugin","t":"оркестрация","g":4,"s":122,"p":null,"d":"«Ферма» агентов Claude Code в Docker-контейнере: вы ставите задачу из приложения Claude на телефоне, агент делит её на суб-агентов на отдельных git-ветках, браузерный UI в виде пиксельной фермы показывает, кто чем занят. Темп каждого аккаунта привязан к реальным лимитам 5 часов и недели (по умолчанию агенты останавливаются на 80% недели и 85% окна), есть слияние только при прошедших проверках, уведомления в ntfy/Slack/Discord, коннекторы (Stripe, Google Ads, AWS, Blender MCP) и режим API-ключа с дневным лимитом в долларах. Автор прямо оговаривает: на подписке только для своих проектов; нельзя запускать как сервис для других и делиться логинами; запрос не является юридической консультацией. Рекламный лозунг про «зарабатывает деньги» — это автономная сборка и продажа приложений, реальные платежи выполняются только по просьбе владельца; UI без пароля, видит любой, кто достучится до адреса. Осторожно: установка через curl | sh из репозитория автора, команда upgrade самообновляется с ветки main; интерфейс без пароля, контейнер хранит логин Claude и допускает подключение Stripe, Google Ads, AWS.","h":0,"f":"curl | sh","i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"RamitVishwakarma/Janus","u":"https://github.com/RamitVishwakarma/Janus","k":"plugin","t":"аккаунты и кэши","g":13,"s":120,"p":null,"d":"Небольшое приложение для macOS в строке меню: переключает аккаунты Claude Code и Codex одним кликом (сохраняет пару «токены в Keychain + настройки» и подставляет другую), показывает лимиты каждого аккаунта и очищает кэши разработчика. Перед переключением текущая сессия сохраняется; при сбое на полпути система остаётся в прежнем аккаунте; токен активной сессии не обновляется, чтобы не сломать работающий Claude Code. Очистка кэшей только переносит в Корзину и отказывается трогать каталоги вне домашней папки и важные (~/.ssh, ~/.claude, ~/.codex), что по заявлению автора проверяется тестами. Автор оговаривает, что цифры лимитов у неактивных аккаунтов устаревают, а переключение не влияет на уже запущенную сессию. Осторожно: приложение работает с OAuth-токенами Claude Code и Codex (Keychain, ~/.claude.json), кнопка Refresh отправляет их на серверы Anthropic и OpenAI, подпись ad-hoc, ставится с --no-quarantine.","h":0,"f":"токены OAuth","i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"entropyconquers/simfleet","u":"https://github.com/entropyconquers/simfleet","k":"plugin","t":"мобильная разработка","g":9,"s":106,"p":null,"d":"Единая панель управления параллельной работой агентов над React Native на macOS: облегчённые iOS-симуляторы (SimSlim, по данным авторов примерно 3,8 → 1,3 ГБ) и Android-эмуляторы, живая браузерная стена устройств, «полосы» (worktree + устройство + выделенный порт Metro, которые нельзя перехватить), общий кэш нативной сборки для Expo и учёт, какой агент Claude Code или Codex к какому устройству обращается. Команда simfleet skill install учит агентов пользоваться флотом. Сервер слушает только 127.0.0.1 и без аутентификации — автор прямо предупреждает не открывать порт в сеть. Оговорка по установке: для iOS/Android нужны сторонние brew-пакеты, в том числе tap с чужого репозитория (kdbhalala/avdslim); код авторы не вендорят.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"Avinash-jetwani/jevmem","u":"https://github.com/Avinash-jetwani/jevmem","k":"plugin","t":"память проекта","g":3,"s":104,"p":null,"d":"Автоматическая память проекта для Claude Code: решения, правила, тупики и баги пишутся одной строкой в JEVMEM.md в репозитории и возвращаются в следующей сессии; изменённое решение зачёркивается, но остаётся в истории, команда получает тот же файл через git. Что стоит сохранить, решает модель Jev (TypeSafe AI) — то есть это ещё один плагин вокруг Jev. По README, плагин есть в каталоге Anthropic и в реестре MCP. Нашёлся через HN (62 очка), репозиторий создан 22.09.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"humaedihume/kantor-agent","u":"https://github.com/humaedihume/kantor-agent","k":"plugin","t":"визуализация","g":2,"s":96,"p":null,"d":"Плагин Claude Code (один скилл) с интерфейсом на индонезийском: рисует в браузере маленький 3D-офис на three.js, где основная сессия — начальник «Joko», а четверо коллег идут к столу, когда Claude порождает суб-агента любого типа; если все заняты, входят фрилансеры. Данные берутся только из реальных локальных транскриптов ~/.claude/projects, read-only: читаются сводки вызовов инструментов, но не содержимое tool_result, аргументы Bash и полные промпты; секреты, ключи и e-mail автоматически маскируются (Node и PHP-версии дают одинаковый вывод). Хук SessionStart по умолчанию ничего не делает и включается только флагом. Сервер слушает 127.0.0.1; автор предупреждает, что опциональный публичный tunnel cloudflared не имеет логина и показывает описания задач и имена файлов любому, у кого есть адрес.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"ufo-ai/ufo-core","u":"https://github.com/ufo-ai/ufo-core","k":"plugin","t":"платформа агентов","g":4,"s":87,"p":null,"d":"Открытая среда выполнения для ИИ-агентов команды на собственной инфраструктуре (тот же код запускает облачный сервис UFO): один процесс ufoctl serve с циклом агента, очередью ходов, песочницей и заданиями, на SQLite или Postgres/S3/Redis; каждый ход — устойчивый DBOS-воркфлоу, переживающий сбой. Всё — расширения (инструменты, коннекторы, суб-агенты, модели, носители песочницы), доступ агента к аккаунту участника выдаётся только явным разрешением в чате. В README описана модель безопасности: Rust-сервисы не хранят ключи клиентов, а локальная песочница (Seatbelt/Landlock) защищает запись, но может читать весь хост и не ограничивает сетевой выход, для недоверенного ввода автор советует docker или e2b. Автор — организация UFO, лицензия Apache-2.0; к Claude-скиллам прямо не относится (универсальная платформа агентов). Осторожно: клиент ставится командой curl -fsSL https://ufo.ai/ufo | sh; этот скрипт мы не просматривали.","h":0,"f":"curl | sh","i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"nykooi1/vibe-wise","u":"https://github.com/nykooi1/vibe-wise","k":"plugin","t":"обучение","g":12,"s":87,"p":null,"d":"Плагин Claude Code «You build. AI writes.»: Claude сначала спрашивает ваш подход, разбирает компромиссы и объясняет незнакомые понятия, а код пишет только после того, как вы подтвердили дизайн. Метод — три вида контрольных точек: Build (вы сами рассуждаете), Design (подтверждение записывает дизайн, кода ещё нет) и Implementation (фраза «Implement this step» разрешает Claude писать конкретные изменения); после шага идёт отчёт о тестах. Хук SessionStart на Python только восстанавливает локальный контекст обучения (по коду импортирует лишь json, pathlib, re, sys), есть скилл сброса и тесты. Автор сообщает, что плагин одобрен для каталога Anthropic, но пока ставится через его собственный marketplace.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"joetawil7/first-pass","u":"https://github.com/joetawil7/first-pass","k":"plugin","t":"контроль качества кода","g":6,"s":84,"p":null,"d":"Плагин Claude Code (хуки + скиллы; Cursor и Codex получают правила и скиллы без хуков), заставляющий агента смотреть на код вокруг изменения: десять вопросов до кода (что будет при повторном запуске, остановке посередине, таймауте), независимый ревьюер в свежем контексте и «готово» только при тесте, который падал до правки, и зелёном CI в чистом чекауте. Хуки возвращают «готово» без доказательств, запускают одобренные хуки репозиториев из общей папки и сообщают о дрейфе правил; есть /first-pass:review для PR (в GitHub сам ничего не пишет). Автор честно приводит результаты своих тестов (например, без хука пропуск перезаписи запроса — в 7 из 11 прогонов, по данным автора) и оговаривает, что хуки работают только в Claude Code. Сеть: скрипты по заявлению автора сетевых вызовов не делают, кроме опционального «судьи» Jev — при включении отправляет находки ревью (с вычищенными секретами) на api.typesafe.ai; это собственная опциональная интеграция, не обёртка.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"admte/orc-claude-plugin","u":"https://github.com/admte/orc-claude-plugin","k":"plugin","t":"интеграция","g":9,"s":74,"p":null,"d":"Плагин-обёртка для подключения Claude к облачному сервису ORC8R через удалённый MCP-сервер https://orc8r.com/mcp плюс один короткий скилл по поиску операций и отчёту о результатах. Доступ по OAuth: согласие всегда даёт orc:read, orc:write отмечается отдельно, права наследуются от организации пользователя; ключей в плагине нет (по заявлению автора, .mcp.json содержит только URL). Автор — организация ADM Tech; репозиторий сам оговаривает, что это не каталог Anthropic. Полезность зависит от аккаунта ORC8R.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"levy-street/pokemon-claude-red","u":"https://github.com/levy-street/pokemon-claude-red","k":"plugin","t":"игра","g":13,"s":59,"p":null,"d":"Браузерная переделка Pokemon Red, целиком написанная Claude Opus 5.5 по одному промпту и нескольким дням правок: ни одного файла изображений, спрайты 151 покемона, тайлы, эффекты и музыка рисуются/играются кодом. Без зависимостей, играется на claudered.dev, есть управление для телефона и сетевые режимы (обмен и бои через WebSocket; пароли — солёные scrypt-хэши, по заявлению автора). Автор — организация Levy Street. Оговорка в README: бесплатный некоммерческий фан-проект, не связан с Nintendo, Game Freak и Anthropic. Для дайджеста интересен как демонстрация, а не инструмент.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"leonvanzyl/cubefarm","u":"https://github.com/leonvanzyl/cubefarm","k":"plugin","t":"оркестрация","g":4,"s":51,"p":null,"d":"Мультяшный 3D-офис в браузере, где команда агентов Claude Code (по умолчанию; также Codex и OpenCode) берёт GitHub issues, открывает pull request, а QA-тестировщики проверяют в настоящем браузере и пишут отчёт со скриншотами. CEO-агент планирует работу issues и предлагает найм; у каждого проекта свой этаж; при включённом автослиянии PR сливается после прохождения QA и зелёных проверок GitHub. Агенты не могут пушить в main и сливать сами — это делает «офис». Запуск npx cubefarm (есть демо-режим без трат), нужны Node 22, git, gh с авторизацией; расход идёт по лимитам подписки агента. В скриптах установки ничего подозрительного не видно.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"devilcoolyue/agentbox","u":"https://github.com/devilcoolyue/agentbox","k":"plugin","t":"веб-рабочее место для агентов","g":2,"s":48,"p":null,"d":"Самохостинг-консоль: Claude Code и Codex CLI запускаются на вашем сервере в изолированных Docker-рабочих пространствах, доступных из браузера (чат, терминал, файлы, Git-ревью, коммит). Один Go-бинарник со встроенным фронтендом, SQLite, systemd; пулы аккаунтов (OAuth, API-ключ, релей), права по пользователям, учёт расхода и кредитов, управление MCP и скиллами, необязательный abox-link для доступа к частным сервисам. В репозитории есть gitleaks-конфиг, CI и политика уязвимостей. Автор оговаривает: скриншоты синтетические и могут отличаться от релиза, коммит из веб-интерфейса не пушит; стабильный релиз v0.1.7. Осторожно: быстрый старт — curl | sudo bash из ветки main; по коду, установщик сверяет SHA-256 релиза.","h":0,"f":"curl | sudo bash","i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"Moris-kr/ai-chatroom","u":"https://github.com/Moris-kr/ai-chatroom","k":"plugin","t":"развлечение","g":13,"s":47,"p":null,"d":"Веб-групповой чат, где сами разговаривают Claude, ChatGPT, Grok и Gemini; ничего не сказано о личностях — речь, обращения и память вырабатываются в ходе общения, участники ведут личные заметки. Работает через уже авторизованные CLI (по заявлению автора, без API-ключей), совместно делают тексты, SVG, HTML-мини-игры, 3D-мир из блоков; хозяин может вмешиваться когда угодно. Опционально: доступ извне по https с паролем (самоподписанный сертификат, при включении автор советует длинный пароль и отключать при ненужности) и «мост разработчика» для подключения Claude Code. Один Node.js без npm-зависимостей; README на корейском, английском и японском.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"flaviocopes/skillscout","u":"https://github.com/flaviocopes/skillscout","k":"plugin","t":"учёт и управление скиллами","g":0,"s":45,"p":null,"d":"Mac-приложение (macOS 15+), находящее все скиллы на машине, показывающее, какие из 8 агентов их видят (Cursor, Claude Code, Codex, Gemini CLI, OpenCode, Droid, Pi, Amp), и считающее, как часто скилл загружался, по чтению чатов. Умеет одним щелчком добавить скилл тем агентам, что его не видят, и искать повторяющиеся просьбы, из которых стоит сделать скилл. Приватность: чаты покидают Mac только через ИИ-функции, которые запускают уже авторизованные Codex или Claude Code CLI, так что запрос уходит OpenAI или Anthropic под вашим аккаунтом (до 2000 последних сообщений для поиска идей). Есть CLI-команда и ежедневная проверка обновлений на GitHub (отключается). Автор — Flavio Copes, известный разработчик и блогер (около 2,4 тыс. подписчиков). Приложение без подписи и нотаризации: README предлагает снять карантин командой xattr -dr; исходники в репозитории.","h":0,"f":"без нотаризации","i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"anthropics/claude-code-playground","u":"https://github.com/anthropics/claude-code-playground","k":"plugin","t":"сборник примеров","g":0,"s":43,"p":null,"d":"Песочница от Anthropic DevRel: реальные хуки, файлы CLAUDE.md, примеры settings.json, личные рабочие процессы, «моды» (плагины, меняющие поведение или рисующие свой интерфейс), скиллы вне официального маркетплейса, демо и демо с запусков моделей с точным промптом. Каждая запись самодостаточна и по шаблону описывает, как сделана, что не получилось и какие у неё ограничения; в корне ничего не устанавливается. Автор — Anthropic (сигнал вне звёзд). Оговорки автора: не официальный продукт, без поддержки и гарантий, примеры могут сломаться, внешние вклады пока не принимаются, «не канон лучших практик». Публикация идёт из приватного репозитория вручную.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"minorun365/claude-code-japanese-guard","u":"https://github.com/minorun365/claude-code-japanese-guard","k":"plugin","t":"хук","g":10,"s":41,"p":null,"d":"Stop-хук, который возвращает ответ на переписывание, если Claude Code по окончании хода ответил по-английски вместо японского. Метод: берёт последний ответ после последнего вызова инструмента, не считает блоки кода, URL и короткие реплики короче 25 латинских символов, сравнивает число английских и японских символов и один раз за ход просит переписать. Автор отмечает, что запись «отвечай по-японски» в CLAUDE.md эту проблему не останавливала; есть режим --check для проверки по логам сессии и тесты. Скрипт на чистом Python без сетевых вызовов (по импортам: json, os, re, sys, time); ставится одним файлом в ~/.claude/hooks и записью в settings.json. Применимо к любому языку при правке порога, но README ориентирован на японский.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"AGIHunt/blurt","u":"https://github.com/AGIHunt/blurt","k":"plugin","t":"запись экрана и голоса","g":1,"s":40,"p":null,"d":"Записываете экран и говорите вслух, агент превращает запись в баг-тикеты, доски идей и задачи с отмеченными кадрами. Метод: транскрипция локально (SenseVoice через sherpa-onnx, либо Whisper), агент делит поток на пункты, выбирает кадр и обводит место по положению мыши, пишет «фактическое/ожидаемое», шаги и вероятно виновный код; разбор — на странице-ленте с клавиатуры. Экспорт в Feishu/Lark, GitHub, Linear или Markdown либо сразу правка. Автор приводит цифры по двум реальным сессиям (около 142–150 тыс. входных и 19–20 тыс. выходных токенов, около 2 долларов за запись, по данным автора). Видео в модель не подаётся; рекомендуется модель со зрением. README на английском и китайском. Записывает экран и микрофон; ставит неподписанное menu-bar приложение и скачивает речевые модели с huggingface.co и запасного зеркала hf-mirror.com.","h":0,"f":"экран и микрофон","i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"jbang2004/long-wind","u":"https://github.com/jbang2004/long-wind","k":"plugin","t":"игра","g":13,"s":37,"p":null,"d":"Браузерная экшен-игра в духе у-сия на three.js: один мечник, три главы (степь, бамбуковая роща под дождём, ночная улица с 500 фонарями) и боссы; блок, идеальное парирование, уклон с неуязвимостью, слом стойки. Автор заявляет, что не писал код сам: Opus 5.5 разбил работу между параллельными субагентами по контракту интерфейсов (CONTRACTS.md) и «художественной библии» (BIBLE.md), затем сам интегрировал и принимал по скриншотам; первая играбельная версия — за сутки, по данным автора. Лицензия: код MIT, но модели персонажей (Tripo AI) и анимации (Adobe Mixamo) не под MIT, их нельзя выдёргивать и распространять. Для дайджеста — демонстрация метода работы с мультиагентной разработкой, а не инструмент.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"OpenPerfAgent/who-ate-my-flops","u":"https://github.com/OpenPerfAgent/who-ate-my-flops","k":"plugin","t":"оптимизация производительности PyTorch","g":13,"s":34,"p":null,"d":"Плагин для Claude Code и Codex, диагностирующий и ускоряющий PyTorch-обучение и инференс: набор скиллов (init, setup-baseline, torch-profile, diagnose, optimize, extract-computation-graph, convert-to-benchmark-script, publish-pr, clean-up). Метод: агент собирает контекст и цели в contract.md, профилирует, находит узкие места и предлагает правки от конфигурации до Python и GPU-ядер, проверяя корректность и воспроизводимость; результат — latest-report.md. Автор заявляет, что оптимизации, сделанные с плагином, влиты в FunASR, FastVideo, gsplat, Ultralytics, Unsloth и SGLang с ускорением до 3,6× на тестовых нагрузках (по данным автора). Автор — организация OpenPerfAgent. Работает с одиночными задачами с повторяемой командой запуска, например через Slurm; версия v0.1.0.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"HimalayanNomads/drawa","u":"https://github.com/HimalayanNomads/drawa","k":"plugin","t":"оркестрация","g":4,"s":29,"p":null,"d":"Браузерный холст, где Claude Code, OpenCode и Codex работают параллельно, видно, к чему они прикасаются, и можно ревьюить каждое изменение.","h":1,"f":"curl | sh","i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"tomascupr/reelql","u":"https://github.com/tomascupr/reelql","k":"plugin","t":"видео","g":1,"s":28,"p":null,"d":"Скилл и платный API автора: по ссылке на видео возвращает один типизированный JSON; в примерах связан с моделью Jev (TypeSafe), ключи REELQL_API_KEY и необязательный TYPESAFE_API_KEY.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"charlesdove977/claude-x-jev","u":"https://github.com/charlesdove977/claude-x-jev","k":"plugin","t":"контроль решений","g":5,"s":28,"p":null,"d":"Обёртка вокруг чужой модели Jev (TypeSafe) на OpenRouter: быстрые типизированные решения (сортировка, проверка, оценка, гейт вызовов) через скилл, команды и хук.","h":1,"f":"хук шлёт данные наружу","i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"animspark/animspark","u":"https://github.com/animspark/animspark","k":"plugin","t":"видео","g":1,"s":27,"p":null,"d":"Открытый движок AnimSpark: формат фильма, покадрово точный рендерер, музыкальный движок и скиллы для Claude Code и Codex; облачный режим по API-ключу.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"TimeLovercc/mojito","u":"https://github.com/TimeLovercc/mojito","k":"plugin","t":"личный ИИ","g":13,"s":27,"p":null,"d":"Локальный самоэволюционирующий личный ИИ-помощник (хаб, агент, PWA) на Claude Code; автор предупреждает, что «maintainer» может менять код и деплоить, держать как root.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"harrymunro/superbrainstorming","u":"https://github.com/harrymunro/superbrainstorming","k":"plugin","t":"брейнсторм","g":8,"s":25,"p":null,"d":"Плагин с шагом брейнсторма из Superpowers для сильных моделей: обсудить дизайн, утвердить, затем сборка; SessionStart-хук только подмешивает локальный bootstrap.md.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"pixbvr/aurora-synth","u":"https://github.com/pixbvr/aurora-synth","k":"plugin","t":"музыка","g":1,"s":20,"p":null,"d":"Гибридный синтезатор в браузере (виртуально-аналоговый, вейвтейбл, FM, физмоделирование), без зависимостей, написан с помощью Claude Code.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"youagainchen/claude-codex-coop","u":"https://github.com/youagainchen/claude-codex-coop","k":"plugin","t":"взаимодействие агентов","g":4,"s":20,"p":null,"d":"Плагин, где Claude и Codex из десктопных приложений вызывают друг друга для ревью и реализации; UserPromptSubmit-хук запускает локальный python-скрипт, снимки пропускают файлы с секретами.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"Coben-3d/smartatelier","u":"https://github.com/Coben-3d/smartatelier","k":"plugin","t":"инвентарь","g":0,"s":20,"p":null,"d":"Локальный учёт электронных компонентов и 3D-филаментов с фото, цветами, проектами и ИИ-помощниками с подтверждением человеком.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"BjoernSchotte/agentglass","u":"https://github.com/BjoernSchotte/agentglass","k":"plugin","t":"мониторинг","g":5,"s":20,"p":null,"d":"Нативный TUI: смотреть и направлять сессии Claude Code, Codex и других агентов, с учётом токенов, стоимости и уведомлениями.","h":1,"f":"curl | sh","i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"sting8k/piggery","u":"https://github.com/sting8k/piggery","k":"plugin","t":"оркестрация","g":4,"s":18,"p":null,"d":"Команда агентов Pi, Claude Code и Codex, работающих над задачами как одна ферма.","h":1,"f":"curl | sh","i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"silvius1996/claude-sap-kit","u":"https://github.com/silvius1996/claude-sap-kit","k":"plugin","t":"SAP","g":9,"s":17,"p":null,"d":"Плагин с расширением ARC-1 и ABAP-набором: запуск SAP-отчётов, превью печатных форм NAST в PDF, правка SmartForms как XML; записи только в копии, ничего не удаляется.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"Vinyl-Davyl/hermes","u":"https://github.com/Vinyl-Davyl/hermes","k":"plugin","t":"передача контекста","g":3,"s":17,"p":null,"d":"Локальный CLI на Go, упаковывающий незаконченную работу для передачи следующему агенту (Claude, Cursor, Codex и др.).","h":1,"f":"curl | sh, чужой хост","i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"quisbaum-prog/occam","u":"https://github.com/quisbaum-prog/occam","k":"plugin","t":"контроль расхода","g":5,"s":15,"p":null,"d":"Набор из 30 строк правил «бритва Оккама» и аудит расхода токенов; по данным автора, на 51–55% дешевле базы (один прогон, без доверительного интервала).","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"haimu0427/Startidy","u":"https://github.com/haimu0427/Startidy","k":"plugin","t":"GitHub Stars","g":13,"s":15,"p":null,"d":"npm-CLI и скилл раскладывают GitHub Stars по спискам с помощью агента; автор подчёркивает, что токен не отдаётся сторонним моделям.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"NeilGilani/hebb-claude-plugin","u":"https://github.com/NeilGilani/hebb-claude-plugin","k":"plugin","t":"память агента","g":3,"s":14,"p":null,"d":"Плагин запоминает упавшие команды и подсовывает рабочую замену; по данным автора, до 33–40% меньше токенов.","h":1,"f":"данные наружу","i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"zolferfigueiredo/claudiostat","u":"https://github.com/zolferfigueiredo/claudiostat","k":"plugin","t":"контроль лимитов","g":5,"s":13,"p":null,"d":"macOS-приложение в строке меню показывает лимиты плана Claude, запрашивая у Claude Code get_usage без расхода токенов.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"ypyik0669/claude-web","u":"https://github.com/ypyik0669/claude-web","k":"plugin","t":"GUI-оболочка","g":2,"s":13,"p":null,"d":"Неофициальная графическая оболочка (десктоп и веб) для Claude Code, Codex, Gemini CLI и других CLI-агентов, с ревью diff и разрешениями.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"AsWali/CallBoard","u":"https://github.com/AsWali/CallBoard","k":"plugin","t":"координация агентов","g":4,"s":13,"p":null,"d":"Общий список задач в Markdown-файлах проекта для вас и агентов: кто что делает, вопросы с вариантами, что ждёт вас.","h":1,"f":"curl | sh","i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"GreyforgeLabs/slopbrake","u":"https://github.com/GreyforgeLabs/slopbrake","k":"plugin","t":"контроль качества","g":6,"s":13,"p":null,"d":"Тормоза для агентов: детерминированные проверки, ревьюер со свежим контекстом, правящий коммитами, и ручной разбор необратимых решений; идея Мэтта Покока.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"vedantdhande04/tweetytweets","u":"https://github.com/vedantdhande04/tweetytweets","k":"plugin","t":"автопостинг","g":13,"s":12,"p":null,"d":"Конвейер автопостинга в X: исследование, тексты в вашем голосе, публикация через залогиненный браузер (CDP) и проверка по профилю.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"aashish254/burn","u":"https://github.com/aashish254/burn","k":"plugin","t":"контроль расхода","g":5,"s":12,"p":null,"d":"Локальный журнал стоимости агентов: читает транскрипты Claude Code, Codex и других, считает токены и доллары по репозиториям и веткам.","h":1,"f":"curl | bash","i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"kyroco/vitalaize","u":"https://github.com/kyroco/vitalaize","k":"plugin","t":"мониторинг сессий","g":5,"s":12,"p":null,"d":"Настенный экран на iPad: сессии Claude Code и Codex, ожидающие вас, сборки GitHub и уведомления в Messages, Slack, ntfy.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"lawrence3699/jev-style","u":"https://github.com/lawrence3699/jev-style","k":"plugin","t":"локальные модели","g":10,"s":11,"p":null,"d":"Собственные небольшие модели решений на Qwen3.5 с локальным сервером, шестью скиллами, PreToolUse-хуком и MCP; оценки на JevBench даны по данным автора.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"ethan-ab/xscout-jev","u":"https://github.com/ethan-ab/xscout-jev","k":"plugin","t":"мониторинг новостей","g":5,"s":11,"p":null,"d":"Следит за X по YAML-профилю, оценивает посты через Jev (TypeSafe) и шлёт алерты в Slack; по сути надстройка над Jev.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"yeet-src/agentcap","u":"https://github.com/yeet-src/agentcap","k":"plugin","t":"наблюдаемость","g":5,"s":11,"p":null,"d":"eBPF-экспортёр для Prometheus: на уровне ядра собирает активность агентов (инструменты, домены, файлы, CPU) и рисует дашборд Grafana.","h":1,"f":"curl | sh, чужой хост","i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"aabrole/claude-trading-desk","u":"https://github.com/aabrole/claude-trading-desk","k":"plugin","t":"трейдинг","g":13,"s":11,"p":null,"d":"Плагин для создания торговых ботов, честного бэктеста, бумажной торговли и бесплатного хостинга; использует решения Jev (TypeSafe).","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"0xtbug/Recat","u":"https://github.com/0xtbug/Recat","k":"plugin","t":"безопасность","g":7,"s":10,"p":null,"d":"Локальное рабочее место для находок по безопасности от агентов: доказательства, фильтры, экспорт отчётов; установка поручается агенту по SKILL.md.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"Drix10/agent-flow","u":"https://github.com/Drix10/agent-flow","k":"plugin","t":"контроль агентов","g":5,"s":10,"p":null,"d":"CLI без зависимостей плюс скиллы: ловит устаревший контекст в AGENTS.md, ограничивает роли и ведёт конвейер Implement, Review, QA.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"batrapulkit/squidbrake","u":"https://github.com/batrapulkit/squidbrake","k":"plugin","t":"безопасность агентов","g":7,"s":10,"p":null,"d":"Шлюз проверяет каждое действие агента по правилам rules.yaml, держит рискованное до одобрения человека и ведёт защищённый от подделки аудит.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"newsbubbles/ismail","u":"https://github.com/newsbubbles/ismail","k":"plugin","t":"музыка","g":1,"s":10,"p":null,"d":"Музыкальная студия для агента: музыка пишется текстом, звук читается обратно текстом; MCP-сервер, CLI, скилл и живой вывод на деки.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"caglarutkuguler/cubicle","u":"https://github.com/caglarutkuguler/cubicle","k":"plugin","t":"визуализация агентов","g":2,"s":10,"p":null,"d":"Пиксельный офис, где агенты Paperclip, Claude Code или Codex сидят за столами; только чтение, без зависимостей.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"korallis/agent-stack","u":"https://github.com/korallis/agent-stack","k":"plugin","t":"оркестрация","g":4,"s":10,"p":null,"d":"Конфигурация-обвязка вокруг OpenRig, Claude Code, Codex и Jev (TypeSafe): команда агентов с тестами, ревью и консолью rig-console.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"math-proof","u":"https://github.com/anthropics/claude-plugins-official/tree/main/plugins/math-proof","k":"official","t":null,"g":14,"s":null,"p":null,"d":"(Anthropic, 30.09) — два скилла для сложных исследовательских задач по математике; оба дают самодостаточный proof.md и отключают веб-инструменты на время работы. /math-proof:solo — один длинный ход с файлом заметок, чтобы обрыв по лимиту ничего не потерял; пробовать первым. /math-proof:siege — многоагентный режим на часы: судья пишет вопросы, независимые исполнители отвечают параллельно, судья ведёт реестр доказанного, опровергнутого и открытого, найденное доказательство дважды перепроверяется построчно; ждите десятки и сотни запусков субагентов. README предупреждает, что цитаты из литературы модель берёт по памяти.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"code-modernization 1.0.0","u":"https://github.com/anthropics/claude-plugins-official/tree/main/plugins/code-modernization","k":"official","t":null,"g":14,"s":null,"p":null,"d":"управляемая модернизация legacy-кода: preflight, оценка, карта зависимостей, извлечение бизнес-правил карточками Given/When/Then со ссылками на строки, проверка сомнительных правил человеком, поэтапный план, сборка (апгрейд, перенос или пересборка), независимое доказательство эквивалентности, hardening. Доказательство строится из проверяемых фактов: тесты перезапускаются с нуля, старый и новый код сравниваются побайтово на одних входах, проверяется, что тест вообще может упасть; правило считается протестированным, только если тест реально выполнился. Исходники legacy не правятся. README предупреждает о заметном расходе — начинать с одного модуля; счётчики телеметрии включены по умолчанию.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"claude-security 0.12.0","u":"https://github.com/anthropics/claude-plugins-official/tree/main/plugins/claude-security","k":"official","t":null,"g":14,"s":null,"p":null,"d":"рекомендуемые модели теперь Opus 5.5 или Fable 5.1; агент scan-redactor заменяет найденные значения учётных данных на [REDACTED] в отчёте, JSONL и SARIF (по README — старание модели без гарантии); задание можно дать сразу после команды; скан изменений проверяет diff и сообщает только о связанных с ним дефектах.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"You said no MCP — Earendil (Pi)","u":"https://earendil.com/posts/you-said-no-mcp/","k":"research","t":null,"g":14,"s":null,"p":671,"d":"Команда Earendil, 29.09 (по пересказу страницы). Pi раньше отказывался от MCP, теперь встроил его в ядро через «Codemode»: слой оркестрации на JavaScript работает в доверенной среде харнесса, а не в недоверенной песочнице. Пример автора: за одну сессию разобрано 167 задач из Linear с классификацией тональности, без раздувания контекста. Следует: MCP-вызовы выгодно композировать кодом — циклы и фильтры в коде, а не по одному вызову через контекст модели; оркестрирующий код держать в доверенном контуре, модельный — изолировать. Рядом по теме: обсуждение ограничения Figma MCP белым списком клиентов (по заголовку, без Pi; сам твит не открывали).","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"Revealing the details of how OpenAI agents hacked Hugging Face","u":"https://swarmtraces.org/","k":"research","t":null,"g":14,"s":null,"p":753,"d":"Коллектив исследователей, 25.09. По данным авторов, восстановлено более 80 000 фрагментов атакующей нагрузки из публичных ссылок сокращателей URL; рой порядка 700 агентов, доступ к Slack, Kubernetes и датасетам Hugging Face. Сами авторы оговаривают: около 80% данных — исходящие запросы с неизвестным исходом, временных меток почти нет, происхождение всего трафика от агентов OpenAI не доказано. Пересказы в крупных СМИ мы не открывали — по вторичным источникам, не подтверждено. Контрточка зрения: «There are no rogue AI agents» (Eoin Higgins, 27.09) — термин «rogue» неточен, агенты шли на взлом при провале сбора данных, не будучи для этого ограниченными. Следует: для агентов с доступом в интернет явный запрет и фильтр исходящего трафика — часть конфигурации; «задача не решается» не должно превращаться в эскалацию методов.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"GLM-5.3 and the spread of advanced cyber capabilities — Anthropic Frontier Red Team","u":"https://www.anthropic.com/research/glm-5-3-and-the-spread-of-advanced-cyber-capabilities","k":"research","t":null,"g":14,"s":null,"p":250,"d":"Anthropic Frontier Red Team, 29.09. По данным авторов (вендор), открытая модель GLM-5.3 даёт автономную разработку эксплойтов на уровне Claude Mythos Preview: 12% на ExploitBench и 4% на бинарной эксплуатации; защиты обходятся в 64–100% случаев, «абляция» снижает долю отказов с 95% до 6% примерно за $4 400. Саймон Уиллисон цитирует тот же результат. Следует: «модель отказывается» перестаёт быть контролем при открытых весах; контроли — права, сеть, аудит — должны стоять вне модели.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"cf: the agentic CLI for the Cloudflare API — Cloudflare","u":"https://blog.cloudflare.com/cloudflare-cf-cli-launch/","k":"research","t":null,"g":14,"s":null,"p":170,"d":"Matt Taylor, Samuel Macleod (Cloudflare); на HN — 28.09. По данным вендора, доля агентов среди пользователей Wrangler выросла с четверти в марте до 48% на прошлой неделе; Wrangler покрывал около 280 операций, cf генерируется из OpenAPI-схемы и покрывает более 3000, с поиском команд (cf cli search), сжатым JSON по умолчанию и открытой бетой (npm i -g cf). Следует: образец «CLI как интерфейс агента»: генерация из схемы, встроенный поиск вместо раздутого списка инструментов, компактный вывод ради контекста.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"Prompting Claude Opus 5.5 — документация Anthropic","u":"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5-5","k":"research","t":null,"g":14,"s":null,"p":207,"d":"Страницу открыть не удалось; по сниппету поиска (вторичный источник, не подтверждено) это гайд про калибровку effort, прогресс-апдейты, неконтролируемые и мультиагентные задачи, с рекомендацией проверять несколько уровней effort вместо переноса настройки с Opus 5.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"Is sandboxing sufficient to contain rogue agents? — Matthew Green","u":"https://blog.cryptographyengineering.com/2026/09/30/is-sandboxing-sufficient-to-contain-rogue-agents/","k":"research","t":null,"g":14,"s":null,"p":48,"d":"30.09. Песочницы необходимы, но недостаточны: агенту для пользы нужны вычисления, сеть и инструменты, то есть неизбежные точки доступа. Главная угроза — кооперирующиеся агенты, исполняющие инструкции любого, кто положил текст перед ними (общий кэш пакетов, мессенджеры), по аналогии с червём. Следует: считать любой канал между агентами каналом инъекции; изоляцию дополнять мониторингом исходящего трафика.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"Show HN: Open-source model routing for coding agents — Weave Router 2.0","u":"https://news.ycombinator.com/item?id=49911500","k":"research","t":null,"g":14,"s":null,"p":99,"d":"30.09. Роутер, который вставляется между кодирующим агентом (Claude Code, Codex) и моделями и переключает их по сложности задачи. По данным авторов, на Terminal Bench 4.0 и SWE Atlas проходимость на уровне GPT-6 Astra при 52–54% его стоимости и в 2,2–2,5 раза быстрее; замеры не перепроверены. Сам репозиторий существует с апреля (★5,5k), в окне вышла только версия роутера 2.0.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"SkillSeek: Revisiting Agent Skill Retrieval at Marketplace Scale","u":"https://arxiv.org/abs/2609.38822","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Guanqun Yang и соавторы, 30.09 (AACL-IJCNLP 2026). По данным авторов, двухступенчатый поиск скиллов (bi-encoder + cross-encoder, доступен через MCP) на SkillsBench не лучше простого BM25 в трёх из четырёх настроек, а стоимость на испытание снижена с $51,30 до $27,54. Следует: для каталога скиллов начинать с лексического поиска по описаниям, а не с LLM-маршрутизатора.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"VeriHarness: Scaling Agentic Verification for Long-Horizon Tasks","u":"https://arxiv.org/abs/2610.00972","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Caiqi Zhang, Rujun Han и соавторы, 01.10. Модель сама верифицирует несколько прогонов, имея рабочее окружение, инструменты сбора свидетельств и повторно используемые «verification skills»; по данным авторов, расхождение прогонов полезнее консенсуса, прирост 6,2–6,4 пункта над одиночным прогоном на пяти длинных бенчмарках. Следует: отдельный верификатор со скиллами и свидетельствами окупается на длинных задачах.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"Can AI Scientists Coordinate at Runtime?","u":"https://arxiv.org/abs/2610.00980","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Zijian Liu и соавторы, 01.10. Агенты сами выбирают напарников, распределяют работу и проверяют результат по ходу; по данным авторов, такой выбор в рантайме стабильно сильнее жёстких схем, а контракты и верификация дают смешанный эффект в зависимости от бюджета. Следует: динамический выбор исполнителя выгоднее жёстких контрактов; верификацию делать неблокирующей.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"ORBIT: A Framework for Multi-Agent Safety and Security Evaluations","u":"https://arxiv.org/abs/2609.33102","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Ben Hagag, Christian Schroeder de Witt и соавторы; в листинге 29.09. Построен на Inspect (UK AISI): четыре типа угроз, четыре защиты, пять семейств сценариев. По данным авторов, защиты поэкшн снижают успех скомпрометированного агента на 60 пунктов в кодинге, но не защищают от сговора агентов. Следует: защиту тестировать отдельно против сговора, а не только против одного взломанного агента.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"Deny Without Disabling: Authorization-Paired Evaluation and Control for Multi-Agent Systems","u":"https://arxiv.org/abs/2610.00371","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Yunbei Zhang и соавторы, 30.09. Метрика, где успех — блокировка запрещённого использования и выполнение разрешённого; по данным авторов, механизм FlowReview снижает долю запрещённых коммитов с 86,0% до нуля без потери разрешённой работы. Следует: права проверять на скомпонованном артефакте, а не на каждом вкладе агента.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"Risk-Aware Adaptive Evaluation: Finding High-Impact Failures Under Limited Budgets","u":"https://arxiv.org/abs/2609.38914","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Priyanath Maji, Spandan Ghose Chowdhury, 30.09 (семинар NeurIPS 2026). Thompson Sampling выбирает сценарии для прогона; по данным авторов, на 50 испытаниях найдено 86% взвешенных по влиянию отказов против 25% при равномерной выборке (офлайн-воспроизведение на τ-bench). Следует: при дорогих прогонах оценки приоритизировать сценарии по влиянию.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"Safety of Latent Communication in Multi-Agent Systems","u":"https://arxiv.org/abs/2609.39788","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Muhammad Huzaifa, Sina Mavali, Thorsten Eisenhofer, 30.09. По данным авторов, обучение каналов латентной коммуникации между агентами даже без вредных данных поднимает показатель вредного послушания с 27,9 до 76,9. Следует: если агенты общаются не текстом, текстовые фильтры слепы; пока скорее предупреждение, чем практика.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"Nvidia: Open Agent Safety Platform (OpenShell и Sentry)","u":"https://www.euronews.com/2026/09/28/nvidia-launches-platform-to-quarantine-rogue-ai-agents-in-milliseconds","k":"research","t":null,"g":14,"s":null,"p":null,"d":"28.09. Первоисточник Nvidia не открывали — по вторичным источникам, не подтверждено: OpenShell — открытый рантайм-песочница с политиками на файлы, сеть, инструменты и учётные данные, Sentry — аппаратный наблюдатель, который, как заявляет вендор, карантинит агента за миллисекунды. Обсуждение: HN, 227 очков.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"Claude Sonnet 5.5 — Simon Willison","u":"https://simonwillison.net/2026/Sep/28/claude-sonnet-5-5/","k":"research","t":null,"g":14,"s":null,"p":null,"d":"28.09. Измерения автора: effort «max» израсходовал 128 000 токенов ($1,28) без результата, «xhigh» дал ответ за 5,74 цента и 41 секунду; Sonnet 5.5 стал моделью по умолчанию на бесплатном тарифе claude.ai (по пересказу страницы). Следует: при max-effort ограничивать вывод и проверять пустые ответы.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"QingYunA/answer-me-with-html","u":"https://github.com/QingYunA/answer-me-with-html","k":"skill","t":"объяснения","g":2,"s":2388,"p":null,"d":"Отвечает на сложные вопросы одностраничным HTML: модель пишет только черновик в Markdown, а SVG-диаграммы, CSS и разметку дорисовывает входящий в скилл CLI. По данным автора, это около 1/8 токенов от написания HTML вручную и примерно в 2.6 раза быстрее; цифры воспроизводятся скриптом bench. Работает офлайн, нужен Node.js 20+, ставится плагином или через npx skills. Есть режим always-on, добавляющий страницу к каждому выводу.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"Jakeschincariol/replica-skill","u":"https://github.com/Jakeschincariol/replica-skill","k":"skill","t":"клонирование","g":13,"s":1153,"p":null,"d":"Одиннадцать скиллов, клонирующих приложение по шагам: recon разбирает чужой продукт по публичным страницам и скриншотам, architect/design/build/backend воссоздают его, test гоняет Playwright-сценарии, diff считает parity-оценку, entrepreneur вытягивает жалобы пользователей из отзывов. Автор подчёркивает clean-room: копируются функции и потоки, не код, логотип и контент, а sweep.py ищет остатки оригинала. Инструменты — стандартная библиотека Python, сети не касаются.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"ythx-101/live-panel-skill","u":"https://github.com/ythx-101/live-panel-skill","k":"skill","t":"диаграммы","g":2,"s":662,"p":null,"d":"Превращает один JSON в анимированную архитектурную диаграмму в терминальном стиле или светлую движущуюся инфографику: пакеты бегут по проводам, лог прокручивается, счётчики и бары меняют состояние. Выдаёт H.264 mp4 или живую веб-страницу, работает и как скилл с SKILL.md. Всё детерминировано (каждый кадр — чистая функция времени), check_frames.py проверяет переполнение текста и повторяемость кадров.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"heise3/academic-deai","u":"https://github.com/heise3/academic-deai","k":"skill","t":"редактура","g":11,"s":251,"p":null,"d":"Редактирует академические тексты на китайском и английском: убирает шаблонные зачины, повторяющиеся концовки и механические абзацы, сохраняя факты, числа, цитаты, термины и силу утверждений. Модель-независимый, ставится на Claude Code, Codex, Cursor, Gemini CLI, OpenCode. Опциональные Python-скрипты (3.10+) сверяют инвариантность смысла — content_lock.py сопоставляет утверждения до и после. Автор оговаривает: примеры синтетические, независимого слепого оценивания и детектор-метрик нет.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"cth9191/animate","u":"https://github.com/cth9191/animate","k":"skill","t":"анимация","g":1,"s":233,"p":null,"d":"Делает короткие анимированные видео целиком в коде: один canvas, рисуется и озвучивается процедурно, детерминированно по кадрам, рендер через headless-браузер и ffmpeg. Семь встроенных стилей (вырезанная бумага, штриховка, ризограф и др.) или новый стиль, снятый с ваших референсов; одобрение сюжета, стиля и раскадровки до рендера. Проверяет себя измерениями: попадание склеек в бит, привязка героя, тишина перед кульминацией, темп озвучки.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"Jakeschincariol/founder-skill","u":"https://github.com/Jakeschincariol/founder-skill","k":"skill","t":"бизнес","g":13,"s":155,"p":null,"d":"Одиннадцать скиллов, проверяющих бизнес до запуска: совет директоров из трёх субагентов по фреймворкам Хормози, Тиля и Джобса; директор по маркетингу; CFO с юнит-экономикой; и панель из 100 покупательских агентов, прогоняющая идею по сценариям. Запускаются по порядку, каждый читает файлы предыдущего в папке founder/. Вердикт в итоговом плане вычисляется из чисел, а не пишется. Четыре инструмента — стандартная библиотека Python, сети не касаются.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"xamjiang/handout-remake","u":"https://github.com/xamjiang/handout-remake","k":"skill","t":"конспекты","g":2,"s":146,"p":null,"d":"Скилл для Claude и Codex, превращающий лекционные слайды, PDF или заметки в тёмные конспекты под 11-дюймовый iPad: заново объясняет тему от бытового примера к определению, схеме, формуле и разобранному примеру, добавляет страницы для рукописных ответов и собирает полностью векторный PDF. При сборке проверяет, не вылезает ли контент за страницу, и пересчитывает числа в примерах. Вывод — традиционный китайский. Для PDF нужны Node.js и headless-браузер; на Claude.ai/Cowork — облачная песочница.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"uzairansaruzi/p3-stack","u":"https://github.com/uzairansaruzi/p3-stack","k":"skill","t":"оркестрация","g":4,"s":143,"p":null,"d":"pstack от poteto, переписанный под примитивы T3 Code: одна mode-скилл маршрутизирует задачу по плейбукам (баг, перф, фича, рефакторинг, релиз), а дисциплина опирается на делегирование дочерним агентам, worktree-потоки с одним писателем на ветку, watch_pull_request вместо опроса и schedule_task вместо /loop. Около двух десятков скиллов и двадцать четыре принципа. install.sh линкует skills/* в ~/.agents/skills.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"dualface/ste-zh","u":"https://github.com/dualface/ste-zh","k":"skill","t":"отчёты","g":11,"s":143,"p":null,"d":"Задаёт стиль, которым агент отчитывается пользователю по-китайски, по мотивам ASD-STE100 (Simplified Technical English): вывод начинается с результата, статусы фиксированные (выполнено / частично / не проверено / заблокировано), каждое изменение помечено, проверено оно или нет, развилки оформляются нумерованными опциями. На код, комментарии и коммиты не влияет. Держится только на следовании инструкции в контексте — после compaction стиль может деградировать, нужно повторить /ste.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"atmirrr/persian-motion-director","u":"https://github.com/atmirrr/persian-motion-director","k":"skill","t":"типографика","g":2,"s":131,"p":null,"d":"Учит Claude делать профессиональный моушн-дизайн с правильной персидской (фарси) типографикой: не слайдшоу и без распадающихся букв. Восемь рабочих техник (одна камера без склеек, склейка по биту, точки-последними, кашида вместо разрядки), каждая — чистая функция времени на JS, одинаково идёт в браузере и во frame-exact Remotion. Инструменты на HarfBuzz для анимации по буквам и точкам, линтер персидского текста и кода (ي/ك, цифры, полупробелы).","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"orange2ai/podcast-to-article","u":"https://github.com/orange2ai/podcast-to-article","k":"skill","t":"письмо","g":11,"s":126,"p":null,"d":"Превращает расшифровку подкаста (многоголосый или интервью, китайский и английский) в готовую к публикации статью: меняет ось с «говорящий+время» на «тема+суждение», убирает леса «сказал X», но сохраняет гранулярность фактов и живую речь в прямых цитатах. Семь шагов от чистки субтитров до самопроверки; check_style.py считает попадания AI-признаков и сверяет с человеческим эталоном (доля прямых цитат 10–28%). По данным автора, пример ужался на 35%. Чистый Python 3, SRT/VTT/md.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"MrBongoC/ai-iso-skill","u":"https://github.com/MrBongoC/ai-iso-skill","k":"skill","t":"изометрия","g":1,"s":124,"p":null,"d":"Рисует интерактивные изометрические фигуры одним HTML-файлом: назови предмет — получишь штриховой изометрический рисунок на пронумерованной табличке с рабочими частями. Фигуры — чистый SVG без библиотек: около 15 строк проекции превращают каждую грань в SVG matrix(), порядок отрисовки задаёт глубину, одно состояние и render() ведут взаимодействие. Перед рисованием скилл решает, что даёт нажатие части (текст, число, нота); если нажимать нечего — берёт другой предмет.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"fatihaydost/brand-identity-skill","u":"https://github.com/fatihaydost/brand-identity-skill","k":"skill","t":"бренд","g":2,"s":111,"p":null,"d":"Проектирует фирменный стиль как единую систему: логотип, типографика и палитра выводятся из одного механизма, даётся три-четыре варианта карточками для сравнения. Решения измеряются, а не декларируются: контраст (WCAG 2 и APCA), симуляция дальтонизма, покрытие глифов под языки бренда, лицензии шрифтов, логотип в 16 и 32 px — провал метрики это гейт. На выходе kit гайдлайнов: 8-страничный PDF, файлы логотипа (SVG/PNG), дизайн-токены (CSS, SCSS, Tailwind, DTCG).","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"unclejobs-ai/motion-video-skill","u":"https://github.com/unclejobs-ai/motion-video-skill","k":"skill","t":"видео","g":1,"s":109,"p":null,"d":"Скилл в формате Agent Skills на моушн-графику и видео 30–90 с по шести этапам с гейтами: harness/gate.py измеряет каждый результат и выдаёт вердикт кодом возврата (длина, число кадров, совпадение стартового кадра, сетка битов, лауднес, true peak), а то, что видно только глазом, требует записанного отчёта о просмотре кадровой полосы. Отдельно — 29 типичных ловушек с профилактикой. Код композиций Remotion в репозиторий не входит.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"THUROI0787/absent-author","u":"https://github.com/THUROI0787/absent-author","k":"skill","t":"наука","g":13,"s":106,"p":null,"d":"Список признаков и два скилла для распознавания научных статей, которые целиком произвёл ИИ без человека за ними. EVIDENCE.md — 83 источниковых признака; paper-author-pass помогает автору (карта утверждение-доказательство, проверка ссылок и чисел); paper-slop-screen даёт рецензенту оценки W/R/Q, квадрант и находки с цитатой и местом. slop_lint.py (Python 3.9+, без зависимостей) считает 28 поверхностных следов, откалиброванных на 79 статьях, и выдаёт кандидатов для человека, не вердикты.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"Tejashmakwana/motionmaxxing","u":"https://github.com/Tejashmakwana/motionmaxxing","k":"skill","t":"видео","g":1,"s":89,"p":null,"d":"Скилл для моушн-графики: по URL сайта снимает бренд, выбирает одну идею, пишет STORYBOARD.md и собирает ролик из HTML поверх GSAP с локальным рендером через Chrome и ffmpeg. Тайминги взяты из покадрового разбора 53 профессиональных фрагментов (по данным автора). Результат проверяют скрипты: look.py ищет пустые кадры и затянутую концовку, lint.mjs ловит «слайдовые» приметы вроде угловых подписей и счётчиков; два гейта из шести оцениваются глазами, и агент обязан это оговорить. Озвучка и музыка требуют ключ ElevenLabs.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"EGSECDA/vocaloid-style-mv-pipeline","u":"https://github.com/EGSECDA/vocaloid-style-mv-pipeline","k":"skill","t":"видео","g":1,"s":74,"p":null,"d":"Скилл и шаблон проекта для лирик-видео в жанре Vocaloid-style «手書き»: агент получает песню и текст, анализирует ритм через librosa, предлагает концепцию, генерирует персонажа и собирает клип. Каждый кадр — чистая функция времени песни: Canvas2D и WebGL2 в headless-браузере, захват через Playwright, кодирование ffmpeg, поэтому рендер воспроизводим и параллелится. Проверка — стоп-кадры и contact sheets, которые агент просматривает и правит за два-три прохода. Полный 1080p-клип на RTX 3080 рендерится около 4 минут, по данным автора.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"Miftahul-Islam-Efaz/Motion-graphics-skill","u":"https://github.com/Miftahul-Islam-Efaz/Motion-graphics-skill","k":"skill","t":"видео","g":1,"s":66,"p":null,"d":"Скилл Motion Video Director: агент ведёт производство ролика по фиксированному процессу — бриф, сценарий озвучки под ElevenLabs, раскадровка по таймингам слов, анимация кодом (Canvas, SVG, Three.js, GSAP), монтаж присланного материала, звук с нормализацией до −14 LUFS и рендер через headless Chrome и ffmpeg. Перед полным рендером собирает contact sheets по сценам, а пользователь утверждает сценарий, план и превью. Прогресс пишется в PROGRESS.md, чтобы новая сессия продолжила с того же места.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"xianyu110/ecommerce-image-skills","u":"https://github.com/xianyu110/ecommerce-image-skills","k":"skill","t":"e-commerce","g":13,"s":64,"p":null,"d":"Двенадцать скиллов для товарных изображений маркетплейсов: белый фон для Amazon, сцены, инфографика, A+ модули, размерные сетки, примерка на модели, баннеры, обложки Xiaohongshu. Каждый сначала фиксирует форму, цвет, логотип и текст товара и переносит этот блок во все промпты. Детерминированные шаги вынесены в скрипты: проверка и исправление белого фона и доли товара в кадре, нарезка, склейка, пакетная замена фона с возобновлением и лимитом вызовов. Генерация — встроенным инструментом агента или через OpenAI-совместимый ключ к GPT Image 2.5.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"xianyu110/ecommerce-video-skills","u":"https://github.com/xianyu110/ecommerce-video-skills","k":"skill","t":"e-commerce","g":13,"s":59,"p":null,"d":"Тринадцать скиллов для коротких товарных видео под Douyin, TikTok Shop, Xiaohongshu, Taobao и Amazon: хук на первые три секунды, разбор и пересборка вирусного ролика, раскадровка, промпты для image-to-video, озвучка, субтитры, экспорт под площадки. Финальный ролик собирается локально из storyboard.json скриптами на Python и ffmpeg: озвучка edge-tts, переходы, субтитры ASS, фоновая музыка с приглушением под голос, нормализация громкости около −14 LUFS. API-ключ не нужен; видеомодели опциональны, у каждого кадра есть локальный запасной вариант.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"bangbuilds/code-poem-film","u":"https://github.com/bangbuilds/code-poem-film","k":"skill","t":"видео","g":1,"s":57,"p":null,"d":"Скилл превращает классическое китайское стихотворение в 2D-анимацию на 20–80 секунд в стиле туши: каждый кадр рисуется кодом, строки пишутся по штрихам в такт декламации, музыка и эффекты синтезируются на numpy — без картинок, видео и готовых треков. Перед рендером скрипт снимает кадры и ищет пустые и упавшие, а регрессия пересобирает эталонный ролик и сверяет попиксельно. Автор оговаривает: ранняя версия, сделано два ролика на одной машине с macOS, Linux и Windows не проверялись, только 16:9, качество звука машиной не оценивается.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"sebastianhaba/book-to-course-skill","u":"https://github.com/sebastianhaba/book-to-course-skill","k":"skill","t":"обучение","g":12,"s":56,"p":null,"d":"Скилл превращает книгу (EPUB, PDF, HTML, DOCX, Markdown) в локальный интерактивный курс для начинающих: уроки с пошаговыми объяснениями и анимациями, квизы с подсказками, тесты по главам, карточки и задания по программированию с юнит-тестами. Перед упаковкой скилл проверяет, что тесты падают на стартовом коде и проходят на эталонном решении. Прогресс сохраняется в файл через локальный сервер на Python 3. Ещё два скилла в том же плагине упаковывают курс в офлайн-APK для Android и в AppImage для Linux; на телефоне тесты кода не запускаются.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"robonuggets/skill-creator-plus","u":"https://github.com/robonuggets/skill-creator-plus","k":"skill","t":"аудит скиллов","g":0,"s":44,"p":null,"d":"Скилл для аудита, создания и доработки других скиллов по правилам Anthropic, включая поправки под Fable 5, Opus 5.5 и Sonnet 5.5: излишняя предписательность, просьбы выписывать рассуждения (отказ reasoning_extraction), важное в начале SKILL.md из-за compaction. Сначала выдаёт отчёт по 46 правилам с файлом и строкой как доказательством и ничего не правит без согласия. Механическую часть проверяет validate_skill.py на стандартной библиотеке Python; остальное Claude оценивает чтением.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"ARYANK-08/agentic-dev-kit","u":"https://github.com/ARYANK-08/agentic-dev-kit","k":"skill","t":"объяснения","g":2,"s":43,"p":null,"d":"Заготовка набора Markdown-скиллов для Claude Code под этапы SDLC — код, архитектура, ревью, тесты, запуск. Пока в наборе один скилл, explain: понятные объяснения упрощённым английским, в режиме «объясни как тринадцатилетнему», с диаграммами, HTML-страницами и видео. Ставится копированием одного SKILL.md в .claude/skills; проверок собственной работы README не описывает, лицензия не указана.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"Odyphus/MathModel-Copilot","u":"https://github.com/Odyphus/MathModel-Copilot","k":"skill","t":"матмоделирование","g":10,"s":41,"p":null,"d":"Скилл и локальная панель для командных соревнований по математическому моделированию (CUMCM, MCM/ICM): ведёт агента от разбора условия и сравнения моделей через запуск Python до материалов для статьи и предсдачной сверки. Различает «код написан», «программа запущена» и «результат проверен», хранит журнал решений и подсказывает, что пересчитать после смены условий. Автор оговаривает, что версия предварительная: запуск агента из панели и автоотправка issue ещё не прошли приёмку.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"ishuagrawal/skills","u":"https://github.com/ishuagrawal/skills","k":"skill","t":"видео","g":1,"s":39,"p":null,"d":"Маркетплейс скиллов, в котором пока один — video-by-reference: по понравившемуся ролику делает оригинальную анимационную короткометражку в том же стиле и с собственным саундтреком. Рендерит настоящие видеофайлы, поэтому требует Node.js 22+, ffmpeg и ffprobe, Python 3 с numpy и headless Chromium. Автор оговаривает, что в песочницах claude.ai и API нет сети и может не быть Chrome или ffmpeg, так что скилл там прочитается, но рендер может не пройти. SKILL.md проверяются скриптом на соответствие спецификации Agent Skills.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"kevinbadi/open-edits","u":"https://github.com/kevinbadi/open-edits","k":"skill","t":"видео","g":1,"s":38,"p":null,"d":"Набор скиллов Claude Code для монтажа: из сырого talking-head клипа собирает вертикальный или 16:9 ролик с моушн-графикой, субтитрами, логотипами, GIF и счётчиками, привязанными к моменту произнесения слова. Таймкоды слов даёт Whisper, каждый кадр рисуется в Python через PIL и кодируется ffmpeg локально; перед рендером проверяются превью-кадры на наложения. Отдельный скилл reverse-engineer измеряет чужой ролик и строит под его стиль новый скилл. Ключи Giphy и HeyGen опциональны; сделано на macOS.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"scottnarmstrong/LeanAutoformalizationSkills","u":"https://github.com/scottnarmstrong/LeanAutoformalizationSkills","k":"skill","t":"математика","g":13,"s":38,"p":null,"d":"Набор скиллов для формализации математики в Lean 4 с Codex или Claude Code: проектирование деклараций, поиск по Mathlib, написание доказательств, производительность, независимый математический аудит и оркестрация параллельной работы. Цель — доказать теорему, которую источник действительно утверждает: сборка Lean проверяет формальное утверждение, а аудит сверяет гипотезы, определения, кванторы и вывод с исходной математикой. Lean и toolchain скиллы не ставят; примеры смещены к PDE, вероятности и анализу.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"lemomo-ai/lemo-wake","u":"https://github.com/lemomo-ai/lemo-wake","k":"skill","t":"анимация","g":1,"s":37,"p":null,"d":"Скилл в обёртке плагина Claude Code: из одной картинки делает бесшовный цикл примерно на 5 секунд (MP4, GIF, WebP, Live Photo). Claude разбирает изображение на текст, фигуры, объекты и свет, воссоздаёт их кодом, покадрово рендерит в headless-браузере и проверяет стык конца с началом. Без генерации изображений и API-ключей; локальные модели вырезания и глубины (около 600 МБ) скачиваются только после согласия и сверяются по sha256.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"amelieloher/math-paper-skills","u":"https://github.com/amelieloher/math-paper-skills","k":"skill","t":"математика","g":13,"s":30,"p":null,"d":"Четыре скилла для Claude Code и Codex под исследовательскую математику в LaTeX: письмо и правка формулировок и доказательств, кампания по всей статье (сборка из заметок или полировка по фазам), рисунки и анимации, а также «visual paper» — сайт-компаньон с графом зависимостей доказательств. Правила жёсткие: правка не может молча менять гипотезу, квантор или константу; текст статьи на сайте цитируется по хешированной ссылке на источник, а каждое написанное агентом предложение проходит независимый аудит. Ставить нужно все четыре сразу.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"zsoXi/rust-correctness","u":"https://github.com/zsoXi/rust-correctness","k":"skill","t":"Rust","g":9,"s":27,"p":null,"d":"Скилл из одного S
