name: deploy

# Полная выкладка сайта при любом попадании коммита в main — пушем или мержем MR.
# Состав выкладки задаётся файлом deploy.manifest в этом же репозитории, поэтому
# добавление нового файла на сайт не требует захода на сервер.
#
# Сервер сам забирает файлы из репозитория: деплой-ключ на нём ограничен одной
# командой (/usr/local/bin/deploy-site.sh), другого доступа не даёт и ничего
# из репозитория не исполняет.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Разложить ключ и закреплённый host-key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # host-key закреплён явно: подмену сервера раннер не примет
          printf '%s\n' "${{ vars.DEPLOY_HOST }} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF1sEThhqUNxeSWgjUtOOuulxk6EMVNAizFdjoCAPlXY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Выложить сайт
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=20 \
              deploy@${{ vars.DEPLOY_HOST }}

      - name: Сверить каждый файл манифеста с боевым адресом
        run: |
          sleep 2
          fail=0
          while IFS= read -r f; do
            case "$f" in ''|\#*) continue;; esac
            code=$(curl -s -m 30 -o /tmp/got -w '%{http_code}' "https://paveldiordits.site/$f")
            if [ "$code" != "200" ]; then
              echo "✗ $f — HTTP $code"; fail=1; continue
            fi
            if diff -q "$f" /tmp/got >/dev/null 2>&1; then
              echo "✓ $f — $(stat -c%s /tmp/got) байт, совпадает с репозиторием"
            else
              echo "✗ $f — отдаётся, но отличается от репозитория"; fail=1
            fi
          done < deploy.manifest
          exit $fail
