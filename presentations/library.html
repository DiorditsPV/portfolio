аму — цифры авторские, не проверялись. MIT, 1.2 МБ, README на двух языках.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"KKKKhazix/sun-style-writing","u":"https://github.com/KKKKhazix/sun-style-writing","k":"skill","t":"вне темы","g":13,"s":208,"p":null,"d":"Китайский скилл, разбирающий десять приёмов повествования из книги «我的女友景甜» и обучающий модель писать действием, числами, предметами и молчанием вместо обобщённых эмоциональных формул. Демонстрация в README сделана честно и показательно: обычная модель на просьбу описать увольнение выдаёт «百感交集 / 青春 / 落幕» — три абстракции подряд; целевой стиль вместо этого пишет «на ресепшене перерезали мой бейдж. Ножницы застряли дважды. Она взяла другие». Ни одного слова о слезах. К агент-разработке отношения не имеет; в каталоге только потому, что ранжирование строго по звёздам. Полезен как образец узкой стилевой инструкции, где вся ценность в отрицательных примерах, а не в правилах. MIT, 7 МБ (в основном иллюстрации).","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"Vuk97/forward-implementation-first","u":"https://github.com/Vuk97/forward-implementation-first","k":"skill","t":"процесс","g":8,"s":161,"p":null,"d":"Лучшая находка окна по существу агент-разработки. Скилл описывает конкретный режим отказа длинных агентных конвейеров: пайплайн обрастает служебной бухгалтерией — хешами содержимого, лок-файлами, «расписками» о том, что стадия отработала, маркерами сертификации, — и модель начинает принимать эту метаданную за продукт. Автор разбирает цепочку по шагам: агент видит несовпадение хеша после правки продюсера, трактует его как отказ корректности, инвалидирует стадии с 12-й по 40-ю «на всякий случай», отказывается запускать 41-ю вручную, потому что «пайплайн не может выдать расписку за ручной запуск», и следующие несколько часов регенерирует маркеры для стадий, вывод которых не менялся. Каждый шаг по отдельности защитим, вместе они стоят суток. Лечение — одна классификация перед каждым действием (семантическая реализация / сфокусированная валидация / администрирование) и короткий список запретов. Около 150 строк Markdown, без привязки к модели, инструменту и домену. MIT.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"saurabhkumar8112/cyclomatic-complexity-skill","u":"https://github.com/saurabhkumar8112/cyclomatic-complexity-skill","k":"skill","t":"код-качество","g":6,"s":156,"p":null,"d":"Самая точная в окне формулировка проблемы AI-кода: «он работает, но ветвится как джунгли». Скилл меряет цикломатическую сложность по функциям (radon, eslint, gocyclo, lizard или ручной подсчёт), уважает пороги, уже настроенные в линтере проекта, и рефакторит худшие горячие точки известным набором приёмов — guard clauses, extract function, таблицы соответствий, именованные предикаты. Ценны два предохранителя. Первый: явный отказ «играть с метрикой» — сложность переносится в функции с осмысленными именами, а не в хитрые однострочники, которые формально снижают число ветвлений. Второй: каждый рефакторинг заканчивается таблицей «до / после» по функциям плюс подтверждением, что существующие тесты прошли, — то есть скилл обязан предъявить измеримый результат, а не отчитаться словами. Раздаётся тремя способами сразу: /plugin marketplace add для Claude Code, .skill-файл из релизов для claude.ai, Skills API для Claude API. Apache-2.0, 7 КБ — весь скилл помещается в один SKILL.md.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"aleksandr-alhoff/seo-landing","u":"https://github.com/aleksandr-alhoff/seo-landing","k":"skill","t":"веб","g":2,"s":138,"p":null,"d":"Скилл, дающий кодовому агенту компетенции старшего технического SEO-инженера: сборка лендингов с целевым 100/100 в Google PageSpeed и оптимизацией Core Web Vitals. Отличается от массы SEO-скиллов тем, что в репозитории лежат benchmark/, tests/ и references/ — то есть заявленное можно проверить, а не только прочитать. Есть README на русском. MIT.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"GENEXIS-AI/gpt-image-skill","u":"https://github.com/GENEXIS-AI/gpt-image-skill","k":"skill","t":"медиа","g":1,"s":132,"p":null,"d":"Генерация и правка изображений из Codex, Claude Code или Google Antigravity через подписку ChatGPT пользователя, а не через Images API. Прямые промпты идут как есть; когда пользователь делегирует несколько разных вариантов дизайна, агент сам разворачивает под каждую концепцию отдельный промпт. Реальные референсные файлы передаются в генерацию, PNG с прозрачностью проверяются на наличие альфа-канала, результат остаётся в активном проекте, готовые задания идут с ограниченным параллелизмом. Отдельно стоит отметить дисциплину README в части границ: репозиторий явно проговаривает, что не вызывает OpenAI Images API и не создаёт отдельно тарифицируемых запросов, но встроенная генерация всё равно расходует включённый лимит ChatGPT/Codex, недоступна на Free-плане и тратит лимит в 3–5 раз быстрее обычных ходов — «этот скилл эту границу не обходит». Для категории «мост к чужой подписке» такая честность нетипична. Есть CI-валидация скилла. Создан 26.08 в 08:52 UTC, за 18 минут до отсечки прошлого прогона —","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"camilleroux/genart-skill","u":"https://github.com/camilleroux/genart-skill","k":"skill","t":"медиа","g":1,"s":131,"p":null,"d":"Скилл генеративного искусства для Claude Code с упором на детерминированность: всё сеется хешем, результат воспроизводим и готов к ончейн-публикации. Аккуратно собранный репозиторий — .claude-plugin, AGENTS.md, CLAUDE.md, CHANGELOG.md, tests/. Для агент-разработки интересен именно требованием детерминированности: это редкий пример скилла, который заранее решает проблему воспроизводимости вывода модели.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"ashutoshsinghpr7/wikiskill","u":"https://github.com/ashutoshsinghpr7/wikiskill","k":"skill","t":"память","g":3,"s":105,"p":null,"d":"Реализация статьи «WikiSkill: Compiling Agent Experience into Persistent Knowledge for Skill Evolution» (arXiv:2608.27454, подана 27.08 — на день раньше окна; авторы Liyan Tang, Cyrus Rashtchian, Chun-Sung Ferng, Andrew Tomkins, Da-Cheng Juan, Tu Vu). Идея: опыт агента обычно умирает вместе с сессией, поэтому рядом со скиллами держится постоянная вики, и крутится замкнутый цикл — агент проходит обучающие задачи, «сопровождающий вики» агент дистиллирует трассы в страницы паттернов с корневыми причинами и починками, «предлагающий скиллы» агент читает вики и трассы и предлагает одно изменение скилла, после чего изменение валидируется на отложенных задачах и принимается только если строго лучше лучшего прежнего результата, иначе откатывается. Ключевая асимметрия: скиллы откатываются, вики — никогда, так что знание копится даже из неудачных попыток. Референсный бэкенд — Hermes Agent, но Claude Code, Codex и GitHub Copilot CLI поставляются в коробке. Есть пакет на PyPI, CI, сайт документации. MIT.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"ara-mkr/Wonder-Pill","u":"https://github.com/ara-mkr/Wonder-Pill","k":"skill","t":"процесс","g":8,"s":102,"p":null,"d":"Скилл, который принципиально отказывается давать ответ. На запрос он выдаёт интерактивную ментальную карту перевёрнутых допущений — с ветками, тупиками и точками, где мышление сошлось, — которую можно таскать мышью. README прямо предупреждает: «Wonder Pill не генерирует хорошие идеи. Он и не должен», и объясняет, что половина вывода будет бессмыслицей по замыслу, а не по дефекту. Ценность для агент-разработки — в честном подходе к калибровке ожиданий: скилл заранее описывает, как выглядит его нормальная работа, чтобы её не приняли за поломку. MIT.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"Tyche-MKR/scientific-agent-skills","u":"https://github.com/Tyche-MKR/scientific-agent-skills","k":"skill","t":"наука","g":13,"s":98,"p":null,"d":"Библиотека из 165 валидированных скиллов и 100+ научных баз данных по биологии, химии, медицине и разработке лекарств, совместимая с Claude Code, Cursor, Codex, Pi, Antigravity и открытым стандартом Agent Skills. Заявка «используется 190 000+ учёных» — маркетинг из README, не проверялась. Репозиторий при этом крупный и обжитой (248 МБ, scan_skills.py, scan_pr_skills.py, тесты, plugin.json), то есть за заявкой стоит реальная машинерия. Для агент-разработки интересен как образец того, как сопровождать библиотеку скиллов в сотню единиц: автоматические сканеры скиллов и скиллов из PR.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"v2space-labs/shader-for-interfaces","u":"https://github.com/v2space-labs/shader-for-interfaces","k":"skill","t":"дизайн","g":2,"s":98,"p":null,"d":"Скилл для проектирования, сборки, отладки и визуальной проверки GPU-эффектов внутри продуктовых интерфейсов: выбор рендерера (CSS / SVG / Canvas 2D / Three.js-WebGL / WebGPU-WGSL), работа с GLSL и WGSL, частицы, интеграция в UI, производительность, доступность, проверка в браузере. Сильная сторона по методу — скилл описывает не только как построить эффект, но и как убедиться, что он получился: пиксельные проверки через Node, поддержка prefers-reduced-motion, верификация на десктопе и мобильном. Версия 0.1.0 от 30.08, MIT.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"Ayueh0102/Ronnier-skill","u":"https://github.com/Ayueh0102/Ronnier-skill","k":"skill","t":"знания","g":3,"s":87,"p":null,"d":"Полный конспект по цветоведению и колориметрии на традиционном китайском, упакованный как скилл Claude Code и Codex: CIE-колориметрия, CIELAB, CIEDE2000, CIECAM02, хроматическая адаптация, цветопередача. Ставится и отвечает на вопросы вроде «чем яркость отличается от светлоты» или «почему в CIEDE2000 есть поворотный член», причём заявленный порядок ответа — сначала объяснить, какую задачу эта штука решает, и только потом давать определение и формулу. Приём, который стоит отметить отдельно: скилл работает и без агента — всё содержимое references/ — чистый Markdown, читаемый как обычный конспект, с точкой входа references/README_索引.md. Это редкий в выборке случай, когда автор явно проектирует артефакт под два режима чтения сразу. Создан 26.08 в 07:18 UTC, за два часа до отсечки прошлого прогона.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"heyman333/agent-notion-template-docs","u":"https://github.com/heyman333/agent-notion-template-docs","k":"skill","t":"документация","g":11,"s":75,"p":null,"d":"Скилл, заставляющий агента писать документы в структуре и визуальном стиле Notion — то есть фиксирующий шаблон документа, чтобы вывод не расползался от запуска к запуску. В репозитории есть hooks/, sync/ и .claude-plugin, так что это не только текст скилла, но и механика синхронизации. README на английском и корейском. MIT.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"Junhan2/oh-my-fable","u":"https://github.com/Junhan2/oh-my-fable","k":"skill","t":"промптинг","g":11,"s":49,"p":null,"d":"Руководство по промптингу Claude Fable 5.1, оформленное как набор скиллов Claude Code, на корейском, английском и китайском. Появился 02.09 — через день после релиза модели, что само по себе показатель скорости реакции экосистемы. Автор утверждает, что качество вывода растёт и на Opus 5 с Sonnet 5. Есть hooks/ и .claude-plugin. MIT.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"boringmarketer/meta-ads-skill","u":"https://github.com/boringmarketer/meta-ads-skill","k":"skill","t":"маркетинг","g":13,"s":43,"p":null,"d":"Скилл, обучающий кодового агента вести рекламу в Meta: настройка API, программные кампании, управление браузером и отслеживание конверсий. Прикладной, к устройству агентов отношения не имеет, но структурно опрятен — SKILL.md, reference/, scripts/. MIT.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"emlai/defi-native-skill","u":"https://github.com/emlai/defi-native-skill","k":"skill","t":"финансы","g":13,"s":38,"p":null,"d":"Скилл, дающий агенту понимание ончейн-рынков капитала: волты, кураторы, декомпозиция доходности, классы оракулов, RWA, стейблкоины. Методически любопытная деталь на общем фоне — заявленная «дисциплина живых данных»: каждое число датировано, каждая доходность разложена, доступ всегда только на чтение. В репозитории есть evals/, llms.txt и manifest.json. MIT.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"Endokelp/Only-Skill-You-Need","u":"https://github.com/Endokelp/Only-Skill-You-Need","k":"skill","t":"процесс","g":8,"s":37,"p":null,"d":"Мета-скилл, решающий проблему, которую сама экосистема и создала. Постановка прямая: «у агентов уже сотни скиллов. Они всё равно берут не тот, пропускают нужный или ставят второй скилл на задачу, которая уже занята». Существующий find-skills ищет по реестру, когда его спрашивают; здесь предлагается слой выше — пакетный менеджер: определить репозиторий, дозаполнить пустые сценарии использования из живой экосистемы, вести реестр установленного и заставить агента прочитать победителя перед тем, как писать код. Правило раскладки — «один слот на задачу, никогда не заменять лучший скилл худшим автоматически». Ставится как первый скилл вообще, через npx skills add Endokelp/Only-Skill-You-Need -g -y, и дальше должен срабатывать раньше остальных. Работает с Claude Code, Cursor, Codex, Copilot — со всем, что читает SKILL.md. Живая проверка по реестру skills.sh заявлена бейджем. Идея не бесспорная (агент, выбирающий агентам инструменты, — ещё один слой, которому надо доверять), но проблема названа верно и раньше других. Python 3.10+ на одной стандартной библиотеке, MIT.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"naderelewa/Product-to-Prod","u":"https://github.com/naderelewa/Product-to-Prod","k":"skill","t":"процесс","g":8,"s":37,"p":null,"d":"Набор продуктовых скиллов и плагин для Claude Code, Cowork и Codex: PRD с тегированными свидетельствами, спеки, приоритизация по RICE, скоринг бэклога и роадмапа, GTM-планы, верификация релиза, бенчмарк-паки. Заявленный принцип — «каждое утверждение либо со ссылкой на источник, либо явно помечено как неподтверждённое», что делает его любопытным именно как приём борьбы с уверенным враньём модели в продуктовых документах. Есть config.schema.json, packs/, tests/. MIT.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"glukicov/slideops","u":"https://github.com/glukicov/slideops","k":"skill","t":"документация","g":11,"s":36,"p":null,"d":"Пара скиллов, обращающихся с презентацией как со сборочным артефактом: колода генерируется из репозитория, записывает, из чего она построена, за миллисекунды проверяет, разошлась ли она с кодом, и пересобирает только уехавшие слайды. Формулировка автора — «писать документацию больше не узкое место; узкое место — держать её правдивой». Демо-колода из 17 слайдов собрана самим SlideOps. Есть статья автора на Medium, CI, pre-commit, ноль зависимостей. MIT.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"axelfreeman/marketing-mindset","u":"https://github.com/axelfreeman/marketing-mindset","k":"skill","t":"маркетинг","g":13,"s":31,"p":null,"d":"«Маркетинговая ОС для агентов»: сначала мышление маркетолога, тактики — на выходе. Из технически любопытного — рядом с SKILL.md лежит SKILL.lite.md, то есть автор явно разделил полную и облегчённую версии под разный бюджет контекста. Есть llms.txt и .cursorrules. MIT.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"kobingogo/motion-sticker-pack","u":"https://github.com/kobingogo/motion-sticker-pack","k":"skill","t":"медиа","g":1,"s":27,"p":null,"d":"Agent Skill для Codex: из изображения персонажа собирается зацикленный стикерпак с настоящей прозрачностью (WebP/GIF/PNG + ZIP); прозрачность проверяется попиксельно, а не по превью с шахматкой.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"sva-admin/sv-academy-prom-design","u":"https://github.com/sva-admin/sv-academy-prom-design","k":"skill","t":"дизайн","g":2,"s":26,"p":null,"d":"готовый «вкус» оформления для Claude Code, Cowork и Cursor.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"Socialpranker/zodchiy","u":"https://github.com/Socialpranker/zodchiy","k":"skill","t":"код-качество","g":6,"s":23,"p":null,"d":"архитектурный аудит, где находка допускается в отчёт только после того, как её цена измерена по git-истории; доктрина плюс CLI без зависимостей.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"fabricioctelles/jump-skills","u":"https://github.com/fabricioctelles/jump-skills","k":"skill","t":"мульти-агентность","g":4,"s":23,"p":null,"d":"мета-скиллы-маршрутизаторы, подбирающие и подгружающие нужный скилл из библиотеки вместо ручного поиска.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"shamashel/testing-on-the-toilet","u":"https://github.com/shamashel/testing-on-the-toilet","k":"skill","t":"код-качество","g":6,"s":21,"p":null,"d":"выжимка из выпусков Google Testing on the Toilet за 2007–2026: что хороший тест утверждает, от чего отказываться, как выбирать дублёры и уровни; 8 КБ, ставится через npx skills add.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"gquthier/company-os","u":"https://github.com/gquthier/company-os","k":"skill","t":"процесс","g":8,"s":21,"p":null,"d":"шаблон «операционной системы компании»: шина, два реестра, ступенчатая автономия, самозалечивающиеся циклы.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"fajrisilmi12-cyber/hermes-socmed-function","u":"https://github.com/fajrisilmi12-cyber/hermes-socmed-function","k":"skill","t":"интеграция","g":9,"s":20,"p":null,"d":"скиллы Hermes Agent для генерации картинок и постинга в соцсети.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"ToolMonsters/hand-raisers","u":"https://github.com/ToolMonsters/hand-raisers","k":"skill","t":"интеграция","g":9,"s":19,"p":null,"d":"находит тех, кто на этой неделе публично попросил то, что вы продаёте, квалифицирует запрос, проверяет, насколько тред уже забит ответами, и пишет черновик; жёсткие ворота по свежести (старше 7 дней — в отсев) и обязательный Bright Data MCP — без него не работает вовсе.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"maxritter/open-claude-design","u":"https://github.com/maxritter/open-claude-design","k":"skill","t":"дизайн","g":2,"s":19,"p":null,"d":"дизайн из реальных компонентов, токенов и состояний проекта, с обратной синхронизацией правок.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"atukunare/wiki-knowledge-agent","u":"https://github.com/atukunare/wiki-knowledge-agent","k":"skill","t":"память","g":3,"s":18,"p":null,"d":"«ваш AI забывает, а вики — нет»: вставленные в чат ссылки и текст проверяются (HTTP-статус, редиректы), переводятся, сжимаются в заметку и складываются в вики, а срочное попадает в локальную очередь напоминаний; нулевые зависимости сверх curl и стандартной библиотеки Python.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"Miint-Sunny/nai5-prompting","u":"https://github.com/Miint-Sunny/nai5-prompting","k":"skill","t":"медиа","g":1,"s":17,"p":null,"d":"метод написания промптов для NovelAI Diffusion V5, собранный не из опыта, а из 2226 замеренных изображений и 962 реальных промптов, с контрольными выпусками на фиксированном seed; сам метод-файл прогонялся через разные модели и правился там, где нарушения концентрировались.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"Daqi029/saas-onboarding-diagnosis","u":"https://github.com/Daqi029/saas-onboarding-diagnosis","k":"skill","t":"продукт","g":8,"s":17,"p":null,"d":"диагностика онбординга, активации и time-to-value в SaaS.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"shaokeyibb/flow-brief","u":"https://github.com/shaokeyibb/flow-brief","k":"skill","t":"документация","g":11,"s":17,"p":null,"d":"превращает систему или ещё не построенную фичу в однофайловый HTML-бриф с дорожками и бейджами происхождения, отделяющими измеренное от намеренного.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"RobZombAI/H3MLX","u":"https://github.com/RobZombAI/H3MLX","k":"skill","t":"медиа","g":1,"s":16,"p":null,"d":"вне темы — видеогенерация MiniMax-H3 на Apple Silicon плюс скилл к ней.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"Unknown-333/awesome-data-engineering-skills","u":"https://github.com/Unknown-333/awesome-data-engineering-skills","k":"skill","t":"данные","g":13,"s":15,"p":null,"d":"36 скиллов по dbt, Airflow, Dagster, Spark, Snowflake, Iceberg с упором на идемпотентность и бэкфилл.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"mikefutia/brand-studio-claude-skill","u":"https://github.com/mikefutia/brand-studio-claude-skill","k":"skill","t":"дизайн","g":2,"s":15,"p":null,"d":"брендинг-студия скиллом; описание в репозитории отсутствует.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"techjanitor/botmaker","u":"https://github.com/techjanitor/botmaker","k":"skill","t":"мульти-агентность","g":4,"s":14,"p":null,"d":"скилл Hermes Agent, единственная задача которого — порождать других специализированных ботов.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"alchaincyf/huashu-report","u":"https://github.com/alchaincyf/huashu-report","k":"skill","t":"документация","g":11,"s":13,"p":null,"d":"генератор исследовательских отчётов институционального уровня, спецификация выведена обратной разработкой 42 отчётов Stanford, McKinsey, BCG, PwC и World Bank.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"dreamers-laboratory/useful-skills-playbook","u":"https://github.com/dreamers-laboratory/useful-skills-playbook","k":"skill","t":"процесс","g":8,"s":13,"p":null,"d":"27 обкатанных в проде скиллов в 11 категориях.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"simonlin1212/FactReach","u":"https://github.com/simonlin1212/FactReach","k":"skill","t":"интеграция","g":9,"s":13,"p":null,"d":"поисковый скилл по 23 каналам (веб, X, Reddit, YouTube, GitHub, китайские площадки) с приоритетом на источники без авторизации.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"MotleyWildside/explain-for-dumb","u":"https://github.com/MotleyWildside/explain-for-dumb","k":"skill","t":"процесс","g":8,"s":11,"p":null,"d":"объясняет изменения в коде человеческим языком в двух режимах: история «для чайников» и разбор по файлам.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"kaisa-kucherenko/claude-code-flow","u":"https://github.com/kaisa-kucherenko/claude-code-flow","k":"skill","t":"процесс","g":8,"s":10,"p":null,"d":"рабочая обвязка тимлида, выложенная как есть из собственного ~/.claude: output style против многословности, хук ре-инъекции персоны против дрейфа на длинном контексте и пара скиллов handoff/pickup как осознанная замена /compact — вы решаете, что переживёт переключение, следующая сессия сверяет это с реальностью.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"bahni-m/code-with-quran","u":"https://github.com/bahni-m/code-with-quran","k":"skill","t":"прочее","g":13,"s":10,"p":null,"d":"вне темы — читалка Корана в соседней панели, продвигающаяся на один аят за промпт.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"cbrock84/headcount","u":"https://github.com/cbrock84/headcount","k":"plugin","t":"мульти-агентность","g":4,"s":1213,"p":null,"d":"Главная находка окна и самый звёздный репозиторий за несколько прогонов. Агентная организация для Claude Code, устроенная как компания: генеральный директор над 16 департаментами, 172 скилла суммарно. Ключевое инженерное решение — каждый департамент это отдельно устанавливаемый плагин, так что проект подгружает только нужные функции, а не всю библиотеку разом; скиллы адресуются как department:skill (security:threat-modeling, finance:unit-economics), поэтому имена не сталкиваются. Скиллы подгружаются сами по совпадению запроса: «почему этот лендинг не конвертит» поднимает demand-generation:landing-page-cro-expert, «можем ли мы позволить себе этот найм» — finance:unit-economics. Есть интерактивная оргсхема с поиском по всем скиллам. Это прямой ответ на проблему, о которой серия писала не раз: библиотека в сотню скиллов съедает контекст одними описаниями — здесь она нарезана на устанавливаемые куски. MIT, 10 МБ, создан 28.08.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"damejan80/tokentab","u":"https://github.com/damejan80/tokentab","k":"plugin","t":"наблюдаемость","g":5,"s":212,"p":null,"d":"Читает логи сессий, которые Claude Code, Codex, Cursor и Gemini CLI и так оставляют на диске, и сводит расход токенов и стоимость — по модели, по проекту, по дню и по типу работы. Всё локально: ни аккаунта, ни API-ключа, наружу ничего не уходит. Есть текстовый вывод (цвет автоматически отключается при пайпе), --json и веб-дашборд на localhost:4747, читающий с диска на каждый запрос. Cursor заявлен, но фактически заглушка — автор это в README не скрывает. Python, MIT, 317 КБ. Но главное в этой позиции — не функциональность. В дайджесте 18.08 под тем же именем tokentab и с практически тем же описанием фигурировал репозиторий wzchav/tokentab ★222; на момент этого прогона он отдаёт 404. Новый damejan80/tokentab создан 27.08 в 14:16 UTC, весь его git-лог — шесть коммитов за четыре минуты (14:16 → 14:20), один контрибьютор, и ★212 набраны за сутки. Утверждать, что это копия, оснований нет — это может быть тот же автор, перезаливший проект под новым аккаунтом. Но по форме след совпадает с сюжетом watermark-remover из прошлого прогона: репозиторий из предыдущего дайджеста исчезает, его место с тем же описанием занимает новый и за сутки-двое собирает сопоставимое число звёзд.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"frontier-harness-eval/eval","u":"https://github.com/frontier-harness-eval/eval","k":"plugin","t":"оценка","g":6,"s":121,"p":null,"d":"Публичные результаты и определения задач бенчмарка FrontierHarness Eval: одну и ту же модель (Kimi K3) прогнали через девять харнессов кодовых агентов в 12 конфигурациях на 30 одинаковых задачах — 360 прогонов. Содержательный разбор результатов — в разделе «Статьи и подходы»; здесь важно, что в репозитории лежат tasks/, results/, benchmark.json, cli/ и skills/, то есть бенчмарк воспроизводим и на свой харнесс его натравить можно. Без лицензии.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"nickname21kmr/gameops-investigator","u":"https://github.com/nickname21kmr/gameops-investigator","k":"plugin","t":"интеграция","g":9,"s":99,"p":null,"d":"Агент расследования инцидентов в игровых операциях, построенный вокруг двух принципов: инструменты MCP только на чтение и воспроизводимые оценки. Первое — редкий и правильный выбор для агента, которого пускают в продакшен-данные: он физически не может ничего сломать. Второе подкреплено директорией evals/ в репозитории. Внутри — приложение на Streamlit, .mcp.json, prompts/, artifacts/, скрипты установки под Windows. 8 МБ, Python, MIT.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"UditAkhourii/cdaf","u":"https://github.com/UditAkhourii/cdaf","k":"plugin","t":"контекст-инженерия","g":3,"s":96,"p":null,"d":"Единственная позиция окна, которая пытается быть форматом, а не инструментом. CDAF (Cached Descriptive Asset Files) — открытый sidecar-формат для видео: рядом с видеофайлом лежит текстовое описание с таймкодами и тем же базовым именем. Сгенерировал один раз — и каждый следующий агент, которому нужно это видео, читает несколько сотен текстовых токенов вместо полного прохода видео-понимания. Скилл ставится одной командой npx cdaf-skill и учит агента проверять наличие .cdaf-сайдкара и сверять его с хешем видео до того, как тратить токены на просмотр. Заявлен воспроизводимый бенчмарк на gemini-2.5-flash, 20 вопросов: ответ из сайдкара дал 20/20 против 19/20 у прямого анализа видео при 10.1× меньше промпт-токенов на вопрос (303 против 3066) и примерно на 35% меньшей задержке; отношение растёт линейно с длиной клипа (~50× на 60 секундах). Бенчмарк не перезапускался — цифры авторские. Компонентов четыре: нормативная спецификация SPEC.md v1.0, Python-движок, CLI и собственно agent skill. MIT, есть CI-тесты. По сути это тот же приём, что стоит за workflow-authoring в 2.1.248, только применённый к медиа: вынести дорогое описание из горячего пути и заменить дешёвой ссылкой на него.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"sharith45/atlas-Assistant","u":"https://github.com/sharith45/atlas-Assistant","k":"plugin","t":"ассистент","g":13,"s":67,"p":null,"d":"Локальный персональный ассистент на испанском: голосовое общение, управление WhatsApp, приём звонков, поиск в вебе, память. Позиционируется как приватный и автономный, без облака. К агент-разработке отношения не имеет, в каталоге — по звёздам. Без лицензии.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"vicoa-ai/vicoa","u":"https://github.com/vicoa-ai/vicoa","k":"plugin","t":"мульти-агентность","g":4,"s":53,"p":null,"d":"Открытый оркестратор («ADE») для управления командой кодовых агентов с любого устройства — десктоп, мобильный, VPS, самохостинг. Поддерживает Claude Code, Codex, OpenCode, Gemini, Cursor, GitHub Copilot, Kimi и Hermes бок о бок в одном рабочем пространстве. Инженерно интересны две вещи: каждый агент получает собственный git worktree и ветку, так что несколько агентов работают с одним репозиторием не мешая друг другу, и единый командный центр со статусом всех сессий вместо охоты по вкладкам терминала. Слоган — «начни за столом, рули из кармана». 47 МБ, Python, AGPL-3.0.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"semihtalii/brink","u":"https://github.com/semihtalii/brink","k":"plugin","t":"квоты","g":5,"s":52,"p":null,"d":"Ядро квотного кластера окна. Нативная утилита на Swift, показывающая лимиты Claude Code, Codex и Cursor по краю экрана на macOS и Windows — и, что полезнее, какой проект их израсходовал. Именно эта разбивка по проектам отличает его от десятка соседних счётчиков. Есть релизы, CHANGELOG, упаковка под обе платформы. MIT.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"gesta-run/subpool","u":"https://github.com/gesta-run/subpool","k":"plugin","t":"квоты","g":5,"s":48,"p":null,"d":"Лёгкий самохостящийся пул AI-подписок для команд на Go: вместо того чтобы каждый разработчик упирался в свой лимит, подписки складываются в общий пул. Взрослая сборка — DESIGN.md, миграции, compose-файлы, deploy/, веб-морда. Apache-2.0. Вместе с claude-rotate это уже отдельный жанр: инфраструктура перераспределения лимитов внутри команды.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"ARahim3/kaggle-tpu-lab","u":"https://github.com/ARahim3/kaggle-tpu-lab","k":"plugin","t":"инфраструктура","g":8,"s":46,"p":null,"d":"Qwen3.8-27B на бесплатном Kaggle TPU с OpenAI-совместимым эндпоинтом, 262k контекста и ~130 токенов в секунду; работает с Claude Code, Codex, Opencode и Pi. По сути — способ подкладывать под кодовые агенты бесплатную модель, то есть тот же квотный сюжет с другой стороны. MIT.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"qunqin24/Pulse","u":"https://github.com/qunqin24/Pulse","k":"plugin","t":"квоты","g":5,"s":43,"p":null,"d":"Плавающий монитор для macOS на Swift, показывающий остаток по Claude Code, Codex, Antigravity, OpenCode Go и Kimi Code сразу. Отличается от brink широтой охвата провайдеров, а не глубиной разбивки. Есть appcast для автообновления, релизы, README на английском и китайском. Apache-2.0.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"Taimoorkhan1122/prod-readiness","u":"https://github.com/Taimoorkhan1122/prod-readiness","k":"plugin","t":"код-качество","g":6,"s":24,"p":null,"d":"аудит готовности к проду семью параллельными агентами: безопасность, надёжность, тесты, DevOps, блокеры запуска.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"Dixie-sketch/Clawdeck","u":"https://github.com/Dixie-sketch/Clawdeck","k":"plugin","t":"наблюдаемость","g":5,"s":22,"p":null,"d":"фоновая панель статуса Claude Code для Corsair Xeneon Edge: виджет iCUE плюс локальный компаньон под Windows.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"nickelsec/bough","u":"https://github.com/nickelsec/bough","k":"plugin","t":"наблюдаемость","g":5,"s":15,"p":null,"d":"читает историю Claude Code и показывает, что на самом деле было сделано; локально, один бинарник.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"chengmarc/wechat-to-ai","u":"https://github.com/chengmarc/wechat-to-ai","k":"plugin","t":"интеграция","g":9,"s":14,"p":null,"d":"локальный экспорт переписок WeChat для скармливания агенту, без облака и телеметрии.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"doxaras/claude-rotate","u":"https://github.com/doxaras/claude-rotate","k":"plugin","t":"квоты","g":5,"s":13,"p":null,"d":"ротирующий прокси на несколько аккаунтов с обработкой 429 и удержанием до сброса лимита.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"Renly1994/Skillbox","u":"https://github.com/Renly1994/Skillbox","k":"plugin","t":"процесс","g":8,"s":11,"p":null,"d":"локальный менеджер агентных скиллов без аккаунта: «поставил один скилл — и всё».","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"icesword0760/matou","u":"https://github.com/icesword0760/matou","k":"plugin","t":"мульти-агентность","g":4,"s":11,"p":null,"d":"десктопный мультиагентный верстак для Claude Code на macOS: визуализация DAG, взаимодействие между карточками, Agent HUD, git worktree.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"justhalfbit/dsh-plugin-memory","u":"https://github.com/justhalfbit/dsh-plugin-memory","k":"plugin","t":"память","g":3,"s":11,"p":null,"d":"межсессионная Markdown-память с постепенным раскрытием тематических файлов и фоновой дистилляцией; автор прямо пишет, что механика выровнена по auto memory в Claude Code.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"llm-net/soc-agent","u":"https://github.com/llm-net/soc-agent","k":"plugin","t":"инфраструктура","g":8,"s":11,"p":null,"d":"вне темы — AI-шлюз на собственном ARM-устройстве во внутренней сети.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"mathdevie/devie-ai-quota-tracker","u":"https://github.com/mathdevie/devie-ai-quota-tracker","k":"plugin","t":"квоты","g":5,"s":11,"p":null,"d":"дашборд и менюбар для квот Claude Code, Codex, Gemini CLI, Copilot и Cursor с поддержкой нескольких аккаунтов.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"opencrew-ai/opencrew","u":"https://github.com/opencrew-ai/opencrew","k":"plugin","t":"мульти-агентность","g":4,"s":11,"p":null,"d":"превращает одну подписку Claude Code в команду агентов, работающих параллельно, в Slack-подобном интерфейсе, где каждое рискованное действие требует подтверждения.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"permgps/herdr-telegram-agents","u":"https://github.com/permgps/herdr-telegram-agents","k":"plugin","t":"интеграция","g":9,"s":11,"p":null,"d":"управление кодовыми агентами из Telegram: топик на агента, статус в иконке топика, инлайн-кнопки для выбора.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"jameskomo/config-drift-checker","u":"https://github.com/jameskomo/config-drift-checker","k":"plugin","t":"процесс","g":8,"s":10,"p":null,"d":"«CI для вашей агентной обвязки», и по содержанию это самая существенная позиция каталога, хотя по звёздам она в самом низу: CLAUDE.md, скиллы и хуки — это конфигурация, которую другие меняют у вас под ногами (CLI выпустил 25 версий за 30 дней перед написанием инструмента, модель за алиасом sonnet меняется на сервере без changelog, коллега правит скилл в PR, который никто не тестирует), — поэтому «что обвязка обязана делать» превращается в тест-кейсы в собственном формате Anthropic claude plugin eval (промпт плюс грейдеры: regex, использование инструмента, файл, LLM-рубрика), прогоняется на каждом релизе CLI (вотчер опрашивает npm), на каждом PR и по требованию в одноразовом воркспейсе, сравнивается с базовой линией (галочка, комментарий в PR, алерт, HTML-отчёт, дашборд по версиям на GitHub Pages) и — главное — прогоняется ablation, теми же кейсами с плагином и без, чтобы дельта показала, сколько на самом деле стоит каждый скилл и хук: в демо автора стабильно срабатывает только guard-хук.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"herliansyah/9router-auto-free","u":"https://github.com/herliansyah/9router-auto-free","k":"plugin","t":"интеграция","g":9,"s":10,"p":null,"d":"агрегирует 100+ бесплатных моделей для кодинга, проверяет их живыми пре-тестами через 9router, ранжирует по кодинг-бенчмаркам и задержке и подставляет в готовые комбо для Cursor, Claude Code и Cline; учётные данные читаются из уже настроенной SQLite-базы 9router, в репозитории ключи не хранятся.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"m-sanchez/clawdeck","u":"https://github.com/m-sanchez/clawdeck","k":"plugin","t":"наблюдаемость","g":5,"s":10,"p":null,"d":"локальный дашборд Claude Code без зависимостей: сессии, события, стоимость, worktree, ревью.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"wynx1123/ai-welfare-hub","u":"https://github.com/wynx1123/ai-welfare-hub","k":"plugin","t":"квоты","g":5,"s":10,"p":null,"d":"вне темы — навигатор по бесплатным AI-прокси-станциям с автопроверкой живости каждые 6 часов.","h":1,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"frontend-design","u":"https://github.com/anthropics/skills/pull/1713","k":"official","t":null,"g":14,"s":null,"p":null,"d":"(03.09, 36+/20− в одном SKILL.md) — самый интересный официальный текст окна, потому что это редкий случай, когда Anthropic публично перечисляет признаки собственного машинного почерка. Скилл и раньше просил не выдавать шаблонный дизайн; новая редакция заменяет общие призывы конкретным списком «умолчаний»:","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"claude-api","u":"https://github.com/anthropics/skills/pull/1704","k":"official","t":null,"g":14,"s":null,"p":null,"d":"(01.09, правки в 30+ файлах на семи языках) — синхронизация с релизом. По существу агент-разработки:","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"activecampaign","u":"https://github.com/anthropics/claude-plugins-official/pull/5641","k":"official","t":null,"g":14,"s":null,"p":null,"d":"(влит 28.08 06:33 UTC) — единственный новый плагин окна. PR минимальный: один файл, .claude-plugin/marketplace.json, +15 строк. То есть в официальный marketplace добавлена только запись каталога, сам плагин живёт во внешнем репозитории вендора — та же схема раздачи, что у Unity и NetSuite в прошлом окне.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"Show HN: We built open OpenRouter that turns usage into a better model","u":"https://github.com/experientiallabs/experiential","k":"research","t":null,"g":14,"s":null,"p":162,"d":"Открытый шлюз моделей, дающий единый control plane поверх закрытых, открытых, локальных и собственных моделей. Заголовок обещает больше, чем описание репозитория: «превращает использование в лучшую модель» — то есть трафик через шлюз становится сырьём для дообучения. По описанию репозитория этот контур подтвердить нельзя, сам код в этом прогоне не читался, поэтому механика дообучения — по вторичным источникам, не подтверждено. Репозиторий создан 24.06.2026 (★588) и в каталог окна по дате не идёт; в дайджест попадает как сюжет обсуждения.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"The load-bearing vocabulary of Claude","u":"https://louisabraham.github.io/load-bearing/","k":"research","t":null,"g":14,"s":null,"p":447,"d":"Лучший материал окна и редкий случай, когда «AI пишет код» измеряют не опросом, а корпусом. Луи Абрахам берёт описания пул-реквестов на GitHub и группирует их по словам, которыми они написаны, а не по тому, что в них искали: получается десять способов письма, и каждое описание принадлежит одному из них. Главный результат одной строкой: один из десяти составлял 0.7% корпуса в начале 2025 года и 39% к середине 2026-го. Корпус на момент чтения — 603 собранных дня, 595 из них в 85 полных неделях (2026-01-06 … 2026-08-17), 461 121 описание, 51 млн словоупотреблений, 19 798 слов выше порога. Методическая часть здесь интереснее вывода, и её стоит унести отдельно. Во-первых, GH Archive для такой задачи больше не работает: с середины 2025-го поток событий несёт почти только PushEvent (полный час 2024-08-12 — 13 555 IssueCommentEvent против 86 за тот же час 2026-08-10), а пуши текста не несут, поскольку GitHub убрал массив коммитов в октябре 2025. Автор пишет, что нашёл это дорого: ранняя версия проекта, построенная на архиве, отчиталась о 17 документах со словом load-bearing — ошибка в 158 раз, комментарии исчезли из фида, а не с GitHub. Работает вместо этого search API, потому что created: принимает не только даты, но и таймстемпы: десять пятиминутных окон в сутки, по одному из каждых 2.4 часа, старты разыгрываются с точностью до секунды и с посевом от даты (раньше они были кратны пяти минутам — то есть ровно той гранулярности, на которой срабатывает cron, и каждое окно открывалось в момент, когда автоматика массово открывает PR). Во-вторых, порог на слово считает людей, а не появления: слово входит в словарь, когда его написали 50 различных аккаунтов. Иллюстрация в статье исчерпывающая — store-path с 242 появлениями от 2 аккаунтов отброшен, а load-bearing с 1011 появлений от 848 аккаунтов оставлен: «слово, за которым потянулись 848 человек, — это слово; слово в 242 описаниях от 2 аккаунтов — это один документ, написанный 242 раза». В-третьих, антиспам-правила применяются к людям на тех же условиях, что к ботам: не более трёх описаний от одного автора в неделю — это потолок, а не исключение. Ограничение автор называет сам: день 2026 года держит около 460 тыс. подходящих PR, пятиминутное окно — около 1250, а страница выдаёт сотню, так что окно усечено до ста самых ранних — это выборка, а не перепись. Побочная находка, которая разойдётся отдельно от статьи: длинное тире — 0.2 появления на 10 000 слов в начале 2024 года против 123 в середине 2026-го.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"Breaking Claude Code Opus 5 Auto Mode","u":"https://embracethered.com/blog/posts/2026/breaking-claude-code-opus-5-and-automode/","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Самая существенная для агент-разработки находка окна по безопасности; на HN не попала, найдена через simonwillison.net. Auto mode — режим, который с середины августа 2026 стал в Claude Code режимом по умолчанию и заменяет человеческие подтверждения классификатором безопасности. Йоханн Рехбергер показывает рабочую цепочку исполнения кода в обход этого классификатора, и устройство цепочки поучительнее самого факта: Сервер отвечает HTTP 415, подталкивая Claude уйти с WebFetch на bash/curl. Пользователя ведут к ZIP-архиву с закодированными записями. Claude отказывается запускать приложенный бинарный декодер — и вместо него пишет собственную замену на Python. Декодер запускается из распакованной директории, где лежит вредоносный struct.py, затеняющий одноимённый модуль стандартной библиотеки. Импорт base64 внутри своего же декодера тянет отравленный struct.py и исполняет обфусцированную нагрузку; дальше — удалённый стейджер и C2. Фраза, ради которой стоит читать оригинал: «Claude не доверяет приложенному бинарному декодеру, но доверяет тому, который написал сам». Заявленный успех — 60–80% на трёх вариантах атаки, но автор честно оговаривает выборку: 3–5 прогонов на вариант, «это малые выборки, а не универсальное измерение ASR». Отдельный сюжет — реакция: отчёт ушёл в баг-баунти Anthropic, ответа не было, был отправлен повторно через канал безопасности и закрыт как «Informative» с формулировкой, что auto mode — «удобство, опирающееся на классификатор с лучшими намерениями, а не гарантия безопасности», а настоящая граница — изоляция ОС и контроль исходящего трафика. Рядом автор приводит заказанную Anthropic стороннюю оценку, показавшую 0.00% успеха атак на Opus 5 в auto mode на 72 сценариях, и снимает противоречие одной фразой: атака работает именно потому, что лежит вне фиксированного набора бенчмарка — «0.00% на бенчмарке и рабочий RCE истинны одновременно». Практический вывод автора: запускать неприсмотренных агентов в контейнере, VM или песочнице ОС, жёстко резать исходящий трафик, держать секреты вне рантайма агента, ставить явные ask/deny-правила вокруг создания процессов и никогда не принимать одобрение auto mode за доказательство безопасности. Классификатор — не песочница.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"Terminal-Bench-Science","u":"https://www.terminal-bench-science.ai/announcement","k":"research","t":null,"g":14,"s":null,"p":68,"d":"Бенчмарк агентов на настоящих научных workflow, а не на игрушечных задачах. Ведут исследователи Стэнфорда, строит команда Terminal-Bench вместе с предметными специалистами; заявлено 376 участников из 22 стран в предложении, ревью или реализации задач. Версия 0.1 — 70 задач, прошедших экспертную проверку, по пяти областям: науки о жизни (19), физические (17), математические (17), науки о Земле (8), инженерные (9); измеряются конкретные исследовательские результаты — анализы, симуляции, код, наборы данных. Результаты отрезвляющие: Claude Opus 5 — 30.0%, GPT-5.6 Sol — 22.4%, Claude Fable 5 — 21.4%, Claude Opus 4.8 — 10.5%, сильнейшая открытая модель GLM 5.3 — 8.1%. Относительно Terminal-Bench 3.0 доля решённых задач упала более чем на 10 процентных пунктов у всех протестированных моделей при сохранении различающей способности — то есть сложность подняли намеренно и с контролем. Полезно как трезвая точка отсчёта на фоне прогнозов из следующего пункта.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"Six months of writing code exclusively with agents","u":"https://blog.exe.dev/engineering-with-ai","k":"research","t":null,"g":14,"s":null,"p":66,"d":"Полгода по строгому правилу: не писать код руками вообще — задача описывается агенту, результат правится промптами, а не редактором. Инженерная часть обвязки описана конкретно и стоит внимания больше, чем сам зарок. Каждый агент живёт в отдельной одноразовой виртуальной машине, где может свободно запускать bash; внешний доступ (API, базы, учётные данные) идёт через прокси, подставляющие секреты, так что агент их не видит. Поверх этого автор построил botd — централизованное управление: поднимает VM, отслеживает прогресс, хранит историю разговоров, и за счёт этого работу можно вести с телефона, пока агенты продолжают после закрытия ноутбука. Валидация двухслойная: агенты сами гоняют тесты, CI и браузерные проверки, но затем автор руками смотрит работающее приложение — потому что агент уверенно доставляет «не то», если неверно понял требование. Ревью как жанр у него переехало: обсуждение архитектуры и компромиссов до написания кода («agentic engineering»), а к моменту появления кода решения уже зафиксированы контрактами и тестами. Два предупреждения. Первое — «летальная тройка»: недоверенный контент, приватные данные и внешняя коммуникация вместе; отсюда изоляция сред и контроль сочетаний инструментов. Второе, менее ожидаемое: автор выбрасывал готовые, протестированные фичи, потому что они дублировали имеющееся или добавляли лишнюю сложность — автоматическая валидация не отвечает на вопрос, должна ли эта вещь существовать, а «расшипить» тяжелее, чем зашипить. Цена, которую он называет прямо: глубокое знание каждой строки исчезло, взамен появилась возможность допросить историю разговоров с агентами и восстановить причины решений.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"The end of programming","u":"https://pauldix.com/the-end-of-programming","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Пол Дикс (создатель InfluxDB) утверждает, что ручное написание кода и человеческое код-ревью устареют: агенты будут производить большую часть работающего софта, а люди станут проверять результат, а не код. Прогнозы даны с датами — новые фронтир-модели к сентябрю 2026-го и к концу года; за 2–3 года удешевление и ускорение генерации токенов в 10–100 раз; к 2027–2028 самые продуктивные разработчики управляют системами, а не пишут код; за десятилетие машинно-сгенерированного продакшн-кода станет больше, чем написанного людьми. На своих проектах он приводит две сложные фичи InfluxDB (интеграция с Iceberg и репликация данных на периферию), сделанные за 14 и 28 часов в рамках обычного недельного лимита токенов. Опорный пример — переписывание Bun с Zig на Rust, которое Саймон Уиллисон процитировал из этой статьи: «тот факт, что AI написал 1 млн строк и потом дорабатывал их пару месяцев до надёжного софта, который сейчас крутится на миллионах машин разработчиков, абсолютно поразителен». Здесь нужна оговорка: сам эпизод — июль 2026 года, то есть вне окна, а цифры в разных пересказах расходятся (у Дикса — 1 009 257 добавленных строк и 6778 коммитов за 11 дней при ~$165 тыс. расходов на токены; в других изложениях — около 550 тыс. портированных строк, ~780 тыс. строк Rust на выходе, 6500 коммитов, 64 параллельных агента). Первичный отчёт Джарреда Самнера в этом прогоне не читался: числа по Bun — по вторичным источникам, не подтверждено. Аргумент Дикса приведён по его собственной статье.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"FrontierHarness Eval","u":"https://runta.com/blog/introducing-frontierharness-eval/","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Самый практически ценный материал окна, и единственный, который меняет решение о том, чем работать. Shilin Zhu и Shiqi Mei прогнали одну и ту же модель Kimi K3 через девять харнессов кодовых агентов (12 конфигураций) на 30 одинаковых задачах по разработке и работе в терминале — 360 прогонов. Модель, задачи и рантайм held constant, менялся только харнесс. Результат: доля решённых задач у всех 12 конфигураций близка — от 50,0% до 66,7%, разброс в 17 пунктов. А стоимость решённой задачи различается от $1.05 до $18.34, то есть в 17,5 раза. Claude Code в этой таблице — самый дорогой: pass rate 63,3% (вровень с DSH Creator), но $18.34 за решённую задачу против $3.28 у DSH Creator и $3.47 у Codex, при медианном времени 9 мин 38 с. Ключ к объяснению — кеш: у Claude Code доля попаданий в кеш, взвешенная по токенам, 25,0% против 91,6–99,1% у остальных. Авторы честно оговаривают, что это скорее про несовпадение харнесса и модели, чем про дефект харнесса: Claude Code проектировался под явное кеширование моделей Anthropic, а тестировали его на неявном префиксном кеше Kimi K3. Иными словами, число $18.34 нельзя переносить на Claude Code с Opus или Fable — но сам вывод «харнесс стоит дороже, чем кажется, и цена прячется в кеше» переносится полностью. Определения задач и результаты выложены, бенчмарк можно натравить на свой харнесс.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"Which tools do Claude, Codex and Cursor choose?","u":"https://armature.tech/blog/which-tools-coding-agents-install","k":"research","t":null,"g":14,"s":null,"p":212,"d":"Armature измерила, какие сторонние сервисы кодовые агенты рекомендуют и ставят. Масштаб серьёзный: 75 репозиториев на 10 языках, 1163 вариации промпта, четыре персоны пользователя (вайб-кодер, джун, сеньор, энтерпрайз-инженер), «симулированный человек в цикле» на Gemini 3.7 Flash, три провайдера песочниц. Из 16 893 прогонов в анализ попали 5292 валидных сессии по 51 кодовой базе. Главное число: все три агента выбирают один и тот же инструмент лишь в 42% ячеек. То есть выбор технологии в заметной степени определяется не задачей, а тем, какой агент открыт. Различаются и источники решения: Claude Code опирается на обучающие данные и ищет в вебе примерно в 30% случаев, Codex ищет в вебе в 94%, Cursor опирается на веб примерно в двух третях случаев. Контекст решает больше, чем репутация: победитель по отправке почты меняется с языком — Resend в TypeScript, Sendgrid в Python, Postmark в Go, Azure в Java. И отдельно — упоминания не равны выбору: PayPal получил 139 упоминаний и ноль выборов, LangChain — 194 упоминания и 4 выбора. Практический вывод для тех, кто держит скиллы: если стек не закреплён явно в CLAUDE.md или скилле, его за вас выберет статистика обучающей выборки конкретного агента.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"Grep beats LSP? Why coding agents ignore your fancier tools","u":"https://www.agentconnect.md/blog/grep-beat-lsp-harness/","k":"research","t":null,"g":14,"s":null,"p":72,"d":"Автор — Pengcheng Xu. Расхождение дат отмечаю явно: сама страница указывает 12 августа, то есть статья старше окна и всплыла на HN только 04.09; в дайджест попадает по волне обсуждения, а не по дате публикации. Тезис: агенты игнорируют LSP не потому, что он хуже, а потому, что grep «дружелюбнее к модели». Формулировка автора — инструмент дружелюбен не когда его результат точен, а когда он возвращает достаточно контекста для следующего шага и подаёт его в форме, которую модель может использовать напрямую. Измерения, которые это подкрепляют: на простых задачах локализации кода модели выбирали семантические инструменты в 0–6% случаев, а на задачах полноты поиска ссылок — уже в 45–57%, то есть маршрутизация по типу задачи у агентов есть. Когда в вывод LSP добавили инлайновый исходный контекст вместо голых координат файлов, доля успеха выросла с 0,67 до 0,83, а число дочитываний файлов упало с 15,2 до 3,2 за эпизод. И ценность зависит от шума в кодовой базе: на чистых репозиториях LSP был чистыми накладными расходами, на шумных дал +0,246 к F1. Итоговая формула автора — «способность агента = модель × харнесс» — прямо рифмуется с выводом FrontierHarness Eval, и вместе они образуют главный методический сюжет окна: харнесс перестал быть деталью реализации.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"AI Agents and the Refactoring That Never Happens","u":"https://www.rosenfeld.page/articles/programming/2026_09_02_ai_agents_and_the_refactoring_that_never_happens/","k":"research","t":null,"g":14,"s":null,"p":49,"d":"Rodrigo Rosenfeld Rosas формулирует неочевидный риск. Модульность, инкапсуляция и слоистость, пишет он, «не эстетические предпочтения, а уступки объёму человеческой рабочей памяти». Исторически именно человеческий предел работал сигналом: когда разработчик переставал понимать код, он останавливался и рефакторил. Агенты этот предел снимают — они разбираются в мешанине, которая остановила бы человека. Сигнал исчезает, а вместе с ним и рефакторинг, и команда приходит к системе, ключевые части которой не может целиком осмыслить ни один разработчик. Контраргумент к позиции «ну и пусть, агент же справляется» автор строит экономически: чистый модульный код дешевле в токенах и точнее в работе агента. Предложение — сознательно вернуть дисциплину рефакторинга и встроить в агентные харнессы флаг на неподдерживаемую сложность. Практически это ложится в ту же линию, что Socialpranker/zodchiy из каталога, где находка допускается только после измерения её цены.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"How Warp builds self-improving agents on Claude","u":"https://claude.com/blog/how-warp-builds-self-improving-agents-on-claude","k":"research","t":null,"g":14,"s":null,"p":58,"d":"Публикация датирована 26 августа — на два дня раньше окна; в дайджест попадает по обсуждению 29.08. Warp (около 800 тыс. разработчиков в месяц, 10 млн сессий Claude Code) описывает схему из двух скиллов против проблемы «обратная связь умирает вместе с сессией»: Базовый скилл держит доменное знание и инструкции — например, правила ревью кода. Скилл-улучшатель запускается по расписанию, смотрит на накопленную человеческую обратную связь, сравнивает вывод агента с реакциями на него и предлагает небольшие точечные правки к базовому скиллу. Правки идут через обычный code review, то есть человек остаётся в цикле. Формулировка основателя Zach Lloyd: «файловые скиллы — способ закодировать знание для агентов, не помещая это знание прямо в промпт». Схема почти дословно совпадает с циклом WikiSkill из каталога, только вместо автоматического гейта на отложенных задачах здесь гейтом служит человеческое ревью — полезное сопоставление двух способов замкнуть одну и ту же петлю.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"Session URL в коммит-сообщениях","u":"https://github.com/anthropics/claude-code/issues/66504","k":"research","t":null,"g":14,"s":null,"p":209,"d":"Не статья, а обсуждение, но по последствиям для практики значимое. Claude Code по умолчанию дописывал ссылку на сессию (https://claude.ai/code/session_...) в каждое коммит-сообщение и описание PR — без явного согласия и без упоминания при онбординге. Issue заведён 09.06, закрыт как выполненный 17.08, то есть к моменту всплеска на HN 30.08 проблема уже была решена; волна обсуждения догнала исправление с опозданием в две недели. В комментариях (115 реакций, 24 комментария) поднимался вопрос о совместимости такого поведения с GDPR — это оценка участников обсуждения, не юридический вывод. Практический остаток: подавляется настройкой attribution.commit: \"\" в .claude/settings.json.","h":0,"f":null,"i":3,"a":"agents-weekly-2026-09-04","e":"2026-09-04"},{"n":"Vincentwei1021/anything2explainer","u":"https://github.com/Vincentwei1021/anything2explainer","k":"skill","t":"медиа","g":1,"s":869,"p":null,"d":"Тема на входе — готовый объясняющий ролик на выходе: чёрный холст, моушн-графика, TTS-озвучка, субтитры и прогресс-бар глав, на китайском или английском. Каждый кадр рисуется кодом в Remotion (React + TypeScript) — без стоков, генеративного видео и чужих кадров. Автор подчёркивает, что это не CLI, а метод целиком: компилируемый шаблон, библиотека примитивов и света, инструменты озвучки, раскадровки, рендера и количественного QC, протокол разделения труда между несколькими агентами и эталонный фильм как планка качества. Лидер окна: 154 форка за три дня.","h":0,"f":null,"i":4,"a":"agents-weekly-2026-09-11","e":"2026-09-11"},{"n":"achimala/dream-loop","u":"https://github.com/achimala/dream-loop","k":"skill","t":"визуал/цикл критика","g":2,"s":803,"p":null,"d":"Замкнутый цикл для игр, приложений и сцен с сильным визуалом: агент сначала «видит во сне» целевой скриншот через генерацию изображений, строит под эту цель, затем отдельный агент-критик сравнивает живой скриншот с целью и возвращает замечания — пока не будет удовлетворён; по желанию цель переснится выше. Честная оговорка автора: протестировано только с GPT-6 Astra в Codex, Claude Fable 5.1 «вероятно, тоже справится».","h":0,"f":null,"i":4,"a":"agents-weekly-2026-09-11","e":"2026-09-11"},{"n":"alchaincyf/huashu-mac-use","u":"https://github.com/alchaincyf/huashu-mac-use","k":"skill","t":"интеграция","g":9,"s":239,"p":null,"d":"Даёт любому агенту управлять нативными macOS-приложениями без API и протоколирует каждый шаг как воспроизводимое доказательство: «читать — сколько угодно, писать — не мешая, на каждом шаге оставлять улики». Канал выбирается по уровню: сначала встроенный скриптинг приложения (bpy в Blender, CDP во встроенном Chromium), computer use — в последнюю очередь; окна снимаются в фоне, без перехвата фокуса. Витрина — круизный лайнер, собранный агентом в Blender по четырём AI-фото за 33 минуты. Формат Agent Skills, китайская агентная экосистема.","h":0,"f":null,"i":4,"a":"agents-weekly-2026-09-11","e":"2026-09-11"},{"n":"viettranx/3dviz-pro-max","u":"https://github.com/viettranx/3dviz-pro-max","k":"skill","t":"3D","g":1,"s":156,"p":null,"d":"Креативная 3D-визуализация от идеи до исследуемой сцены Three.js / Blender: десятишаговый процесс, 223 рецепта, база знаний, запускаемые шаблоны и хелпер захвата кадров, чтобы агент смотрел на то, что реально отрендерил, а не описывал. Показательная деталь: README сам помечает происхождение медиа — одно из видео снято до появления скилла и тестом не является. Claude Code и Codex, упакован и как плагин.","h":0,"f":null,"i":4,"a":"agents-weekly-2026-09-11","e":"2026-09-11"},{"n":"bangtutorial/bang-motion","u":"https://github.com/bangtutorial/bang-motion","k":"skill","t":"медиа","g":1,"s":134,"p":null,"d":"Моушн-графика в браузере: заставки, промо, бамперы, кинетическая типографика, пять стилей объясняющих роликов; результат — один index.html. Проблема сформулирована точно: попроси агента «видео» — получишь слайды. Правила моушн-дизайнера (единый мир, камера, которая движется, сквозной объект, цифры внутри сцены) превращены в структурные проверки, которые агент может верифицировать в собственном коде.","h":0,"f":null,"i":4,"a":"agents-weekly-2026-09-11","e":"2026-09-11"},{"n":"Jakeschincariol/linkedin-agent-skill","u":"https://github.com/Jakeschincariol/linkedin-agent-skill","k":"skill","t":"маркетинг","g":13,"s":132,"p":null,"d":"Одиннадцать скиллов под аккаунт LinkedIn: посты по 21 формуле хука, комментарии, ответы, скоринг профиля из 100, недельный план. Центральный — «хуманайзер»: вычищает длинные тире, slop-лексику и невидимые символы-водяные знаки и прогоняет черновик через пять проверок детекторов. Жёсткое правило — ничего не публикуется без явного «да».","h":0,"f":null,"i":4,"a":"agents-weekly-2026-09-11","e":"2026-09-11"},{"n":"feitangyuan/motion-web","u":"https://github.com/feitangyuan/motion-web","k":"skill","t":"UI/веб","g":2,"s":130,"p":null,"d":"Моушн-первые креативные сайты на чистых Three.js / Canvas 2D / WebGL / CSS: движение как материал интерфейса, реальная физика (пружинно-демпферные системы), семь рабочих кейсов. Каждый кейс проходит автоматическую headless-проверку Playwright (verify_case.py) — автор называет это защитой от AI-slop и «мёртвых» взаимодействий.","h":0,"f":null,"i":4,"a":"agents-weekly-2026-09-11","e":"2026-09-11"},{"n":"daishuge/pcb-skill","u":"https://github.com/daishuge/pcb-skill","k":"skill","t":"железо","g":13,"s":100,"p":null,"d":"От идеи устройства до платы, которую можно заказать, спаять и запустить: концепт, схема, закупка, разводка, верификация и покупка, доведённая до страницы перед оплатой. Работает в Claude Code и Codex (desktop), управляет EasyEDA Pro через MCP. Ценность — в гейтах, «оплаченных реальными платами»: развёрнутый разъём, конденсатор под модулем, keep-out только на слое чертежа, проверка, которая тихо измеряет предыдущий релиз.","h":0,"f":null,"i":4,"a":"agents-weekly-2026-09-11","e":"2026-09-11"},{"n":"eternityspring/reelbench-skills","u":"https://github.com/eternityspring/reelbench-skills","k":"skill","t":"медиа","g":1,"s":92,"p":null,"d":"Раскадровка готового ролика в покадровую таблицу: длительность, план, тип, движение камеры. Разделение ролей образцовое: точки склейки и длительности меряет ffmpeg, модель судит только о четырёх вещах, которые может судить, а 14 ворот качества сверяются поштучно. Ноль npm-зависимостей и API-ключей.","h":0,"f":null,"i":4,"a":"agents-weekly-2026-09-11","e":"2026-09-11"},{"n":"Da7-Tech/SureForge","u":"https://github.com/Da7-Tech/SureForge","k":"skill","t":"процесс","g":8,"s":90,"p":null,"d":"Инструкция без рантайма для сложной работы: исследуй, прежде чем спрашивать; спроси, прежде чем планировать; спланируй, прежде чем строить; проверь, прежде чем сдавать; получи независимое ревью, прежде чем назвать готовым. Перечень провалов, из которых вырос скилл, точен: агент начинает строить до понимания задачи, принимает пропущенный вопрос за «да», проверяет выборку и объявляет полноту, перечитывает свою работу и называет это ревью.","h":0,"f":null,"i":4,"a":"agents-weekly-2026-09-11","e":"2026-09-11"},{"n":"AvroraCL/image-to-css-art","u":"https://github.com/AvroraCL/image-to-css-art","k":"skill","t":"веб/медиа","g":1,"s":90,"p":null,"d":"Скилл с автономным CLI: описывает растровую картинку как одностраничный HTML + CSS — контуры на clip-path, отверстия, градиенты, квантование в Oklab. Три уровня точности, офлайн-оценка расхождения с оригиналом (MAE) и автопроверка структуры. Честно помечено как автоматическое трассирование с потерями, а не семантический разбор.","h":0,"f":null,"i":4,"a":"agents-weekly-2026-09-11","e":"2026-09-11"},{"n":"icesixgod/awesome-astra-blender-characters","u":"https://github.com/icesixgod/awesome-astra-blender-characters","k":"skill","t":"3D","g":1,"s":83,"p":null,"d":"Персонаж из референса — в редактируемый Blender-проект: девять видов, лицо и волосы, локальная доработка, приёмка по нескольким видам. Стоит отметить дисциплину: молчание пользователя не считается согласием убрать видимую деталь, а каждая правка сравнивается по реальному рендеру. Моделей и демо-рендеров в репозитории нет — только инструкции и справочники.","h":0,"f":null,"i":4,"a":"agents-weekly-2026-09-11","e":"2026-09-11"},{"n":"wbso-ai/omarchy-plugin-security-skill","u":"https://github.com/wbso-ai/omarchy-plugin-security-skill","k":"skill","t":"безопасность","g":7,"s":69,"p":null,"d":"Скилл, выведенный из данных. Автор с помощью Claude Fable прочитал все 5130 заявок в маркетплейс плагинов Omarchy и около 5500 комментариев мейнтейнеров безопасности (июль–сентябрь 2026) и превратил каждую блокирующую находку в правило, исправление и пункт чеклиста. По его подсчёту, 51% заявок получили хотя бы одно замечание по безопасности, чистая заявка попадает в листинг за 0,2 дня, заблокированная — за 1,0. Цифры авторские, независимо не проверялись.","h":0,"f":null,"i":4,"a":"agents-weekly-2026-09-11","e":"2026-09-11"},{"n":"jangtrinh/design-os-3d-blender","u":"https://github.com/jangtrinh/design-os-3d-blender","k":"skill","t":"3D","g":1,"s":66,"p":null,"d":"«Операционная система» агента для Blender 5.2: скиллы, проверенная база знаний bpy, контракт исполнения AGENT_OK / AGENT_FAIL, продакшн-гейт для 3D-печати и готовые сборки (роборука, намотчик часов). Галереи сопровождены манифестом происхождения медиа.","h":0,"f":null,"i":4,"a":"agents-weekly-2026-09-11","e":"2026-09-11"},{"n":"Devesh-Shirsath/spotkit","u":"https://github.com/Devesh-Shirsath/spotkit","k":"skill","t":"UI/дизайн","g":2,"s":61,"p":null,"d":"Из описания фичи — абстрактная продуктовая иллюстрация как настоящий SVG в единой системе: двенадцать фич, двенадцать раскладок, обе темы на двенадцати CSS-переменных. Принцип сформулирован коротко: «абстрагируй интерфейс, а не идею».","h":0,"f":null,"i":4,"a":"agents-weekly-2026-09-11","e":"2026-09-11"},{"n":"undefined-ui/second-brain-os","u":"https://github.com/undefined-ui/second-brain-os","k":"skill","t":"память","g":3,"s":49,"p":null,"d":"«Второй мозг», который поддерживает себя сам: гайд, стартовое хранилище Obsidian, 18 скиллов и скрипты, чтобы агент превращал прочитанное и сохранённое в связанные вики-страницы и отвечал по ним. Логика прямая: связывание скучно, люди бросают через две недели, агент — нет.","h":0,"f":null,"i":4,"a":"agents-weekly-2026-09-11","e":"2026-09-11"},{"n":"Colinjqq/content-forecast","u":"https://github.com/Colinjqq/content-forecast","k":"skill","t":"контент","g":13,"s":47,"p":null,"d":"Выбор тем для автора от его опыта, а не от трендов: карта «что знаю я / что знают другие», разбор сценария, подсказки по съёмке и прогноз просмотров.","h":0,"f":null,"i":4,"a":"agents-weekly-2026-09-11","e":"2026-09-11"},{"n":"nevertoday/xxd-strip-ai-meta","u":"https://github.com/nevertoday/xxd-strip-ai-meta","k":"skill","t":"происхождение","g":7,"s":44,"p":null,"d":"Пакетная очистка метаданных изображений через ExifTool — C2PA / Content Credentials, следы gpt-image, EXIF, XMP, IPTC — без перекодирования пикселей. Автор сам ограничивает применимость: видимые и пиксельные водяные знаки не удаляются, «не использовать для введения в заблуждение».","h":0,"f":null,"i":4,"a":"agents-weekly-2026-09-11","e":"2026-09-11"},{"n":"songgoldenwind-crypto/liuyao-skills","u":"https://github.com/songgoldenwind-crypto/liuyao-skills","k":"skill","t":"предметная область","g":13,"s":38,"p":null,"d":"Гадание люяо (六爻) как набор Agent Skills для десятка агентов. Интересно не предметом, а журналом версий: каждая добавляет ограничения против того, чтобы модель перепрыгивала от символа сразу к итоговому выводу.","h":0,"f":null,"i":4,"a":"agents-weekly-2026-09-11","e":"2026-09-11"},{"n":"yjz211/vivid-figures-skill","u":"https://github.com/yjz211/vivid-figures-skill","k":"skill","t":"научная графика","g":2,"s":37,"p":null,"d":"Графики для научных работ и матмоделирования: 108 сохранённых рецептов, режимы expressive и restrained, проверщик и хелперы рендера.","h":0,"f":null,"i":4,"a":"agents-weekly-2026-09-11","e":"2026-09-11"},{"n":"Raymondhou0917/ai-level-check","u":"https://github.com/Raymondhou0917/ai-level-check","k":"skill","t":"наблюдаемость","g":5,"s":36,"p":null,"d":"Читает локальные логи Claude Code, Codex и Antigravity и пишет отчёт об уровне владения AI (LV0–LV5) с кейсами и трассируемостью: как человек формулирует, какие инструменты зовёт, как исправляет. Порядок зафиксирован: сначала что прочита g":13,"s":10,"p":null,"d":"Десять скиллов исследователя: статьи, научные рисунки, заявки на гранты, итерации до SOTA, публикация кода и данных.","h":1,"f":null,"i":4,"a":"agents-weekly-2026-09-11","e":"2026-09-11"},{"n":"NeoLabHQ/context-engineering-kit","u":"https://github.com/NeoLabHQ/context-engineering-kit","k":"plugin","t":"контекст-инжиниринг","g":3,"s":1689,"p":null,"d":"Маркетплейс из 13+ плагинов под разные способы вести работу: spec-driven, subagent-driven, TDD, ревью, reflexion, LLM-as-judge. Самая крупная по звёздам позиция каталога, но и самая старая: создан в ноябре 2025, за окно активности нет — пришёл через обсуждение на HN 04.09 (44 очка).","h":0,"f":null,"i":4,"a":"agents-weekly-2026-09-11","e":"2026-09-11"},{"n":"spotify/portal-ai-plugins","u":"https://github.com/spotify/portal-ai-plugins","k":"plugin","t":"маршрутизация","g":4,"s":1185,"p":null,"d":"Организация Spotify. Плагин shunt хуком PreToolUse перехватывает чтение файлов длиннее 350 строк и генерацию шаблонного кода и отдаёт их дешёвым воркерам, оставляя дорогой модели решения. Создан 23.07, в окно попал через инженерный пост (HN 04.09, 277 очков), где заявлено −90% расхода токенов — цифра авторская.","h":0,"f":null,"i":4,"a":"agents-weekly-2026-09-11","e":"2026-09-11"},{"n":"okf-memory/okf-agent-memory","u":"https://github.com/okf-memory/okf-agent-memory","k":"plugin","t":"память","g":3,"s":558,"p":null,"d":"Git-нативная память проекта по Google OKF v0.2 на чистом Go: BM25-поиск в памяти, встроенный stdio MCP-сервер, прогрессивное раскрытие. Создан 05.09, внутри окна; «минус 80% раздувания токенов» — цифра авторская. Вместе с Awesome-OKF ниже — признак того, что OKF за неделю превратился в формат памяти для агентов.","h":0,"f":null,"i":4,"a":"agents-weekly-2026-09-11","e":"2026-09-11"},{"n":"trailofbits/coop","u":"https://github.com/trailofbits/coop","k":"plugin","t":"песочница","g":7,"s":221,"p":null,"d":"Организация Trail of Bits. Rust CLI одноразовых микро-ВМ (Firecracker на Linux, Lima
