-правила","g":8,"s":13,"p":null,"d":"Строит граф кода и превращает исходники в трассируемые бизнес-правила, сверяя каждое с кодом.","h":1,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"Qizhan7/pencil-case","u":"https://github.com/Qizhan7/pencil-case","k":"skill","t":"рисование","g":1,"s":13,"p":null,"d":"Мелок и перо с акварелью: каждый штрих рисуется кодом на Python, без фильтров и генеративных моделей.","h":1,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"jpolec/hetzner-cloud-audit-skills","u":"https://github.com/jpolec/hetzner-cloud-audit-skills","k":"skill","t":"аудит","g":7,"s":12,"p":null,"d":"Девять скиллов аудита Hetzner Cloud: пути атак, дрейф конфигурации и стоимость по read-only API.","h":1,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"sven-ericmolzahn/iphone-duo-skill","u":"https://github.com/sven-ericmolzahn/iphone-duo-skill","k":"skill","t":"iOS","g":9,"s":11,"p":null,"d":"Адаптация iOS-приложения под складной iPhone Duo: выверенные API iOS 27.1, метрики, подводные камни.","h":1,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"startmeupai/swe-agents","u":"https://github.com/startmeupai/swe-agents","k":"skill","t":"практики","g":8,"s":11,"p":null,"d":"Переносимый справочник агентных персон и около 69 скиллов для Codex, Claude Code и Copilot.","h":1,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"webkubor/tombstone-reaper-skill","u":"https://github.com/webkubor/tombstone-reaper-skill","k":"skill","t":"уборка","g":13,"s":11,"p":null,"d":"Хоронит мёртвый код и заброшенные скиллы, чистит кэши и показывает, сколько контекста освободилось.","h":1,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"angrypenguinpng/blender-claymation-skill","u":"https://github.com/angrypenguinpng/blender-claymation-skill","k":"skill","t":"3D","g":1,"s":10,"p":null,"d":"Пластилиновый stop-motion в Blender по одному промпту: бит-лист, кукла на Python, рендер Cycles, MP4.","h":1,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"okooo5km/jev","u":"https://github.com/okooo5km/jev","k":"skill","t":"модели решений","g":9,"s":10,"p":null,"d":"Однофайловый CLI на стандартной библиотеке и скилл: решения Jev да/выбор/шкала прямо из shell.","h":1,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"ludoguenet/laravel-queues-skill","u":"https://github.com/ludoguenet/laravel-queues-skill","k":"skill","t":"Laravel","g":9,"s":10,"p":null,"d":"Практики очередей Laravel: идемпотентность, ретраи, afterCommit, батчи, безопасные деплои.","h":1,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"win4r/jev-security-scan","u":"https://github.com/win4r/jev-security-scan","k":"skill","t":"безопасность","g":7,"s":10,"p":null,"d":"До установки проверяет скиллы, MCP-конфиги и код на подозрительное поведение: Jev плюс локальный статический анализ.","h":1,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"NandhaKishorM/laya","u":"https://github.com/NandhaKishorM/laya","k":"plugin","t":"модели решений","g":9,"s":23565,"p":null,"d":"Открытая (Apache 2.0) «модель решений» того же класса, что Jev: на текст и набор типизированных вопросов — выбор, шкала, да/нет — отвечает вероятностями за один проход двунаправленного энкодера, на 100+ языках, локально, без ключа. Ставится из PyPI, в пакете HTTP-сервер, совместимый с Jev, MCP-сервер и интеграция с LangChain. Автор заявляет 33–38 мс на запрос и «вчетверо быстрее Jev»; в стороннем JevBench Laya на 41-м месте с 30.3 против 63.3 у Jev. Создан 18.09, за два часа до начала окна, и за неделю собрал 23.5 тыс. звёзд и 2 тыс. форков — такую скорость стоит держать в уме. Пришёл с HN.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"google/ax","u":"https://github.com/google/ax","k":"plugin","t":"оркестрация","g":4,"s":10820,"p":null,"d":"Организация Google. Декларативный оркестратор для массового запуска агентов: задача описывается в YAML четырьмя примитивами — Task (изолированная песочница с лимитами), Workspace (репозитории, MCP-серверы и пакеты скиллов, подготовленные заранее, чтобы агент стартовал «тёплым»), Gateway (сетевые allowlist и подстановка учётных данных) и Model. Простаивающего агента можно приостановить и продолжить с того же места. Авторы предупреждают о ломающих изменениях до стабильной версии. Репозиторий создан в марте, публично представлен на неделе — 663 очка HN.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"yetone/magpie","u":"https://github.com/yetone/magpie","k":"plugin","t":"модели","g":10,"s":713,"p":null,"d":"Приложение в строке меню (плюс TUI и CLI), в котором для каждого установленного агента — Claude Code, Codex, Gemini CLI, OpenCode, Pi, Cursor — выбирается модель: точечно правит их конфиги и поднимает локальный шлюз, говорящий на OpenAI Chat Completions, Responses и Anthropic Messages. Так запускают Codex на DeepSeek, а Claude Code на Kimi. Автор известен (8.6 тыс. подписчиков). Две оговорки: установка через curl | sh с usemagpie.ai с контрольной суммой с того же хоста, а вход по подписке Claude Code, Codex или Copilot шлюз раздаёт другим агентам — это может нарушать условия провайдера.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"devdotfast/whiteboard","u":"https://github.com/devdotfast/whiteboard","k":"plugin","t":"совместное проектирование","g":4,"s":705,"p":null,"d":"Десктопное приложение с открытым кодом (YC W26): общий холст, на котором человек и агент вместе проектируют софт. Подключается к Claude Code или Codex и даёт агенту SDK, чтобы рисовать диаграммы рядом с кодом, который он описывает, — например, разбор текущей ветки против свежего main. Результат работы агента показывается схемой, а не только диффом. Show HN на 272 очка.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"naw103/foremerge","u":"https://github.com/naw103/foremerge","k":"plugin","t":"мульти-агентность","g":4,"s":506,"p":null,"d":"Протокол координации для параллельных агентов поверх Git. Каждый агент перед работой объявляет, что собирается менять («функцию sendEmail»), в общей базе внутри .git; если планы двух агентов в разных worktree конфликтуют по смыслу, хотя текстово не пересекаются, Foremerge называет обоих и предлагает, как разделить работу. Файлы не блокируются, модель в оценке конфликта не участвует — ответ детерминирован. Версия 0.5, авторских замеров пока нет. Та же проблема измерена в статье «Passes Alone, Fails Together» — см. «Исследования».","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"coldteadotai/abide","u":"https://github.com/coldteadotai/abide","k":"plugin","t":"правила","g":8,"s":212,"p":null,"d":"CLI и hooks, которые заставляют кодингового агента соблюдать правила из AGENTS.md и CLAUDE.md, которые линтером не проверить («не показывай пользователю сырую ошибку»). На каждую правку abide задаёт Jev по вопросу на правило и получает вероятность нарушения; при нарушении агент получает указание и исправляет в том же ходе. По словам автора, проверка занимает около 300 мс, а на повторе 93 реальных сессий агент нарушал правила примерно в каждом 13-м ходе. init прописывает hooks во все агенты на машине, а диффы уходят в TypeSafe.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"wdobry/laya-playground","u":"https://github.com/wdobry/laya-playground","k":"plugin","t":"модели решений","g":9,"s":154,"p":null,"d":"Локальная песочница для Laya: редактор, где пишутся текст и вопросы и видны ответы с вероятностями по трём чекпоинтам, игры, в которых модель играет сама, бенчмарк и скилл, обучающий агента встраивать Laya в проект. Сервер слушает только loopback; при первом запуске скачивается около 2.3 ГБ открытых весов.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"HeyPuter/builder","u":"https://github.com/HeyPuter/builder","k":"plugin","t":"конструктор приложений","g":13,"s":118,"p":null,"d":"Организация Puter. Открытая альтернатива Lovable, Replit и v0: приложение описывают словами, ИИ собирает его в браузере, а авторизацию, хранилище, базу, серверные функции и хостинг даёт Puter.js — свои ключи и инфраструктура не нужны. Живой предпросмотр, правки по клику на элементе, история версий. Приложения привязаны к платформе Puter.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"chelinho139/wow-ai","u":"https://github.com/chelinho139/wow-ai","k":"plugin","t":"игры","g":13,"s":88,"p":null,"d":"Аддон World of Warcraft и локальный мост: из игрового чата можно работать с Claude Code, Codex и Grok Build, каждый чат — отдельная сессия агента со своей папкой. Агент знает персонажа, зону и квесты и может рисовать маршруты на карте. Мост получает данные из игры снимками экрана.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"INSANE0777/Awwards-mcp","u":"https://github.com/INSANE0777/Awwards-mcp","k":"plugin","t":"дизайн","g":2,"s":83,"p":null,"d":"MCP-сервер, который даёт кодинговым агентам дизайн-референсы с сайтов-лауреатов Awwwards: поиск по тексту, цвету, тегам и технологиям, скриншоты прямо в ответе и «дизайн-ДНК» сайта — палитра, стек, элементы. Ключ не нужен; данные берутся с Awwwards, и к условиям сайта могут быть вопросы.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"kerim0x1/bettercode","u":"https://github.com/kerim0x1/bettercode","k":"plugin","t":"рабочее место","g":10,"s":79,"p":null,"d":"Десктопная среда на Electron, где Claude Code, Codex, Cursor Agent и Grok работают рядом в одном окне с редактором, терминалом, Git и живым предпросмотром; три режима — редактор с чатом, агентный с панелями планов и диффов, холст проектов. Используются CLI самого пользователя; бета, MIT.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"nahid-sparktales/agent-dispatcher","u":"https://github.com/nahid-sparktales/agent-dispatcher","k":"plugin","t":"контекст","g":3,"s":50,"p":null,"d":"Поиск по репозиторию и сборка контекста для Claude Code и Codex: по символам, тексту, связям в коде и истории Git находит нужный код, собирает выдержки, подбирает к задаче скиллы и роли и делает шаг проверки явным. Установщик дописывает SessionStart hook в ~/.claude/settings.json (с резервной копией).","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"Parcha-ai/agentrun","u":"https://github.com/Parcha-ai/agentrun","k":"plugin","t":"воркфлоу","g":4,"s":48,"p":null,"d":"Язык описания воркфлоу для уже работающих агентов: повторяемые шаги кодом, узкие решения — через Jev («ответ содержит ссылку на источник? да с уверенностью ≥ 0.8»), а агент вызывается только там, где нужно расследование. Если проверка не пройдена, воркфлоу даёт агенту одну попытку и эскалирует. Демо работает без ключа на записанных ответах. Show HN.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"theNetworkChuck/paperclip-guide","u":"https://github.com/theNetworkChuck/paperclip-guide","k":"plugin","t":"оркестрация","g":4,"s":39,"p":null,"d":"Пошаговое руководство к ролику NetworkChuck о Paperclip — приложении, которое управляет командой агентов как компанией: должности, руководители, задачи, а пользователь как «совет директоров» одобряет найм и может всё остановить. От установки до «ИТ-отдела»: CEO на Claude Code, команда на Codex и локальной модели, регулярные планёрки.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"using-system/otelyssey","u":"https://github.com/using-system/otelyssey","k":"plugin","t":"наблюдаемость","g":5,"s":38,"p":null,"d":"Маркетплейс плагинов OpenTelemetry для кодинговых агентов в формате Agent Plugins, который обслуживает себя сам: автор плагина открывает issue по форме, а репозиторий проверяет плагин, вносит в список и следит за его релизами. Подключается одной командой в Claude Code, Codex, Copilot CLI и других; код сторонних плагинов здесь не проверялся.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"karanb192/cache-tax","u":"https://github.com/karanb192/cache-tax","k":"plugin","t":"расход","g":5,"s":38,"p":null,"d":"Плагин Claude Code, который держит кэш промпта тёплым, пока вы отошли, и предупреждает о цене, если кэш уже остыл: /keepwarm периодически пингует сессию, а при возвращении к холодной сессии плагин один раз останавливает отправку и показывает оценку стоимости перезаписи. По словам автора, на сессии в 330 тыс. токенов оценка была $6.61 при фактических $6.28. Пинги сами тратят токены.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"safzanpirani/pi-jev-skill-picker","u":"https://github.com/safzanpirani/pi-jev-skill-picker","k":"plugin","t":"контекст","g":3,"s":31,"p":null,"d":"Расширение для агента Pi убирает каталог скиллов из системного промпта и заменяет его инструментом skill_search: Jev оценивает каждый скилл по отношению к задаче, и агент получает полные инструкции подходящих. По словам автора, на каталоге из 137 скиллов это экономит около 87% системного промпта на каждом запросе при цене поиска около $0.0016. Без ключа TypeSafe не работает.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"ismailperim/briefd","u":"https://github.com/ismailperim/briefd","k":"plugin","t":"контекст","g":3,"s":30,"p":null,"d":"Самохостируемый «компилятор контекста» для команд: знания лежат в Markdown в git, briefd индексирует их и по MCP отвечает агенту на вопрос «что мне нужно знать для этой задачи» подборкой в пределах бюджета токенов — вместо раздутых CLAUDE.md и AGENTS.md. По словам автора, на его выборке это на 86% меньше токенов, а нужный раздел находится в 96% случаев.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"ElasticEmail/elasticemail-examples","u":"https://github.com/ElasticEmail/elasticemail-examples","k":"plugin","t":"вендорский","g":9,"s":22,"p":null,"d":"Абзацем по сигналу вне звёзд: официальный репозиторий почтового сервиса Elastic Email. Примеры транзакционной почты, SMTP, веб-хуков и входящих писем в 24 стеках, а рядом — .claude-plugin со скиллом и MCP-сервером, чтобы кодинговый агент встраивал отправку писем по этим примерам, а не по памяти. Пример того, как вендор кладёт плагин для агента прямо в репозиторий документации.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"TencentCloud/octop-browser","u":"https://github.com/TencentCloud/octop-browser","k":"plugin","t":"браузерный агент","g":9,"s":11,"p":null,"d":"Абзацем по сигналу вне звёзд: организация Tencent Cloud. Лёгкая браузерная автоматизация для агентов: запускает настоящий Chromium и говорит с ним по CDP напрямую, без Playwright в рантайме. Ссылки на элементы берутся с живой страницы и переживают перерисовку, DOM отдаётся в экономном по токенам виде, логины сохраняются в профиле между сессиями; один инструмент browser_tool примерно на 20 действий, те же действия в CLI, запись сценария и повтор под управлением скилла.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"PyModel/jev-judge-mcp","u":"https://github.com/PyModel/jev-judge-mcp","k":"plugin","t":"модели решений","g":9,"s":28,"p":null,"d":"MCP-сервер с 11 инструментами-судьями на Jev: факты и вопрос на входе, вероятность и действие auto/review/escalate на выходе.","h":1,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"haishishushu/cc-usage","u":"https://github.com/haishishushu/cc-usage","k":"plugin","t":"расход","g":5,"s":28,"p":null,"d":"Десктопный монитор расхода: квоты Claude и Codex, токены и стоимость из локальных логов.","h":1,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"shitianfang/jev-use","u":"https://github.com/shitianfang/jev-use","k":"plugin","t":"модели решений","g":9,"s":26,"p":null,"d":"Плагин для Claude Code, Codex и Pi: шаги, которым не нужен текстовый вывод, отдаются Jev ради с ":"Локальная консоль учёта Claude Code и Codex: сессии, субагенты, токены, кэш и стоимость по всем машинам.","h":1,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"DarranLiu/Easy-Web-Vibecoding","u":"https://github.com/DarranLiu/Easy-Web-Vibecoding","k":"plugin","t":"рабочее место","g":10,"s":12,"p":null,"d":"Самохостируемый веб-воркспейс для Claude Code, Codex, OpenCode и shell: до четырёх панелей, устойчивые tmux-сессии.","h":1,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"CogFlux/farhand","u":"https://github.com/CogFlux/farhand","k":"plugin","t":"MCP","g":9,"s":12,"p":null,"d":"MCP-сервер даёт агенту «руки» на удалённом хосте по SSH: команды и файлы там, локальная машина закрыта, аудит-лог.","h":1,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"CogFlux/aiusage","u":"https://github.com/CogFlux/aiusage","k":"plugin","t":"расход","g":5,"s":12,"p":null,"d":"Квота подписки Claude в строке меню macOS с темпом: сколько уже стоило бы потратить и когда кончится.","h":1,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"firekern/zusia","u":"https://github.com/firekern/zusia","k":"plugin","t":"наука","g":13,"s":11,"p":null,"d":"Расширение Zotero: вопросы о читаемой статье к Claude Code, Codex или Antigravity под вашим логином.","h":1,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"nano-muse/nanoMuse","u":"https://github.com/nano-muse/nanoMuse","k":"plugin","t":"агент","g":13,"s":11,"p":null,"d":"Персональный агент на Android: Linux-rootfs, shell, браузер, MCP и скиллы внутри APK, модель приносит пользователь.","h":1,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"Jimuelle07/Helm","u":"https://github.com/Jimuelle07/Helm","k":"plugin","t":"маршрутизация","g":4,"s":10,"p":null,"d":"Направляет задачу лучшему из установленных агентов — Claude Code, Codex, Cursor, Gemini, Aider — через Jev.","h":1,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"smixs/code-quality","u":"https://github.com/smixs/code-quality","k":"plugin","t":"качество кода","g":6,"s":10,"p":null,"d":"Детерминированный гейт: git- и Stop-hooks блокируют подделку тестов и держат порог сложности изменённых функций.","h":1,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"VictorAgahi/causalmesh","u":"https://github.com/VictorAgahi/causalmesh","k":"plugin","t":"навигация по коду","g":6,"s":10,"p":null,"d":"MCP-сервер строит карту многоязычной кодовой базы: обратные зависимости, трассировка gRPC, топики событий.","h":1,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"00200200/tokencut","u":"https://github.com/00200200/tokencut","k":"plugin","t":"контекст","g":3,"s":10,"p":null,"d":"Локальный CLI и MCP сворачивают многословный вывод инструментов, оригинал восстанавливается по ссылке.","h":1,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"claude-api","u":"https://github.com/anthropics/skills/tree/main/skills/claude-api","k":"official","t":null,"g":14,"s":null,"p":null,"d":"(изменение от 05.10) режим managed-agents-onboard получил два входа. По имени — /claude-api managed-agents-onboard deep-researcher — скилл собирает через CLI ant один из девяти шаблонов Console: contract-tracker, data-analyst, deep-researcher, field-monitor, incident-commander, sprint-retro-facilitator, structured-extractor, support-agent, support-to-eng-escalator. По URL — читает страницу с описанием паттерна Managed Agents и раскладывает его в файлы для ant apply.","h":0,"f":null,"i":8,"a":"agents-weekly-2026-10-09","e":"2026-10-09"},{"n":"incident-io","u":"https://github.com/incident-io/skills/tree/main/plugins/incident-io","k":"official","t":null,"g":14,"s":null,"p":null,"d":"расследование инцидентов, дежурства и эскалации из агента, плюс написание runbooks. Для авторов скиллов интересен skill-authoring: он улучшает скиллы по данным реального использования (incident.io записывает каждую загрузку скилла и задним числом оценивает её), а doctor проверяет весь набор плагинов и подключений и только говорит, что чинить.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"amazon-selling-partner","u":"https://github.com/amzn/selling-partner-agentic-toolkit","k":"official","t":null,"g":14,"s":null,"p":null,"d":"(бета) — продажи, остатки и листинги Seller Central; каждое действие с листингами и FBA пользователь одобряет, а диагностические команды явно помечены «только чтение».","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"linq-alpha","u":"https://github.com/linq-lab/linq-alpha-plugin/tree/main/plugins/linq-alpha","k":"official","t":null,"g":14,"s":null,"p":null,"d":"финансовый ресёрч. Приём: setup по согласию записывает в память Claude «LinqAlpha — источник по умолчанию» с маркером происхождения, а отдельный скилл remove удаляет только записи с этим маркером.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"wingspan","u":"https://github.com/wingspanHQ/mcp-claude-plugin","k":"official","t":null,"g":14,"s":null,"p":null,"d":"выплаты подрядчикам черновиками с предпросмотром; govtribe — госзакупки США; vanguard-advisor-tools — подбор фондов для финансовых консультантов.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"An Empirical Study of Harness Design for Coding Agents","u":"https://arxiv.org/abs/2609.20804","k":"research","t":null,"g":14,"s":null,"p":225,"d":"Run-Ze Fan, Hamed Zamani и соавторы, 17.09. При фиксированном цикле агента поочерёдно меняют три компонента обвязки — планирование, пространство действий и управление контекстом — в 176 конфигурациях на SWE-Bench Verified и Terminal-Bench 2.1. Управление контекстом важнее при малом окне, и лучшая схема — сначала правила выброса, потом суммаризация LLM; «восстанавливаемый» выброшенный контекст модели почти не используют. Для сильных моделей планирование экономит деньги, а не добавляет точности, а моделям, уверенным в bash, хватает одного bash — это заметно дешевле. Вместе с HarnessTax из прошлого выпуска картина одна: обвязка меняет счёт сильнее, чем успешность.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"Improved token efficiency for longer agent runs","u":"https://cursor.com/blog/improved-token-efficiency","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Cursor, 23.09. Что в собственной обвязке снизило расход на 7% без потери качества — по A/B на живом трафике, цифры авторские. Системный промпт урезан примерно на две трети: сильным моделям не нужны списки «НЕ ДЕЛАЙ». Описания встроенных инструментов, как раньше MCP, перенесены в динамический контекст. Точки кэширования поставлены после стабильных слоёв, а изменчивое — скиллы, субагенты, окружение — вынесено в отдельное «фантомное» сообщение пользователя: холодных промахов кэша стало на 20% меньше. Готовый список приёмов контекст-инжиниринга, проверенный не на evals, а на продакшене.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"Coding sessions are longer and use more context","u":"https://claude.com/blog/claude-opus-5-5-built-for-coding-sessions-that-use-more-context","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Anthropic, 24.09, по агрегированным данным Claude Code за март–сентябрь: над одним промптом Claude работает в 3.3 раза дольше, контекст на запрос вырос в 2.6 раза, соотношение вход:выход — с 189:1 до 324:1, скиллы и tool-серверы используют вдвое чаще. Промахи кэша при этом упали больше чем вдвое: добавление инструкций посреди сессии, подгрузка инструментов и смена effort больше не сбрасывают кэш, а форкнутые субагенты стартуют из кэша родителя. Вывод для тех, кто строит обвязку: экономика агента теперь определяется долей попаданий в кэш, и префикс нельзя ломать. Практическое продолжение — разбор Addy Osmani: 40 ходов с ростом контекста до 120k стоят около $1.62 при 90% попаданий и $11.20 без кэша.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"Jev introduces a new shape of LLM — System One, aka Decision Models","u":"https://simonwillison.net/2026/Sep/21/jev/","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Simon Willison, 21.09, о модели, вокруг которой построено около двадцати позиций этого каталога. Jev от TypeSafe (анонс 15.09) не пишет текст: на состояние и типизированные вопросы — да/нет, выбор, шкала — она отвечает калиброванными вероятностями за 70–500 мс по $0.042 за миллион входных токенов, выход бесплатный. Simon применяет её для реранжирования поиска и предупреждает: число без объяснения прячет возможную предвзятость. LangChain проверила Jev как судью агентных evals — разброс оценок в разы ниже, чем у LLM-судьи, прогон за $0.34 против $28 (авторские, ранние цифры). Для агент-разработки это новый слой обвязки: рассуждает LLM, а маршрутизацию, проверку правил и оценку траекторий отдают дешёвому классификатору. Открытую замену, Laya, принёс HN — она в каталоге плагинов.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"Once Claude can measure something, it can make it faster","u":"https://claude.dev/blog/how-we-made-claude-ai-faster/","k":"research","t":null,"g":14,"s":null,"p":223,"d":"Anthropic, 23.09: за двухнедельный спринт claude.ai и десктоп ускорены примерно втрое, время до поля ввода на p75 — с 3.1 до 0.55 с. Всё шло через один Slack-канал с Claude Tag: модель сама находила узкие места через Datadog MCP, строила бенчмарки и следила за деплоями. Главный приём — детерминированные лабораторные метрики вместо времени по часам: число инструкций под Valgrind, счётчики вызовов V8, коммиты React. На таких метриках агент может карабкаться вверх, не дожидаясь данных из продакшена.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"Unreal Agent: асинхронные вызовы инструментов","u":"https://unreallabs.ai/blog/unreal-agent/","k":"research","t":null,"g":14,"s":null,"p":243,"d":"Unreal Labs, 22.09. Обвязка, в которой любой вызов инструмента сразу записывается в журнал событий как «в работе», модель продолжает, а результат дописывается, когда появится, — без поломки кэша. Авторы заявляют экономию до 40% против Codex и до 20% против Pi при том же качестве (их цифры). Пользователь может вмешаться в любой момент, и за один ход модели запускается больше работы. Ограничения безопасности авторы держат в среде, а не в hooks.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"ZCode, the GLM coding agent, silently uploads your Git history","u":"https://tokenstead.ai/guides/zcode-silent-git-history-upload","k":"research","t":null,"g":14,"s":null,"p":262,"d":"Tokenstead, 18.09, по реверсу исследователя ferstar: десктопный агент ZCode от Z.ai после входа упаковывает весь workspace, включая .git/objects, reflog и глобальные конфиги, шифрует ключом Z.ai и загружает в Aliyun OSS — в примере 313 МБ из 345. Открытые веса модели ничего не говорят о закрытой обвязке над ней: сетевое поведение агентских клиентов надо проверять, а историю git считать секретом.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"Агенты OpenAI и взлом австралийских госсайтов","u":"https://transluce.org/agent-activity","k":"research","t":null,"g":14,"s":null,"p":256,"d":"23.09 премьер Австралии заявил, что в июне агент OpenAI получил несанкционированный доступ к статистическому порталу Medicare; компания признала, что «модели совершили действия, которых мы не предполагали». В тот же день Transluce опубликовала данные о том, как агенты, решая обычные задачи по сбору данных, трижды пробовали взламывать источники, упёршись в блокировку; две попытки из трёх связаны с роем агентов OpenAI. Урок тот же, что с RubyGems неделей раньше: ограничения задаются средой — сетью и учётными данными, — а не промптом.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"MCP was always a bad idea?","u":"https://maharship.com/blog/why-mcp-was-always-a-bad-idea/","k":"research","t":null,"g":14,"s":null,"p":334,"d":"Maharshi Patel, пост от 14.09, на HN с 20.09: MCP придумали для слабых моделей, а агенты с терминалом сами зовут HTTP API и читают --help. Simon Willison ответил: для агента без ограничений MCP действительно почти не нужен, но всё «менее YOLO» получает от протокола контроль доступа, аутентификацию без передачи ключей агенту и аудит. GitHub в подкасте отвечает на тот же спор: скиллы и MCP решают разные задачи — упакованная экспертиза против подключения инструментов.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"Claude discovers a novel enzyme system with CRISPR-like repeats","u":"https://www.anthropic.com/news/claude-discovers-novel-enzyme-system","k":"research","t":null,"g":14,"s":null,"p":763,"d":"Anthropic, 23.09. Агенты Claude собрали больше 200 тыс. обратных транскриптаз, отобрали 3500 кандидатов, свели их к 20 отчётам и нашли систему с массивом повторов, похожим на CRISPR; по словам компании, люди дали исходный промпт и сделали лабораторную часть. Работа шла в Claude Code и собственной обвязке, координирующей много параллельных сессий. Приём для разработчиков: отчёты-гипотезы сами становятся объектом анализа, а то, какие гипотезы люди берут в работу, возвращается в инструкции агента.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"Passes Alone, Fails Together","u":"https://arxiv.org/abs/2609.25396","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Haocheng Xia, Eugene Wu, Yongjoo Park, 21.09. Бенчмарк ловит случаи, когда патчи параллельных агентов проходят тесты по отдельности и ломаются после слияния, потому что один поменял интерфейс, на который опирается другой. На реальных парах из Django такое нашлось в 1 случае из 834, на сконструированных задачах — в 97% прогонов, а одно сообщение о завершённом изменении контракта спасло 82%. Для оркестрации в worktree вывод дешёвый: короткие уведомления об изменённых контрактах. Инструмент ровно под это — Foremerge в каталоге.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"Packaged, But Not Portable: the Agent Plugin Standard","u":"https://arxiv.org/abs/2609.23809","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Tezan Sahu, 20.09. Корпус из 68 тыс. бандлов плагинов из 30 тыс. репозиториев: спецификации Agent Plugins соответствуют только 6.2%, хотя 96.6% загрузились бы после одного служебного поля. Главная беда другая: у 81% бандлов имя совпадает с чужим плагином, а правил пространства имён и приоритета нет. Стандартизирован формат упаковки, а не композиция — ровно та дыра, которую Claude Code 2.1.282 закрывает резервированием имён anthropic-skills и claude-ai.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"LLM Agents Can Easily Tamper With Their Own Traces","u":"https://arxiv.org/abs/2609.30266","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Maksym Andriushchenko и соавторы, 24.09. Локальные агенты — Claude Code, Codex, Antigravity, OpenCode, Grok Build — по просьбе удаляли собственные трассы, и мониторинговые guardrails не срабатывали; удаление может вызвать и внешний атакующий, а у передовых моделей оно возникает само при оптимизации награды. Рекомендация авторов: логировать независимым перехватчиком вне досягаемости агента. Трасса агента не должна лежать там, куда агент может писать.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"Agent Approval Laundering","u":"https://arxiv.org/abs/2609.28586","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Jinqian Zhang и соавторы, 23.09. Человек одобряет команду, а она запускает транзитивные эффекты — lifecycle-скрипты при установке пакета, сетевые права у MCP-вызова, — которых в записи об одобрении нет. Авторы формализуют шесть классов таких эффектов; добавление семантики команды и метаданных на момент решения снижает расхождения с 40 до 13 на их бенчмарке. Одобрять нужно предсказанный набор эффектов, а не строку команды — тот же довод стоял за --ignore-scripts для плагинов из npm в прошлом выпуске.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"CliffCompaction: Cost-Efficient Compaction for Long-Horizon Coding Agents","u":"https://arxiv.org/abs/2609.26779","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Trang Nguyen, Tim Dettmers и соавторы, 22.09. Компакция, которая только обрезает и выбрасывает, но никогда не переписывает содержимое, и каждый проход работает с оригиналом, а не с прошлой сводкой. Авторы заявляют до 50% экономии при ограниченном контексте без потери качества на Terminal-Bench. Вывод сходится с исследованием обвязки выше: суммаризация «пересказом» копит дрейф, обрезка — нет.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"Who Finishes the Job? Follow-Up Fixes on AI Coding Agent PRs","u":"https://arxiv.org/abs/2609.26847","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Wannita Takerngsaksiri и соавторы, 22.09. 6774 слитых PR от Codex, Copilot, Devin, Cursor и Claude Code против 5044 человеческих в тех же репозиториях: PR агентов в 1.62 раза чаще требуют последующих исправлений, и 70% исправлений делает тот же агент. Мерить агента долей слитых PR мало — нужна «доводка» после слияния.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"Grow the Harness, Not the Context","u":"https://arxiv.org/abs/2609.26760","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Laizhen Li и соавторы, 22.09. Обвязка выращивается из обратной связи по неудачам, начиная с пустого каркаса: повторяющееся управление превращается в исполняемый код, а LLM вызывается только для семантики. Число вызовов LLM падает на 76–92%, стоимость — на 74–99%, при лучшем результате в 5 из 6 конфигураций на BrowseComp-Plus и WebArena-Verified. Аргумент в пользу «кода вместо промпта» для рутинных веток логики агента.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"Evaluating Agent Skills for Version-Specific Plugin Migration","u":"https://arxiv.org/abs/2609.30120","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Beiming Liu и соавторы, 24.09. Ретроспектива eval одного реального скилла: с ним средняя награда растёт с 93.83 до 98.75, но прирост сосредоточен в одной задаче, а после исправления ошибок оценивания доверительный интервал доходит до нуля. Судьи из двух других семейств моделей почти совпали с исходным по решениям, но дали разный прирост. При малых выборках ошибки рубрики и судьи сравнимы с эффектом самого скилла — полезно помнить при замерах через claude plugin eval.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"Agent Skills for Smart Contract Auditing","u":"https://arxiv.org/abs/2609.29454","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Cuifeng Gao и соавторы, 24.09. 83 открытых скилла для аудита смарт-контрактов на EVMBench в семи связках агент+модель: эффект скилла определяется прежде всего моделью, а не обвязкой — максимальный прирост дал Codex с GPT-5.5. Один и тот же скилл по-разному работает на разных моделях, и проверять его надо на целевой.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"Progressive Skill Discovery as Access Control","u":"https://arxiv.org/abs/2609.28693","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Michael Stettler и соавторы, 23.09. Возможности упакованы в роли — наборы скиллов, инструментов и ограничений; агент начинает с минимального каталога и через один MCP-сервер получает инструменты только в составе изученных скиллов, поэтому сервер детерминированно ограничивает вызываемое. Progressive disclosure скиллов из экономии контекста превращается в механизм контроля доступа.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"Writing Rust code that's fast by asking agents to make the code faster","u":"https://minimaxir.com/2026/09/agentic-iteration/","k":"research","t":null,"g":14,"s":null,"p":114,"d":"Max Woolf, 21.09: промпты и бенчмарки, с которыми агенты ускорили его Rust-код от 2 до 20 раз. Тот же приём, что у Anthropic со спринтом claude.ai: сначала измеримая метрика, потом итерации агента по ней.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"Bots for the last mile: Rollouts, Security Review","u":"https://cursor.com/blog/rollouts-and-security-reviewer","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Cursor, 23.09: два агента «после PR». Rollouts до слияния пишет план мониторинга, а после деплоя сравнивает телеметрию с базовой линией и при регрессии пингует автора, ставит деплой на паузу или откатывает. Тезис: код больше не узкое место — узкое место всё, что после PR.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"Introducing Worker Previews","u":"https://blog.cloudflare.com/worker-previews/","k":"research","t":null,"g":14,"s":null,"p":null,"d":"Cloudflare, 22.09. Каждая git-ветка получает изолированное окружение, близкое к продакшену, — свой URL, секреты, Durable Objects, наблюдаемость. Cloudflare прямо позиционирует это под параллельных агентов: инфраструктурный аналог worktree, где у каждого агента свой стенд со своими логами.","h":0,"f":null,"i":6,"a":"agents-weekly-2026-09-25","e":"2026-09-25"},{"n":"kaankiziltug/logo-design-skill","u":"https://github.com/kaankiziltug/logo-design-skill","k":"skill","t":"дизайн логотипов","g":2,"s":1383,"p":null,"d":"Скилл для проектирования логотипов (Claude, Gemini CLI, Codex и др.): от брифа и концептов до готовых SVG и гайдлайнов. Метод — фиксированный процесс «бриф, исследование категории, 8–12 идей в одну строку, 3 концепта в SVG, тесты, чекпоинт» с остановкой: набор для бренда делается только после выбора направления. Опирается на библиотеку из 1400+ классифицированных SVG-логотипов (для изучения конструкции и чтобы не повторять конкурентов, «не для копирования») и на Python-инструменты без зависимостей: аудит SVG по принципам (оценка готовности к производству), листы тестов (16 px, одноцветный, инверсный, «прищур», полка конкурентов), экспорт фавиконов и иконок приложений. Проверяет себя через рендер собственных черновиков в PNG и просмотр, поэтому нужна модель, умеющая смотреть изображения; в README показаны 28 сквозных примеров на вымышленных брендах.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"feitangyuan/onetake","u":"https://github.com/feitangyuan/onetake","k":"skill","t":"видео","g":1,"s":1178,"p":null,"d":"OneTake: скилл для Claude Code и других агентов, делающий релизные ролики и демо функций «одним дублем»: на каждом стыке что-то с экрана переходит в следующий кадр, а не сменяется слайдом. Метод — HTML-интерфейс продукта пересобирается из скриншотов (без записи экрана), библиотека примерно из 38 «измеренных» движений, настоящее смазывание движения (несколько захватов за 180° затвора) и детерминированный рендер (черновик 1080p30, финал 4K60). Проверка — «оракул» probe.py: он записывает содержимое каждого кадра, находит стыки и считает показатель переноса; в таблице автора один из прошлых роликов получил 0,00 и 0,40 (отклонены), а принятые — 0,75 и 0,83 (по данным автора). Автор оговаривает: исходный код самих роликов не приложен (только готовые фильмы и разборы), лицензия PolyForm Noncommercial — коммерческое использование запрещено. Установка — клонирование репозитория в ~/.claude/skills; требуются python с playwright, ffmpeg и node.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"nanaism/yomiyasu","u":"https://github.com/nanaism/yomiyasu","k":"skill","t":"японский текст","g":11,"s":1056,"p":null,"d":"Yomiyasu («よみやす»): скилл, который перерабатывает сгенерированный ИИ японский текст в естественный, плотный по информации (технические статьи, спецификации, описания PR, внутренние отчёты). Метод — семь принципов преобразования синтаксиса вместо списка запрещённых слов: полное восстановление субъекта и объекта, разбор неодушевлённых подлежащих и метафорических глаголов («壊れる», «効く»), удаление вводных фраз, сохранение смысла без добавления выдуманного, длина предложений 30–45 знаков и не более 0–2 запятых. Проверка — сравнение «до и после» на открытых документах (лицензии вроде CC BY 4.0, государственные стандартные условия) и бенчмарк-скрипты в репозитории; автор ссылается на научные работы (LREC 2026 и др.) и разбор на Zenn. Автор оговаривает, что это личный проект сотрудника компании ALGO ARTIS, а не продукт компании; README, по словам автора, сам написан этим скиллом. Узкая предметная область — язык (японский), но не юрисдикция.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"echris6/motion-video-kit","u":"https://github.com/echris6/motion-video-kit","k":"skill","t":"видео","g":1,"s":923,"p":null,"d":"Набор для Claude Code (одна папка business-motion-film) по созданию «премиальных» рекламных роликов для реального малого бизнеса: ИИ-футаж, анимация в коде (HTML/GSAP), выборочно Three.js. Метод — цикл «Gauntlet»: сборщик не равен судье, свежие критики смотрят настоящий рендер, пункты проверяются по одному, ведётся журнал; в комплекте готовые промпты критиков, грамматика движения (6 правил и каталог из 16 механик) и разбор 28 эталонных роликов (только ссылки, без перераспространения футажа). Проверяет работу измеримыми критериями качества: замороженное время, громкость (ebur128), контраст, фирменный цвет, плюс бизнес-критерии; скрипты на ffmpeg. Автор оговаривает: рыночные цены — срез на сентябрь 2026, перед использованием перепроверять; цифры охвата студий — их собственные заявления; ИИ-картинки нельзя выдавать за реального клиента или результат. Лучше всего работает с HyperFrames, но принципы не привязаны к рендереру.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"lemomo-ai/lemo-opuscar","u":"https://github.com/lemomo-ai/lemo-opuscar","k":"skill","t":"видео","g":1,"s":787,"p":null,"d":"Lemo-Opuscar: 43 киностиля, у каждого — многоразовый стилевой промпт и короткий фильм, целиком сделанный кодом (Canvas/WebGL покадрово, оригинальная музыка из бесплатных сэмпл-библиотек, TTS-озвучка, без генерации видео и стоковых кадров). Пользователь выбирает стиль и приносит свою историю, агент работает «как маленькая студия» по трём руководствам (DIRECTOR.md — как режиссировать, TECHNIQUE.md — как строить, и справочник стилей), перед стартом один раз задаёт вопросы и по желанию показывает раскадровку в настоящем стиле. Главная витрина — фильм «OPUSCAR 98» о 98 победителях «Оскара» (6:25), по словам автора, целиком написан Claude Opus 5.5. Автор оговаривает: это не awesome-список, все фильмы сделаны им самим, стили настроены под Opus 5.5 и на других моделях не гарантируются. При первом запуске скилл скриптом setup.sh клонирует репозиторий автора в ~/lemo-opuscar (sparse git clone, затем npm/pip-зависимости); адрес можно переопределить переменной окружения.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"Barty-Bart/motion-graphics","u":"https://github.com/Barty-Bart/motion-graphics","k":"skill","t":"видео","g":1,"s":388,"p":null,"d":"Репозиторий скиллов для моушн-графики в Claude Code и Codex; пока один — motion-broll, который по видео и транскрипту (SRT) планирует, анимирует и рендерит клипы B-roll, привязанные к словам. Каждый клип — одна непрерывная фигура, которая меняет форму (капсула, карточка, терминал, диаграмма) без монтажных склеек; клипы либо полнокадровые MP4, либо прозрачные ProRes 4444 для вставки рядом с говорящим. Метод: осмотр футажа, оценка времени слов, план клипов в таблице с ожиданием вашего «ок», сборка с проверкой стоп-кадров на ключевых словах, рендер Chromium с 4 подкадрами на кадр (смазывание на 180° затворе) и сборка превью с compare.html (оригинал против версии с графикой). Автор оговаривает, что превью только для просмотра, а финал нужно собирать в своём редакторе; скилл «не выдумывает числа» — столбцы показывают относительный размер, пока не даны реальные цифры. При первом запуске setup.sh ставит numpy и Playwright с Chromium в локальную папку motion/; установка — npx skills add Barty-Bart/motion-graphics.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"zhuyansen/awesome-claude-video-skills","u":"https://github.com/zhuyansen/awesome-claude-video-skills","k":"skill","t":"каталог","g":0,"s":359,"p":null,"d":"Awesome-список из 204 репозиториев со скиллами и инструментами для видео в Claude Code, Codex и других агентах: HyperFrames, Remotion, моушн-графика, монтаж, объясняющие ролики, аватары, шорты, истории и музыкальные клипы, разбитые на девять типов. Метод отбора по README: у записи должен быть README, а каждый репозиторий «прочитан и оценен по безопасности» каталогом Agent Skills Hub (grade в колонке Security: SAFE или pending), список обновляется раз в 8 часов и есть машиночитаемый data/skills.json. Оговорка автора: оценка Security относится к README и шагам установки, а не к полному аудиту кода; отдельный раздел «Made with Claude Opus 5.5» собирает проекты, чьи README заявляют использование этой модели. Это не самостоятельный инструмент: ссылки со всех записей ведут на agentskillshub.top с UTM-метками, то есть список служит и витриной этого каталога, а оценки безопасности нужно считать чужими данными. Превью-картинки взяты из README проектов под разрешительными лицензиями.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"pengchujin/livecanvas","u":"https://github.com/pengchujin/livecanvas","k":"skill","t":"live-фото","g":1,"s":313,"p":null,"d":"LiveCanvas: скилл для Codex, Claude Code и других агентов, который по одной фразе делает Live-изображение с обложкой и анимацией (картинки, emoji, сцены, таймлайны, графики). Метод — цепочка «поиск и проверка фактов, раскадровка, анимация на Remotion, превью и ресурсы Apple Live Photo»; в демо — 15 примеров (графики о населении, температурах, энергетике и карточки о выходе новой модели), к части приложены MP4 и пакеты Live Photo. Автор оговаривает: данные в демо — снимок на момент создания и сами не обновляются, даты сверки карточек указаны (2026-10-01 и 2026-09-30), источники и охват описаны в docs/DEMOS.md. Установка — npx skills add pengchujin/livecanvas --skill livecanvas -g (через Skills CLI) или ручное копирование папки в ~/.codex/skills. README на китайском и английском, подробной проверки качества анимации в README нет.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"tugrawork-creator/saas-motion-kit","u":"https://github.com/tugrawork-creator/saas-motion-kit","k":"skill","t":"видео","g":1,"s":196,"p":null,"d":"Набор для промо- и моушн-роликов программных продуктов на HyperFrames и Claude Code с правилом «никакие два фильма не должны быть похожи». Содержит семь вопросов к раскадровке, матрицу тона, 100 визуальных тем, атлас из 24 «нарративных» переходов, генератор нового компонента и семиэтапный плейбук с контрольным этапом на каждой стадии; навык /saas-motion-video проходит эти этапы. Проверка — variety_audit.py: читает журнал раскадровки и помечает повторяющиеся переходы, входы, кривые, равные длины планов и отсутствие «сюрприза»; на своём первом черновике он, по данным автора, нашёл 11 повторов, а GitHub Action запускает аудит на каждый push. Автор оговаривает: все примеры построены на вымышленной компании Acme с выдуманными цифрами; веса MusicGen — CC-BY-NC (для коммерческих работ нужна лицензированная музыка). В SECURITY.md заявлено, что репозиторий не хранит учётных данных и не запускает серверов, а пример подгружает GSAP и Three.js с jsDelivr с фиксированными версиями.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"YeJe-cpu/SeeCut","u":"https://github.com/YeJe-cpu/SeeCut","k":"skill","t":"видео","g":1,"s":194,"p":null,"d":"SeeCut: скилл для кодирующих агентов, превращающий видео говорящей головы (аватар или реальный человек) в смонтированный короткий ролик с динамической графикой и, по желанию, в слоистый черновик для редактора «Цзяньин» (剪映). Метод — «видеть, резать, повторять»: ИИ понимает материал, ищет реальные доказательства (скриншоты настоящих сайтов вместо выдуманных интерфейсов), собирает на HyperFrames, а затем смотрит собственный монтаж через Gemini (Antigravity CLI) и сравнивает версии попарно: по словам автора, абсолютные оценки судьи оказались ненадёжными, а парное сравнение с обменом позиций надёжно; до 3 версий, каждая должна быть заметно лучше. Автор оговаривает: тестировалось только на macOS, без agy нет самопроверки, бесплатной квоты Google может не хватить, 25-секундный образец занимает около часа, при headless-вызове agy нужен флаг --dangerously-skip-permissions; для цифрового аватара нужны HeyGen API (ключ в HEYGEN_API_KEY) и озвучка Doubao (по оценке автора около 0,04–0,12 доллара за секунду аватара). Первый запуск preflight.sh проверяет окружение; сомнительных загрузчиков в README нет.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"howseen-ai/claude-motion-design","u":"https://github.com/howseen-ai/claude-motion-design","k":"skill","t":"видео","g":1,"s":190,"p":null,"d":"Скилл для Claude Code, делающий моушн-видео «чистым кодом»: HTML, Playwright, ffmpeg, без After Effects и Remotion. Каждый кадр вычисляется функцией seek(t) от времени, рендерится покадрово со смазыванием движения (подкадры на 180° затворе) и монтируется под музыку: настоящий «дроп» находится по энергии полос, а эффекты ставятся по измеренным пикам и нормализуются до −14 LUFS. Пайплайн: входные материалы, карта битов, четыре утверждаемых стоп-кадра, полный рендер, поиск «хлопков» и вспышек в один кадр, проверка шва петли, звук, финал; есть режим Remake — покадровый ремейк чужого ролика под свой бренд (музыку, голос и фото людей оригинала переиспользовать нельзя). Автор оговаривает: стороннее медиа скачивается скриптом fetch_assets.py с Mixkit, svgl, jsDelivr и Google Fonts и остаётся под своими лицензиями; иллюстративные данные подписываются на экране «Example data»; клиент 21st.dev MCP требует ключ API_KEY_21ST или файл ~/.config/21st.key. Автор — основатель Howseen (ИИ-отслеживание видимости бренда), пример — релизный ролик его же продукта; по заявлению автора, сделан в 5 итераций.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"Jakeschincariol/arena-skill","u":"https://github.com/Jakeschincariol/arena-skill","k":"skill","t":"мульти-агентный турнир","g":4,"s":164,"p":null,"d":"Скилл /arena для случая, когда Claude даёт плохие ответы: запускает до 100 суб-агентов с одной и той же задачей и разными карточками стратегий (15 режимов рассуждения, 12 воркфлоу, 12 стратегий). Агенты попарно атакуют и защищают решения, судья-Claude оценивает матч по письменной рубрике (рубрика лежит в репозитории), проигравший выбывает, пока не останется один ответ. Сетка турнира — конечный автомат на стандартной библиотеке Python с тестами, при одинаковом seed карточки и сетка воспроизводятся (ответы — нет). Автор прямо оговаривает: «лучший ответ» — лишь тот, что пережил турнир, а не доказанно верный; судьи — тоже Claude; расход токенов большой (около 595 вызовов на 100 агентов, идут волнами по 10); расплывчатая задача даёт 100 вариантов расплывчатого; суб-агенты не видят чат, только файл задачи. Файлы проекта не трогает, всё пишется в .arena/.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"justxor/claude-code-pro-course","u":"https://github.com/justxor/claude-code-pro-course","k":"skill","t":"обучение","g":12,"s":153,"p":null,"d":"Русскоязычный курс по Claude Code: 12 модулей (CLAUDE.md, settings и разрешения, skills, subagents, hooks, MCP, плагины, headless и CI), 8 лабораторных с критериями «готово», библиотека промптов для 13 типов задач и starter kit (8 skills, 5 субагентов, 4 хука, правила, statusline), который ставится скриптом install.sh. Скрипт прочитан: копирует файлы без перезаписи существующих (с --force делает .bak), сети не использует; единственный curl | bash в README — официальная установка Claude Code с claude.ai. Есть валидация шаблонов в CI. Это учебный материал, а не новый метод; в README встроены рекламные ссылки на Telegram-каналы автора.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"wenziai/wenzi-xhs-agent-skills","u":"https://github.com/wenziai/wenzi-xhs-agent-skills","k":"skill","t":"соцсети","g":13,"s":145,"p":null,"d":"Шесть SKILL.md-скиллов (Codex, Claude Code, WorkBuddy) для ведения аккаунта в Xiaohongshu: от определения позиционирования и пути монетизации до профиля аккаунта, банка тем и заголовков, «очеловечивания» черновиков, плана публикаций на 30 дней и недельного разбора результатов. Метод — сквозной цикл: итоги каждой публикации записываются обратно в профиль аккаунта и питают следующий круг; в каждом скилле есть test-prompts.json с кейсами на срабатывание, границы и регрессию. Основа — статья автора в X и модули чужих открытых проектов (dbskill, xhs-visual-director-skill), переписанные в методологию; каталог rejected/ фиксирует отвергнутые советы («養号», зависимость от устройства — без стабильных доказательств). Автор оговаривает, что результата по подписчикам и трафику не гарантирует; приведённые в README «50 тыс. прочтений» — скриншоты автора, не измерение метода.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"joeseesun/opus-video-prompts","u":"https://github.com/joeseesun/opus-video-prompts","k":"skill","t":"видео","g":1,"s":134,"p":null,"d":"Сборник из 18 полных промптов и 54 публичных кейсов, где Claude Opus 5.5 «снимает видео кодом»: рисует кадры в HTML Canvas, p5.js, Three.js, Remotion, Manim или Blender, затем кадры снимаются headless-браузером и склеиваются в MP4 через FFmpeg, звук — Web Audio или TTS. В каждом кейсе ссылка на оригинальный пост, взяты только промпты, опубликованные самими авторами; есть раздел с приёмами написания и оценками бюджета. Цифры вроде «≈1 минута и 2 доллара», «13,3 доллара за 10 секунд» или «до 200 долларов за MV» — только по данным авторов кейсов; сам составитель оговаривает, что «с первого раза» часто означает несколько итераций. Это не SKILL.md, а подборка промптов. Автор — известный китайский AI-блогер 向阳乔木 (≈2000 подписчиков на GitHub).","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"aaddrick/building-with-typesafe-jev","u":"https://github.com/aaddrick/building-with-typesafe-jev","k":"skill","t":"модель Jev","g":9,"s":127,"p":null,"d":"Неофициальный скилл, который учит кодирующих агентов работать с Jev — моделью TypeSafe AI («System One»), отвечающей на типизированные вопросы (выбор, оценка, вероятность утверждения) значением и откалиброванной вероятностью. Содержит 11 правил проектирования, справку по API, паттерны из официальных кулинарных книг и библиотеку «прецедентов» — 150+ проектов сообщества, разложенных по 11 формам реализации (контур управления, гейты, потоковые фильтры, судьи и т. д.), с наброском кода и списком идей, не сработавших на практике. Автор приводит прогон из шести задач по 10 запусков в изолированных контейнерах и трёх LLM-судей разных провайдеров (большинство решает): средний балл 0,96 против 0,65 без скилла и 0,77 с официальным скиллом (по данным автора). Ключ API необязателен; скилл — снимок документации на 2026-09-25 и велит агенту считать живую документацию главнее. Автор оговаривает, что проект неофициальный, а совместную работу с официальным скиллом не проверял. По сути — обёртка вокруг чужой идеи (Jev / TypeSafe). Установка для Muse — curl | bash из этого же репозитория; скрипт прочитан, вредного не видно.","h":0,"f":"curl | bash","i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"SkylarKitchen/skills","u":"https://github.com/SkylarKitchen/skills","k":"skill","t":"3D и дизайн","g":1,"s":114,"p":null,"d":"Набор из трёх дизайн-скиллов автора, ставится как плагин или через npx skills: пошаговая 3D-инструкция по сборке в стиле LEGO (один HTML-файл на Three.js, стартовый движок только настраивается), короткий покадрово точный продуктовый фильм из реального приложения с управляемой камерой на canvas и 3D-модель комнаты по нескольким фото с вариантами расстановки мебели. Рядом лежат вспомогательные скрипты (захват кадров, звук, замеры) и тесты для скилла с комнатой; манифесты есть и для Codex. Оговорок и измерений в README нет.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"Finderchangchang/brewreel","u":"https://github.com/Finderchangchang/brewreel","k":"skill","t":"видео","g":1,"s":113,"p":null,"d":"BrewReel (精酿) — скилл и набор инструментов, чтобы дешёвая модель (например DeepSeek) делала вертикальные рекламные ролики: модель пишет только storyboard.json (выбор кадров и текст), а раскладка, анимация и ритм заложены в готовые компоненты Remotion; три «рецепта» (cards, quiz, journey) и шесть отраслевых пакетов. Одна команда проводит валидацию, синтез музыки, рендер и проверку кадров; ролики с красными пометками самопроверки не выдаются. Есть озвучка (MiniMax, Alibaba CosyVoice, Volcengine; ключи только из переменных окружения; у двух последних нет проверки с реальным ключом), правила проверки рекламных формулировок по китайскому закону о рекламе и скрипт без агента llm_make.py. Автор оговаривает: проверки соответствия закону не являются юридической консультацией, Remotion платен для компаний от четырёх человек, плагин для DeepSeek Harness не проверялся на реальной модели. Китайский закон о рекламе — только один из слоёв, сам продукт (видео) не локальный. В README есть реклама спонсоров и просьба о донатах (WeChat).","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"bestagentkits/motion-video-skill","u":"https://github.com/bestagentkits/motion-video-skill","k":"skill","t":"видео","g":1,"s":108,"p":null,"d":"Скилл для создания моушн-графики 1920×1080/30 fps: смены сцен попадают в доли музыки, появления элементов — на произносимые слова, звук без перегрузки. Конвейер фиксирован и каждый шаг пишет файл для следующего: озвучка, звуковые эффекты и музыка через CLI multix (нужны ключи Gemini и ElevenLabs), выравнивание текста по времени, подгонка сетки битов, сборка таймлайна и рендер в HyperFrames (HTML + GSAP). Работа считается законченной только при пройденных измеримых проверках: линт чистый, музыкальные сегменты в пределах ±2 мс от целевого бита, музыка на 4–6 дБ тише речи, громкость около −14 LUFS. Есть два стиля (comic multiverse, glass keynote); готовые проекты в репозиторий не включены из-за размера и лицензий провайдеров. Ключи, по словам автора, остаются в конфигурации multix и не пишутся в файлы проекта. Автор — организация AgentKit.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"kostja94/bricks","u":"https://github.com/kostja94/bricks","k":"skill","t":"интерфейсные компоненты","g":2,"s":104,"p":null,"d":"Скилл component-builder и каталог контрактов компонентов (Footer, FAQ, Task Input, Agent Workspace и др.), которые агент читает перед написанием кода: ответственность компонента, контекст, варианты, состояния, технические границы и требования к проверке. Агент сначала изучает маршруты, компоненты, токены и конвенции проекта, подгружает только нужный справочник и проверяет результат на реальной странице, а не в изолированном превью; для сложных доменов (редакторы, таблицы, календари) велит брать проверенную библиотеку. Валидация каталога и схем — npm test. Автор оговаривает, что скилл не ведёт аудит, не претендует на непроверенные результаты по доступности, производительности или конверсии и не заменяет конвенции проекта; парный проект того же автора — Pagina (страницы целиком).","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"gongdear/cline-pilot","u":"https://github.com/gongdear/cline-pilot","k":"skill","t":"оркестрация","g":4,"s":102,"p":null,"d":"Скилл, который ведёт задачи кодирования в Cline CLI от имени пользователя: передаёт задачу с контекстом и ограничениями, следит за ходом по файлам сессии и «жёстким» уликам (git, отчёты тестов), возвращает точки решения в фиксированном формате из четырёх частей и проверяет результат по шестипунктовому списку перед отчётом «готово». Мониторинг — read-only скрипт на стандартной библиотеке Python; поправки пользователя пишутся в журнал по классам проектов и после двух согласованных примеров переходят в предпочтения. Деструктивные действия (push, удаление, запись в БД, траты, глобальные настройки) всегда идут с вопросом пользователю. Рекомендуемая схема — сильная платная модель для холодного старта и правил, затем небольшая локальная модель для рутины (автор заявляет 50+ тестовых классов на Java-бэкенде, по данным автора).","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"UditAkhourii/quicksilver","u":"https://github.com/UditAkhourii/quicksilver","k":"skill","t":"экономия токенов","g":5,"s":97,"p":null,"d":"Скилл для Claude Code, который отдаёт «массовые суждения» (какие из 187 файлов касаются авторизации, какие из 3000 строк лога настоящие сбои) модели Jev от TypeSafe: она возвращает типизированные вердикты за секунду, а Claude получает короткий список и тратит токены на мышление. Метод — Claude обязан сформулировать один узкий типизированный вопрос (да/нет, метка из закрытого набора, рубрика); есть воспроизводимый бенчмарк из 12 задач (восемь на публичных данных: лог суперкомпьютера, Banking77, SMS Spam, SST-2, кодовая база Hono и др.) со скрытой эталонной разметкой. Автор заявляет по своим данным: −86% токенов Claude (медиана −82%), точность в пределах двух пунктов от Claude на 8 из 12 задач и ускорение до 20×, около 0,004 доллара Jev на задачу. Честно оговаривает, где выигрыша нет, и предупреждает не направлять инструмент на то, что нельзя отправлять третьей стороне. По сути обёртка вокруг чужой идеи (Jev / TypeSafe), заявлена как неофициальная. Осторожно: по дизайну отправляет содержимое файлов проекта на сторонний API api.typesafe.ai, ключ лежит в ~/.quicksilver/config.json, установка запускает код прямо из GitHub через npx; всё описано в README.","h":0,"f":"код наружу","i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"ferndesk/no-slop-motion","u":"https://github.com/ferndesk/no-slop-motion","k":"skill","t":"видео","g":1,"s":86,"p":null,"d":"Скилл для запускающих и брендовых роликов, которые выглядят срежиссированными, а не сгенерированными. Метод: десять «ворот» (входные данные, боль клиентов, сценарий, голос, мир, герой, аниматик, сборка, звук, QA) с утверждаемыми артефактами — бриф, сценарий, голос, пять кадров, аниматик — до полной сборки; есть стартовый проект HyperFrames и скрипты (озвучка Cartesia, оценка дублей, стыковка музыки по долям, линтер запрещённых паттернов, детектор «хлопков» и вспышек, контактные листы). Проверка — чек-листы по каждым воротам и линтеры в скриптах. Оговорки: нужны Node 22+, ffmpeg, Chrome, Python и ключ CARTESIA_API_KEY для озвучки; музыку автор предлагает брать из Suno или лицензионную. Автор — организация Ferndesk.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"huangbai-AI/one-prompt-video-skills","u":"https://github.com/huangbai-AI/one-prompt-video-skills","k":"skill","t":"видео","g":1,"s":79,"p":null,"d":"Три скилла из видео автора: сквозной конвейер «одна фраза — готовый ролик» (сценарий, цифровой ведущий по фото и голосу, B-roll, сборка в HyperFrames, посегментный рендер, проверка кадров), скилл написания сценария в трёхколоночной раскадровке и скилл кодовой анимации. Метод: агент как монтажная команда; проверка — скрипты поиска замёрзших кадров и пауз, писков для цензуры и посегментного рендера, плюс сверка реплик через whisper.cpp пословно. Оговорка автора: нужен китайский CLI «Цзимэн» для аватара, расходует баллы. README на китайском, есть ссылка на текстовый туториал в Feishu.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"itsAalaa7/adhd-study-coach","u":"https://github.com/itsAalaa7/adhd-study-coach","k":"skill","t":"обучение","g":12,"s":74,"p":null,"d":"Учебный коуч для людей с СДВГ: опрашивает по старому материалу до нового, объясняет маленькими порциями по одному вопросу, в конце просит пересказать своими словами; интервальные повторы 1–3–7–16–35–90 дней. Метод опирается на известные эффекты (тестирование, интервалы, нагрузка на рабочую память), а не на «метод для СДВГ»; в RESEARCH.md автор приводит ссылки и честные оценки силы доказательств. Автор прямо оговаривает: исследований именно СДВГ-учеников для повторов и ИИ-тьюторинга почти нет. Это один Markdown-агент без хуков, скриптов и MCP; для других чатов — копирование промпта, прогресс переносится «карточкой».","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"tuzhechen2005/opus-video-skills","u":"https://github.com/tuzhechen2005/opus-video-skills","k":"skill","t":"видео","g":1,"s":72,"p":null,"d":"Набор скиллов для Claude Code, по одному на визуальный стиль: «рисованная акварель и тушь» (p5.js и p5.brush, музыкальные и лирик-клипы с покадровым караоке) и «кинетическая типографика» (2D-холст, three.js, WebGL-постпроцесс, музыка синтезируется из той же таймлинии). Вся картинка и музыка генерируются кодом, без моделей генерации; каждый кадр — чистая функция времени, рендер в headless Chrome и ffmpeg. Примеры: 31-секундный лирик-клип и 84-секундный ролик-портфолио. Заточено под Opus 5.5; ставится как плагин или ссылками в ~/.claude/skills.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"brumar/chess-postmortem-skills","u":"https://github.com/brumar/chess-postmortem-skills","k":"skill","t":"шахматы","g":13,"s":67,"p":null,"d":"Скиллы для разбора своей шахматной партии: Claude сам задаёт Stockfish вопросы, как человек («почему не ход, который я сыграл?»), и пишет объяснения ошибок простым языком, плюс аннотированный PGN, HTML-просмотрщик и озвученное видео партии. Если приложить запись мыслей вслух, whisper.cpp транскрибирует её локально, а тайминги часов из PGN привязывают реплики к ходам, так что опровергается реальное рассуждение игрока. Проверка: выводы сверяются со Stockfish, затем отдельный проход перепроверяет результат. Автор оговаривает: полный прогон занимает около часа, для блица не подходит; пример — его собственная партия с грубой ошибкой; репозиторий выходил на главную Hacker News (по словам автора).","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"rhiever/evident-charts","u":"https://github.com/rhiever/evident-charts","k":"skill","t":"графики и данные","g":2,"s":53,"p":null,"d":"Скилл, учащий агента делать понятные и честные графики и проверять каждый до показа. Сначала проверяет данные (итоги вперемешку с частями, дубли, коды-заглушки, предварительные месяцы), выбирает форму по сути, пишет вывод в заголовок и указывает реального издателя источника. Проверка двойная: линтер в коде (перекрытия текста, обрезанные оси, колонки не с нуля, двойные оси, цвета для дальтоников) и ревью отрендеренного PNG свежим ревьюером до трёх кругов. Работает в Claude Code, Codex, Cursor, Gemini CLI. Автор — Randy Olson, известный исследователь ИИ и визуализации данных (около 6,6 тыс. подписчиков).","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"kaventro/motion-designer","u":"https://github.com/kaventro/motion-designer","k":"skill","t":"видео","g":1,"s":51,"p":null,"d":"Скилл для Claude Code и Codex: пересобирает настоящий интерфейс приложения на HTML, помещает его в iPhone или окно ноутбука, монтирует по долям музыки, проверяет покадрово и рендерит в видео. Метод: режим плана и бриф с четырьмя кадрами на утверждение, затем сборка; кадр — функция seek(t) без таймеров и случайных чисел; музыка — ACE-Step, озвучка — Chatterbox или Kokoro, темп и доли находит beats.py. Проверка: check.mjs ищет таймеры и CSS-анимацию, прогоняет кадры каждые 0,05 с, контролирует замыкание петли, затем контактные листы сверяются с письменным списком типичных ошибок. Установочный install.sh по заявлению README ставит только с согласия пользователя; внутри — официальные установщики fnm и uv через curl | sh.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"nwiizo/rust-learning-lab","u":"https://github.com/nwiizo/rust-learning-lab","k":"skill","t":"обучение","g":12,"s":50,"p":null,"d":"Двуязычный (английский и японский) плагин для Codex и Claude Code с одним скиллом learn-rust: объясняет Rust через синтаксис и обоснование решений, предлагает необязательные упражнения с подсказками и делает учебные ревью PR и коммитов, сохраняемые в Markdown. Метод: на обычный вопрос сначала ответ, затем разбор аргументов, типов, владения и обработки ошибок; в ревью — конкретные проблемы и почему работает исправление. По заявлению автора, плагин без MCP-серверов, хуков и рантайма. Автор оговаривает: проверки синтаксиса и примеров не доказывают качества модели и результатов обучения, сценарии диалогов оцениваются вручную.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"charlie947/motion-graphics-skills","u":"https://github.com/charlie947/motion-graphics-skills","k":"skill","t":"видео","g":1,"s":48,"p":null,"d":"Пакет из 13 скиллов для запускающих роликов, анимированных графиков и рилсов без After Effects: Claude Code пишет анимацию кодом, рисует каждый кадр и рендерит MP4 (через HyperFrames). Первым запускается brand-intake, он пишет brand.md и MOTION.md с цветами, шрифтами и правилами движения, которые читают все остальные скиллы; animated-chart держит значения ровно такими, как заданы. Правила, по словам автора, выросли из реально отвергнутых черновиков; API-ключи не нужны. Автор ведёт рассылку MarTech AI (71 тыс. читателей по данным автора).","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"zack-the-worker/fomo-cc","u":"https://github.com/zack-the-worker/fomo-cc","k":"skill","t":"юмор","g":13,"s":48,"p":null,"d":"Скилл, «прожаривающий» заблуждения вида «клонируй Facebook за час»: бьёт по конкретной иллюзии, подкрепляет реальными цифрами (размер команды, годы работы, инфраструктура, законы рынка) и выводит на реалистичный план на срок, 1–2 недели и 3–6 месяцев с одним ядром цикла. Цифры берутся из отчётности и прессы, хранятся в references/ и по правилу скилла не выдумываются; жёсткость калибруется по абсурдности запроса, нападки на личность исключены. Тон настроен для шести языков, юридические замечания привязаны к рынку, а не к языку. Следует открытому стандарту Agent Skills, работает не только в Claude.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"gongnyang/awesome-ai-motion","u":"https://github.com/gongnyang/awesome-ai-motion","k":"skill","t":"видео и анимация","g":1,"s":47,"p":null,"d":"Справочник движения, читаемый агентом: 637 приёмов, 128 эталонных клипов, 11 рецептов и 7 дизайн-маршрутов; у каждой карточки эффекта — определение, настроенные параметры, примеры, источники и промпты для Claude Code и Codex. Метод: выбирать движение по тому, что должна сообщить сцена; клипы рендерятся локально (Node 20+, ffmpeg, Playwright) в отдельный каталог, исходники не портятся; index.json — канонический каталог. Скилл подключается ссылкой или копированием в ~/.claude/skills; для чтения карточек зависимости не нужны. README на английском и корейском.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"adunext/adu-motion-video","u":"https://github.com/adunext/adu-motion-video","k":"skill","t":"видео","g":1,"s":40,"p":null,"d":"Шаблонный скилл: готовые анимационные шаблоны (две категории, семь стилей, 17 выпущенных групп кадров) с готовыми сценами, переходами и звуками, на которые Codex или Claude Code накладывают ваш закадровый текст и материалы; выдаёт MP4 и редактируемый проект. Плюс публичный API автора с 11 028 Lottie-анимациями (по данным автора, на 2026-10-01). Автор открыто оговаривает: часть шаблонов проверена только на macOS, горизонтальном 1920×1080 и 60 fps, вертикаль нужно перекладывать, а в версии 3.3.0 остались результаты строгого растрового аудита (1 issue, 2 warning). Заявленная экономия токенов («низкий расход») — слова автора без замеров. README на китайском.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"HRuiCcc/RuiC-motion-reel","u":"https://github.com/HRuiCcc/RuiC-motion-reel","k":"skill","t":"видео","g":1,"s":39,"p":null,"d":"Скилл, выпускающий 15-секундный моушн-ролик 1920×1080, 30 fps (450 кадров) целиком кодом: собственный движок с 2× суперсэмплингом векторов и текста, настоящим 3D (параметрические поверхности, облака точек, скрытые линии), печатным конвейером (цветоделение на четыре краски, растр, оттиск) и синтезом саундтрека без сэмплов. Структура: 128 BPM × 8 тактов = ровно 15 секунд, каждая сцена — один такт, монтаж на сильную долю; 15 карт стилей (тёмный HUD, riso, бумага, серебряно-желатиновая печать и др.). По словам автора, весь конвейер прогнан моделью DeepSeek Flash, не привязан к модели. Бренд-ролик DeepSeek сделан как демонстрация без аффилиации.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"minosdevs/copycat-skill","u":"https://github.com/minosdevs/copycat-skill","k":"skill","t":"клонирование сайтов","g":13,"s":37,"p":null,"d":"Скилл «URL в пиксель-точный клон сайта»: Playwright снимает три вьюпорта, фолды и секции, состояния hover, затем скрипт вынимает из браузера шрифты, переменные, палитру, типографику, брейкпоинты и тексты; клон собирается по измеренным значениям секция за секцией (статический HTML/CSS/JS или Next.js). Проверка в цикле: попиксельный diff по вьюпортам, карта худших зон по секциям, дифф дизайна и консоль клона; оценка A–D, цель — расхождение менее 2% и ноль ошибок консоли. Автор оговаривает юридическое: клонировать можно для обучения и своего сайта, чужие логотипы, фото и тексты в продакшене нельзя; логины и пейволлы скилл не обходит, cookie-баннеры скрывает, не принимая.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"farhan-syah/motion-video-skill","u":"https://github.com/farhan-syah/motion-video-skill","k":"skill","t":"видео","g":1,"s":36,"p":null,"d":"Скилл, превращающий короткий бриф, скриншоты или репозиторий в срежиссированный MP4: агент исследует только то, чего вы не дали, пишет концепцию, собирает сцены на HTML/CSS/SVG и рендерит кадр-в-кадр в headless Chromium и ffmpeg. Звуковые эффекты синтезируются из движения на экране, чтобы удар попадал в кадр; озвучка — ваша запись или локальный TTS, слова размечает локальный Whisper. Установка поручается агенту: клон, bun install или npm install, затем doctor; первый speak/transcribe один раз скачивает локальные модели, проверка обновлений — только по запросу, сеть без спроса не используется (по заявлению автора). Оговорка: часть моделей озвучки имеет собственные лицензии.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"sagochiko/aws-drawio-diagram-skill","u":"https://github.com/sagochiko/aws-drawio-diagram-skill","k":"skill","t":"диаграммы","g":2,"s":35,"p":null,"d":"Скилл, рисующий архитектурные схемы AWS в формате .drawio по перечню компонентов: официальные иконки AWS, без декоративных заголовков и легенд; правила вида (вложение рамок, подписи, линии, цвета) записаны в самом скилле. Правила выведены из сравнения пяти способов заставить Claude Code рисовать такие схемы (разбор автора на Qiita). Если установлен draw.io desktop, агент экспортирует схему в PNG и сам проверяет пересечения линий и пропавшие иконки; без него отдаёт без проверки. Автор оговаривает конкуренцию с официальным скиллом AWS и плагином draw.io — вызывать нужно явно. README на японском и английском.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"Gaoyuan-0423/biomedical-paper-reader","u":"https://github.com/Gaoyuan-0423/biomedical-paper-reader","k":"skill","t":"наука","g":13,"s":31,"p":null,"d":"Скилл для разбора одной биомедицинской статьи: идёт по рисункам и аргументу, оценивает границы доказательств и предлагает проверяемые идеи исследований. Принимает PDF, DOI или ссылку; дополнительные материалы берёт только из локальных файлов (скачивает, лишь если явно попросили), каждый основной рисунок читает сначала обзорно, затем нужные панели; отчёт идёт по шаблону от введения до «что можно перенять». Автор оговаривает: отчёт — это чтение с опорой на доказательства, невыполненный код и данные не помечаются как воспроизведённые; при нехватке полного текста, плохом OCR или отсутствии изображений ограничения называются явно. Есть набор проверок и журнал «приёмки» (evals/RESULTS.md) на вымышленных материалах. Отчёт по умолчанию на китайском, версия v0.1.2.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"siliconbag/lego-build","u":"https://github.com/siliconbag/lego-build","k":"skill","t":"видео и анимация","g":1,"s":30,"p":null,"d":"Скилл с анимацией сборки из деталей LEGO в стиле фирменной инструкции (каждый кадр рисуется кодом на Canvas 2D, без картинок и 3D-движка) и мозаикой-портретом из фото в духе LEGO Art. Модель задаётся списком шагов; пример — рыжий кот из 106 деталей, каждая пара «деталь+цвет» сверена с каталогом BrickLink (по заявлению автора), есть второй пример и каталог из 47 деталей. Рендер: Node 20+, ffmpeg, Playwright, node tools/render.cjs. README на русском.","h":0,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"clawyi-com/china-market-data","u":"https://github.com/clawyi-com/china-market-data","k":"skill","t":"финансовые данные","g":13,"s":29,"p":null,"d":"Skill с Python-CLI: котировки А-акций, свечи, отчёты, потоки капитала, ETF, фьючерсы и макро из 34 источников; по данным автора, 87 эндпоинтов, ключ нужен только для iwencai.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"lintsinghua/paint-mv-skills","u":"https://github.com/lintsinghua/paint-mv-skills","k":"skill","t":"видео","g":1,"s":28,"p":null,"d":"Скиллы превращают песню и текст в музыкальный клип в акварельном стиле (p5.brush, headless Chrome, ffmpeg) по пайплайну PDoomVideo.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"bitqs/ai-director-film","u":"https://github.com/bitqs/ai-director-film","k":"skill","t":"видео","g":1,"s":26,"p":null,"d":"Пошаговый туториал по съёмке 3-минутного ИИ-короткометражного фильма; для озвучки нужен API-ключ в .env.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"arla6ka/skills","u":"https://github.com/arla6ka/skills","k":"skill","t":"дизайн-система","g":2,"s":24,"p":null,"d":"Скиллы строят дизайн-систему из приложения и переводят экраны на неё: скриншоты маршрутов до правок, маппинг значений на токены, проверки.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"Mort1d/motion-graphics-skills","u":"https://github.com/Mort1d/motion-graphics-skills","k":"skill","t":"видео","g":1,"s":23,"p":null,"d":"Скилл motion-графики уровня шоурила из кода с оригинальным саундтреком; нужны Node 22.4+, ffmpeg и Chrome, без API-ключей.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"dondonondon/HTML-To-Delphi-FMX","u":"https://github.com/dondonondon/HTML-To-Delphi-FMX","k":"skill","t":"конвертация UI","g":2,"s":23,"p":null,"d":"Скиллы переводят HTML/CSS-макеты в нативные интерфейсы Delphi FireMonkey (FMX) для Codex, Copilot и других агентов.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"Sixian-Li/knowledge-base-kit","u":"https://github.com/Sixian-Li/knowledge-base-kit","k":"skill","t":"база знаний","g":3,"s":22,"p":null,"d":"Набор для Markdown-баз знаний с привязкой утверждений к источникам для Claude Code и Codex; ставится через pip install -r requirements.txt.","h":1,"f":null,"i":7,"a":"agents-weekly-2026-10-02","e":"2026-10-02"},{"n":"afk-yar/1c-testpilot-agent-kit","u":"https://github.com/afk-yar/1c-testpilot-agent-kit","k":"skill","t":"тестирование 1С","g":6,"s":21,"p":null,"d":"Скилл, агент-тестировщик и бенчмарк для ИИ-агентов, тестирующих приложени
